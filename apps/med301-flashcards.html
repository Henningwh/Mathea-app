cture's table lists hydroxyzine, amitriptyline, lorazepam, oxybutynin, theophylline and others.",0],["Is routine CT brain recommended for diagnosing delirium?","No, only if specific indications such as focal signs or head injury","CT is unhelpful if performed routinely; indications are focal signs, low GCS, suspected encephalitis, head injury or raised ICP.",0],["What are the 4AT and AMT characteristics in the lecture?","4AT: sensitivity 89.7%, specificity 84.1%, above 4 suggests delirium; AMT cannot tell delirium from dementia","The AMT is quick but has poor sensitivity and is culture specific.",0],["Which of these should be avoided in delirium management?","Moving the patient to another bed or ward","Transfers, physical restraint, catheters and constipation should be avoided; sedatives only as a last resort.",0],["Which of the following supports delirium rather than dementia?","Fleeting hallucinations and psychomotor change with fluctuating consciousness","The comparison table: delirium fluctuating, consciousness impaired, hallucinations fleeting.",0],["Which drug should be reviewed first in an elderly confused patient on multiple medicines?","Anticholinergic drugs such as oxybutynin","Anticholinergics cause confusion.",0],["Which test is not part of the initial delirium work-up?","Muscle biopsy","Initial tests: glucose, FBC, U&E, LFT, calcium, CRP, TSH, B12, urine, CXR, ECG, ABG.",0],["How does delirium typically begin compared with dementia?","Over hours to days, versus insidiously in dementia","Delirium has acute onset (hours to days); dementia evolves over weeks, months or years.",0],["What should be given intravenously when alcohol use or malnutrition is suspected in delirium?","Thiamine","IV thiamine is given where alcohol or malnutrition is suspected.",0],["A 76-year-old man admitted with pneumonia becomes agitated at night, hallucinating, with fluctuating attention. His wife says he was mentally normal last week. Which assessment points are most diagnostic?","Acute onset with fluctuating course and inattention plus altered consciousness or disorganised thinking (CAM)","CAM requires features 1 and 2 plus 3 or 4.",1],["A hospitalised elderly woman is drowsy, quiet and eats little, with no agitation. Her nurse says she is just depressed. Which statement is the most helpful?","Hypoactive delirium is common and easily missed; screen with 4AT and look for causes such as narcotics or sedatives","Hypoactive delirium follows narcotics and sedatives and is often missed.",1],["Same patient: 4AT shows alertness drowsy (4), AMT4 two errors (2), months backwards untestable (2), acute change present (4). Interpretation and first step?","Score 12: possible delirium; find and treat precipitants","A 4AT score of 4 or more suggests possible delirium; investigate infection, drugs, dehydration and retention.",1]]},{"id":"ep","name":"Epilepsy","cards":[["A 19-year-old has morning jerks of the arms, a generalised convulsion after sleep deprivation, normal MRI and EEG showing polyspike-wave. Which drug (not in pregnancy)?","Sodium valproate","JME responds to valproate; carbamazepine may worsen myoclonic and absence seizures.",0],["A woman has limb thrashing out of phase, eyes forcefully shut and a long episode without tongue biting. Diagnosis?","Psychogenic non-epileptic seizure","Fluttering eyelids, forceful eye closure, pelvic thrusting, out-of-phase movements.",0],["A man with 3 minutes of lip-smacking and confusion lasting 2 minutes, with unaware state. Which seizure type per ILAE 2017?","Focal impaired awareness seizure","Focal onset with impaired awareness.",0],["In adult-onset epilepsy, which aetiology percentages match the NEJM 2008 data?","Stroke 9%, head trauma 9%, alcohol 6%, tumours 3%, infection 2%","About 70% of adults with new-onset epilepsy have focal seizures.",0],["A patient is still seizing 20 minutes after lorazepam. Which dose and sequence match the lecture?","Second-line IV levetiracetam, valproate or phenytoin, then anaesthesia if still seizing","Time is brain: benzodiazepines, then second-line AED, then intubation/anaesthesia.",0],["A 45-year-old has a rising epigastric sensation, smell of burning rubber, lip smacking and amnesia. Which localisation?","Mesial temporal lobe","Typical mesial temporal lobe features; hippocampal sclerosis is the commonest cause.",0],["How does the lecture define drug-resistant epilepsy?","Failure of two tolerated, appropriately chosen AED schedules to achieve seizure freedom","ILAE: failure of adequate trials of two tolerated and appropriately chosen AEDs.",0],["Which initial benzodiazepine doses are quoted for convulsive status epilepticus?","Diazepam 10 mg, midazolam or lorazepam 4 mg, repeated once","Treatment is 'time is brain': ABC, benzodiazepines (2 doses), second-line AED, then anaesthesia by 30 minutes.",0],["How long after a systemic or brain insult can a seizure still count as acute symptomatic?","Within about one week","Acute symptomatic seizures occur at the time of, or in close temporal association (one week) with, a documented insult.",0],["Which condition mimics seizures and shows perioral cyanosis, hand paraesthesiae and carpopedal spasm?","Hyperventilation","Hyperventilation produces perioral paraesthesia and carpopedal spasm.",0],["A woman with JME wants to conceive. Which drug is best avoided and what is the issue?","Valproate: highest malformation and neurodevelopmental risk","Valproate carried about 10% major malformations versus 2.6% unexposed in the EURAP table.",0],["What is the most common identified cause category of adult-onset epilepsy in the NEJM 2008 figures quoted?","No cause found (unknown)","62% of adult-onset epilepsy had an unknown cause; stroke and head trauma were 9% each.",0],["Which feature favours migraine aura over focal seizure?","Positive visual symptoms developing over 15-20 minutes","Migraine aura develops gradually over 15-20 minutes, often with scintillating scotoma.",0],["Which description fits juvenile myoclonic epilepsy?","Adolescent onset with myoclonic jerks, tonic-clonic seizures and normal intellect","JME has adolescent onset, generalized spike and polyspike-wave EEG and normal intellect.",0],["Phenytoin loading in SE requires what monitoring?","ECG and blood pressure (hypotension, bradycardia)","Phenytoin infusion needs a large vein, filter, ECG and BP monitoring.",0],["Which prognostic proportions are quoted?","25% excellent (Rolandic), 35% good, 20% intractable, 15% uncertain, 5% progressive","Intractable epilepsy relates to structural abnormalities and epileptic encephalopathies.",0],["What is the lecture's definition of a seizure?","Transient reduced alertness, abnormal behaviour or involuntary movements","A seizure commonly causes transient reduced alertness, abnormal behaviour or involuntary movements.",0],["A 70-year-old has a first unprovoked seizure; MRI shows an old infarct. What is the epilepsy implication?","Epilepsy can be diagnosed after one seizure with an enduring predisposition","One seizure with an enduring brain disturbance can define epilepsy.",0],["Which seizure has abrupt onset of dread, sweating and tachycardia lasting 20 minutes with intact consciousness?","Panic attack","Panic attacks last 5-30 minutes with prominent autonomic features and no LOC.",0],["What defines SUDEP?","Sudden unexpected death in epilepsy not due to trauma, drowning or status","SUDEP excludes trauma, drowning, status or other known causes.",0],["Metabolic cutoffs: seizures from hypoglycaemia occur at glucose below what?","2.0 mmol/L (36 mg/dl)","Acute symptomatic seizures occur at glucose <36 mg/dl or >450 mg/dl with ketoacidosis.",0],["Childhood absence epilepsy typically begins at what age?","Between 4 and 8 years","Childhood absence epilepsy begins between ages four and eight with absence seizures and 3 Hz-type spike-wave discharges.",0],["A man has transient amnesia for 4 hours, repeated questions, no other deficits, normal awareness. Diagnosis?","Transient global amnesia","TGA: isolated amnesia lasting hours with no alteration of consciousness.",0],["How long does loss of consciousness in syncope usually last?","Under 20 seconds","Syncope causes brief LOC (<20 s) with rapid recovery, in contrast to seizures.",0],["Which investigations does the lecture link with distinguishing pseudoseizures?","Prolactin and ictal EEG","Prolactin and ictal EEG help separate pseudoseizures from epileptic seizures.",0],["Which factor predicts improved epilepsy prognosis?","Idiopathic generalised epilepsy and normal neurology","Better outcomes: idiopathic generalised, normal neurology, few early seizures, response to first AED.",0],["Which statement about the definition of epilepsy is correct?","One seizure plus an enduring brain disturbance can suffice","Epilepsy needs at least one seizure plus an enduring disturbance predisposing to more; a single seizure in a normal or acutely stressed brain does not.",0],["What is the typical history of mesial temporal lobe epilepsy?","Rising epigastric sensation, deja vu, automatisms","Focal impaired-awareness seizures with epigastric sensation, olfactory hallucinations, deja vu and automatisms.",0],["A patient with 10 minutes of continuous convulsion still seizing after lorazepam 4 mg twice. Next step?","IV levetiracetam, valproate or phenytoin","Second-line AED loading while preparing for anaesthesia if refractory.",0],["What is the time point at which tonic-clonic status epilepticus requires emergency treatment (t1)?","5 minutes","ILAE t1 is 5 minutes for tonic-clonic SE; t2 (long-term consequences) is 30 minutes.",0],["What epidemiological figures does the lecture give for epilepsy?","Incidence 5/10,000 and prevalence 75/10,000","The figures are incidence 5/10,000 and prevalence 75/10,000; unprovoked seizure incidence is 23-62/100,000 person-years.",0],["Which epilepsy syndrome begins in adolescence with myoclonic jerks, often on awakening?","Juvenile myoclonic epilepsy","JME: myoclonic jerks, GTCS and sometimes absences in adolescents; normal intellect.",0],["A man faints at the barber, shows two jerks, recovers in 10 seconds. Diagnosis?","Convulsive syncope","Brief LOC with jerks from hypoxia is syncope.",0],["A 22-year-old collapses at a night club after drinking and sleep deprivation, has a generalised convulsion lasting 90 seconds, tongue bite on the side and 20 minutes of confusion. Which feature is most specific for a seizure over syncope?","Lateral tongue biting with prolonged postictal confusion","Longer episodes, tongue biting and postictal confusion favour seizures; convulsive syncope can jerk briefly.",1],["A woman has thrashing out-of-phase limb movements, forceful eye closure, crying afterwards and rapid return to normal. Ictal EEG is unchanged and prolactin normal. Best diagnosis?","Psychogenic non-epileptic seizures","Out-of-phase movements, forceful eye closure, rapid reorientation and normal ictal EEG favour non-epileptic attacks.",1],["A 40-year-old has stereotyped episodes of rising epigastric sensation, burning smell, lip smacking and 2 minutes of amnesia. MRI shows left hippocampal sclerosis. Seizure type and drug choice?","Focal impaired awareness; lamotrigine or levetiracetam","Mesial temporal focal impaired awareness seizures are treated with lamotrigine or levetiracetam.",1],["A 35-year-old has epilepsy and is 8 weeks pregnant on valproate. Which statement is most accurate based on the EURAP table in the lecture?","Valproate carried the highest malformation rate (about 10%), versus 2.6% unexposed","The table shows valproate 10%, carbamazepine 5%, phenobarbital 6%, lamotrigine 3%, levetiracetam 3%.",1]]},{"id":"at","name":"Ataxia and gait","cards":[["A woman has ataxia, areflexia and diplopia after diarrhoea. Anti-GQ1b is positive. Cause of her ataxia?","Proprioceptive loss and not cerebellar dysfunction","In Miller Fisher syndrome ataxia results from proprioceptive loss.",0],["Which condition is associated with sensory ataxia and a slapping, wide-based gait?","Dorsal column disease (e.g. B12 deficiency, tabes dorsalis)","Loss of proprioception produces a wide-based, stamping gait worse in the dark.",0],["Which statement about episodic ataxia is correct?","Types 1 and 2 are commonest; type 1 gives short episodes, type 2 longer, both stress-triggered","The lecture lists eight recognised types.",0],["Which combination points to Friedreich ataxia and not SCA?","Autosomal recessive, onset before 25, areflexia with extensor plantars, GAA expansion, cardiomyopathy","Friedreich: GAA, recessive, arms>legs, dysarthria, loss of reflexes.",0],["A patient walks with a stiff right leg circumducting and the right arm flexed. Which lesion?","Left cerebral hemisphere / UMN","Hemiparetic gait.",0],["A 55-year-old smoker develops subacute pancerebellar syndrome and anti-Hu antibodies. Which cancer?","Small cell lung cancer","Anti-Hu, anti-CV2, anti-VGCC all associate with small cell lung cancer.",0],["Why is a cerebellar haemorrhage or infarct a medical emergency?","Fourth ventricle compression can cause hydrocephalus and herniation","Neurosurgical decompression may be needed for brainstem compression or herniation risk.",0],["Which gait feature is typical of psychogenic gait?","Wild lurching in all directions without falling, with good strength","Astasia-abasia describes this acrobatic gait; strength and postural reflexes are good.",0],["A man walks with high stepping, slapping feet and worsening in the dark. Which sign confirms?","Positive Romberg and loss of vibration","Sensory ataxia.",0],["A child of 4 develops acute gait ataxia and dysarthria two weeks after chickenpox. What is the likely diagnosis?","Postinfectious acute cerebellitis","Acute cerebellar ataxia affects children aged 2-7 after viral infection; recovery is usually complete over weeks.",0],["Which gait shows reduced arm swing, stooped posture and festination?","Akinetic-rigid (Parkinsonian) gait","Narrow-based, slow, shuffling with small steps.",0],["Which investigation matters in adult-onset sporadic ataxia with chronic diarrhoea?","Anti-gliadin antibodies and gut biopsy","Coeliac disease associated ataxia.",0],["Which age group is typically affected by post-infectious cerebellitis?","Children 2-7 years","It follows varicella or other viral infection and usually recovers completely in a few weeks.",0],["SCA3 (Machado-Joseph) features?","Pyramidal and extrapyramidal signs, amyotrophy","SCA3: ataxin-3, CAG repeats, ophthalmoparesis, exophthalmos.",0],["A patient with subacute ataxia, no antibodies and a normal MRI has MCV raised and GGT raised. What is likely?","Alcoholic cerebellar degeneration","MCV and GGT point to alcohol; heel-shin ataxia is prominent.",0],["What type of repeat expansion causes spinocerebellar ataxias?","CAG trinucleotide repeats","SCAs are autosomal dominant CAG expansions; Friedreich is GAA.",0],["Which pathology explains vitamin B12 deficiency ataxia?","Posterior column involvement with impaired proprioception","MRI may show hyperintense signal in the posterior columns; treatment is B12 replacement.",0],["A patient with wide-based gait worsens with eyes closed; vibration absent; ankle reflexes absent. Which type?","Sensory ataxia","Sensory ataxia: positive Romberg, loss of proprioception.",0],["A man with chronic alcohol misuse has gait ataxia, preserved arms. MRI?","Vermian atrophy","Alcoholic degeneration predominantly affects the vermis.",0],["Which gait is described as 'magnetic', with small shuffling steps and impaired initiation?","Frontal gait","Frontal gait shows difficulty lifting the feet and, in severe cases, stepping in place.",0],["A patient has intention tremor, nystagmus and scanning speech. Which lesion?","Cerebellum","Cerebellar signs.",0],["Which gait is characteristic of hip-girdle weakness (e.g. myopathy)?","Waddling gait","Weak hip abductors cause pelvic tilt: waddling or Trendelenburg gait.",0],["What is 'scissoring gait'?","Adductor spasticity causing legs to cross","Spastic paraparetic gait: legs stiff and adducted, crossing while walking.",0],["Which gait involves circumduction of a stiff leg and a flexed arm held to the side?","Hemiparetic gait","Hemiparetic gait is typical of stroke and UMN lesions.",0],["A 20-year-old has ataxia, absent reflexes, extensor plantars, scoliosis, pes cavus and cardiomyopathy. Diagnosis?","Friedreich ataxia","Friedreich: GAA expansion, ECG changes, diabetes, optic atrophy.",0],["What is the right management of cerebellar infarct with brainstem compression and hydrocephalus?","Neurosurgical decompression","Cerebellar stroke is an emergency; decompression may be needed.",0],["Which triad defines Miller Fisher syndrome?","Ataxia, areflexia and ophthalmoplegia","MFS is a GBS variant with anti-GQ1b antibodies.",0],["Which condition is the most common cause of acquired cerebellar degeneration?","Chronic alcohol abuse","Alcoholic cerebellar degeneration predominantly affects the vermis.",0],["What is 'astasia-abasia'?","Dramatic psychogenic gait with good strength and no falls","Psychogenic gait: extreme postures and lurching without falling.",0],["Which antibody is associated with breast and gynaecological cancer in paraneoplastic cerebellar degeneration?","Anti-Yo","Anti-Yo: breast and gynaecological tumours; anti-Tr: Hodgkin lymphoma; anti-VGCC: SCLC.",0],["Which characteristics are typical of ataxia-telangiectasia?","Autosomal recessive cerebellar ataxia in childhood with telangiectasias","Listed among autosomal recessive cerebellar ataxias.",0],["SCA7 uniquely features?","Pigmentary macular degeneration","SCA7 involves ataxin-7 and retinal degeneration.",0],["Which gait is described as 'magnetic' with feet seeming stuck to the floor?","Frontal gait","Frontal gait: small shuffling hesitant steps with difficulty lifting the feet.",0],["Romberg's test is positive only when the eyes are closed in which type of ataxia?","Sensory ataxia","Sensory (proprioceptive) ataxia worsens with eyes closed. Cerebellar ataxia is present with eyes open or closed.",0],["Which genetic features characterise Friedreich ataxia?","GAA repeat expansion, onset before 25, areflexia and extensor plantars","Friedreich ataxia is AR with GAA expansion, onset often <25, loss of reflexes, extensor plantars and impaired vibration/proprioception.",0],["Which gait results from foot drop?","Steppage gait","Steppage: high stepping due to weak ankle dorsiflexion (e.g. peroneal neuropathy).",0],["A 45-year-old with long-standing alcohol misuse has a wide-based gait with heel-shin ataxia and normal arms; MRI shows vermian atrophy. Best statement?","Alcoholic cerebellar degeneration; abstinence and nutrition give limited improvement","Vermian atrophy with truncal and gait ataxia evolves over weeks to months; recovery is limited.",1],["A 22-year-old has ataxia since age 14, dysarthria, absent ankle jerks, extensor plantars, scoliosis, pes cavus and hypertrophic cardiomyopathy. Gene defect and inheritance?","GAA expansion; autosomal recessive (Friedreich ataxia)","Friedreich ataxia: recessive GAA expansion with areflexia, extensor plantars, cardiomyopathy and diabetes.",1],["A 68-year-old has a small-stepped gait with feet stuck to the floor, urinary urgency and mild cognitive decline. Arm swing and tone are preserved. Gait and likely cause?","Frontal (magnetic) gait; normal pressure hydrocephalus","Gait initiation failure with preserved arm swing, incontinence and cognitive change suggests hydrocephalus.",1],["A man develops ataxia, areflexia and ophthalmoplegia 10 days after gastroenteritis. Which antibody and why is the ataxia not cerebellar?","Anti-GQ1b; proprioceptive loss in Miller Fisher syndrome","Miller Fisher variant of GBS: IgG anti-GQ1b in over 90%; ataxia reflects proprioceptive loss.",1],["A 67-year-old hypertensive has sudden vertigo, vomiting, headache and inability to walk. CT shows a right cerebellar infarct compressing the fourth ventricle, and he is drowsy. Priority?","Neurosurgical review for decompression","Cerebellar stroke with depressed arousal indicates brainstem compression or hydrocephalus and may need decompression.",1]]},{"id":"dz","name":"Dizziness and vertigo","cards":[["A 55-year-old woman has 30-second spinning on turning over in bed, with torsional upbeating nystagmus after Dix-Hallpike toward the right that fatigues. What is the diagnosis?","Right posterior canal BPPV","Short positional vertigo with latent, fatiguing torsional nystagmus is classic BPPV.",0],["A patient has acute continuous vertigo, normal head impulse test, direction-changing nystagmus and inability to stand. What is the implication?","Possible posterior circulation stroke (HINTS central)","A normal head impulse with direction-changing nystagmus suggests a central cause.",0],["A patient with syncope has a family history of sudden death and ECG with long QT. What is the correct reasoning?","Cardiac syncope from arrhythmia needs cardiology and avoiding QT drugs","Long QT predisposes to torsades and requires specialist management.",0],["A 50-year-old has episodes of vertigo lasting hours with tinnitus, fluctuating low-frequency hearing loss and aural fullness. Diagnosis?","Meniere disease","This is the classic Meniere pattern; low-salt diet and diuretics are used.",0],["Which drug class is used for short-term control of acute vertigo but delays compensation if prolonged?","Vestibular suppressants (e.g. prochlorperazine)","Vestibular suppressants should be used briefly in acute vertigo only.",0],["What blood pressure drop defines orthostatic hypotension within 3 minutes of standing?","At least 20 mmHg systolic or 10 mmHg diastolic","Orthostatic hypotension: fall of >=20 systolic or >=10 diastolic within 3 min of standing.",0],["An old man faints on standing after starting tamsulosin and diuretic. Which management is first?","Review and stop offending drugs, hydrate","Drug-induced orthostatic hypotension is managed by medication review and rehydration.",0],["A hypertensive smoker has sudden vertigo, vomiting, inability to walk and a headache. Which diagnosis must be excluded urgently?","Cerebellar haemorrhage or infarction","Acute vertigo with severe imbalance and vascular risk factors suggests cerebellar stroke.",0],["Carotid sinus syncope typically occurs in what setting?","Neck turning, tight collar or shaving in an older man","Carotid sinus hypersensitivity causes syncope after pressure on the neck.",0],["A patient's Dix-Hallpike toward the left reproduces vertigo with upbeating torsional nystagmus after a 5 s latency that fades in 20 s. Which step is most appropriate?","Left Epley manoeuvre","Typical posterior canal BPPV is treated by canalith repositioning.",0],["A patient with BP 140/90 supine, 105/70 standing with no rise in heart rate and no sweating. Which cause?","Autonomic failure","A fixed heart rate with postural hypotension suggests neurogenic autonomic failure.",0],["A patient has unilateral tinnitus, progressive hearing loss and loss of corneal reflex. Which lesion?","Cerebellopontine angle tumour (vestibular schwannoma)","CN VIII symptoms with CN V involvement suggest a CP angle mass; BAEP and MRI help.",0],["An athlete collapses suddenly during exercise without warning. Which syncope type is worrying?","Cardiac syncope","Exertional syncope without prodrome suggests structural heart disease or arrhythmia.",0],["Which structure is damaged in a typical peripheral vestibular cause of vertigo?","Inner ear labyrinth or vestibular nerve","Peripheral vertigo arises from the labyrinth or the vestibular nerve.",0],["A 70-year-old on antihypertensives feels dizzy and nearly faints on standing, BP drops from 150/90 to 115/70 after 2 minutes. Diagnosis?","Orthostatic hypotension","A fall >=20 systolic or >=10 diastolic confirms orthostatic hypotension; review medicines.",0],["Which feature favours seizure over syncope?","Tongue biting, prolonged postictal confusion","Seizures have longer LOC, postictal confusion and lateral tongue biting; syncope recovers within seconds.",0],["What is the most common cause of vertigo triggered by head position changes?","Benign paroxysmal positional vertigo","BPPV causes brief episodes of vertigo with head position changes, usually from the posterior semicircular canal.",0],["Which lifestyle advice is usually given in Meniere disease?","Low-salt diet","Low salt intake (and diuretics) are used to reduce endolymphatic pressure.",0],["Which syncope has very short LOC, stereotyped triggers and normal ECG and exam?","Reflex (vasovagal)","Reflex syncope diagnosis is clinical when ECG and exam are normal.",0],["Downbeat nystagmus suggests a lesion at which site?","Foramen magnum / posterior fossa","Downbeat nystagmus indicates foramen magnum or cerebellar lesions such as Chiari malformation.",0],["A young man faints at the sight of blood, preceded by nausea, sweating and pallor. Diagnosis?","Vasovagal syncope","Vasovagal syncope has a prodrome and clear trigger.",0],["A 40-year-old has 3 days of continuous vertigo, vomiting and normal hearing after a viral illness. Head impulse is abnormal. Diagnosis?","Vestibular neuritis","Acute continuous vertigo without hearing loss and with abnormal head impulse suggests vestibular neuritis.",0],["In the Dix-Hallpike, the nystagmus has no latency, is vertical downbeating and does not fatigue. What does this suggest?","A central lesion","Non-fatiguing vertical downbeating positional nystagmus suggests a central cause.",0],["What fluid lies inside the membranous labyrinth?","Endolymph","Endolymph is inside the membranous labyrinth; perilymph is outside.",0],["A 58-year-old woman has 20-30 seconds of spinning when she rolls right in bed or looks up. Hearing is normal. Dix-Hallpike to the right gives torsional upbeat nystagmus after a few seconds that fades within a minute. Best management?","Epley manoeuvre for right posterior canal BPPV","Short positional vertigo with latent, fatiguing torsional nystagmus is posterior canal BPPV on the side tested.",1],["A 74-year-old wakes with room spinning, nausea, left facial numbness, hoarse voice and gait ataxia but normal hearing. Which structure is the likely culprit and why does this go against BPPV?","Lateral medulla (PICA territory); multiple brainstem signs show a central cause","Brainstem signs with vertigo indicate a central vestibular lesion, in contrast to BPPV's isolated positional vertigo.",1],["A man standing at a barber feels warm and sweaty, vision narrows and he falls. He is pale, has two arm jerks and wakes after 15 seconds fully orientated. Which feature best favours syncope over seizure?","Prodrome with trigger and rapid orientated recovery","Precipitant, prodrome and rapid recovery favour syncope; brief hypoxic jerks (convulsive syncope) can occur.",1]]},{"id":"se","name":"Sensory system","cards":[["A man has bilateral arm pain/temperature loss with preserved light touch and vibration, plus later hand wasting and brisk leg reflexes. Cause?","Syrinx expanding into anterior horn and corticospinal tracts","The syrinx first cuts crossing spinothalamic fibres, then anterior horn and long tracts.",0],["A patient has loss of vibration in the feet, extensor plantars, absent ankle jerks and macrocytic anaemia. What is the mechanism?","B12 deficiency damaging dorsal columns, corticospinal tract and peripheral nerves","Mixed UMN/LMN with posterior column loss is subacute combined degeneration.",0],["A woman develops burning pain, swelling and colour changes in her hand six weeks after wrist fracture. Pain is out of proportion. Diagnosis?","Complex regional pain syndrome","CRPS follows minor trauma; allodynia, oedema, and skin colour/temperature changes.",0],["A patient has right leg weakness, loss of right vibration, left leg loss of pinprick below T10, and ipsilateral reflexes brisk. What explains the pattern?","Right T10 cord hemisection: ipsilateral corticospinal and dorsal column loss, contralateral spinothalamic loss","Brown-Sequard: ipsilateral UMN and dorsal column signs, contralateral pain/temperature loss beginning about 1-2 levels below.",0],["A 38-year-old woman has widespread pain for 6 months, tender points, poor sleep and fatigue with normal blood tests. Diagnosis?","Fibromyalgia","Widespread chronic pain with fatigue and sleep disturbance and normal investigations suggests fibromyalgia.",0],["After wrist fracture, a patient has swelling, warmth, shiny skin and allodynia spreading beyond the injury. Which management emphasis?","Early mobilisation, physiotherapy and pain management","CRPS is managed with physiotherapy, desensitisation, analgesics and early mobilisation.",0],["Which lesion produces loss of two-point discrimination and graphaesthesia with intact primary modalities?","Parietal cortex","Cortical sensory loss affects discriminative modalities.",0],["Which sensory pathway statement is correct about pain and temperature?","Fibres cross over within the spinal cord","Crossing in the cord explains dissociated loss in syringomyelia.",0],["A strict vegan has paraesthesiae, loss of vibration, positive Romberg and extensor plantars. Which condition?","Subacute combined degeneration (B12 deficiency)","B12 deficiency damages dorsal columns and corticospinal tracts.",0],["Which sensory modality is classically lost first in dorsal column disease such as tabes dorsalis?","Vibration and proprioception","Dorsal column disease impairs vibration and joint position sense, causing sensory ataxia.",0],["Where do second-order spinothalamic neurons ascend after crossing?","In the contralateral anterolateral cord to the thalamus","They synapse in the ventral posterolateral thalamus.",0],["Which symptoms suggest a large fibre neuropathy?","Tingling, paraesthesias, numbness and weakness","Large fibre neuropathies cause tingling and weakness; small fibre ones cause pain/temperature loss and autonomic signs.",0],["A lesion of the posterior limb of the internal capsule typically produces?","Contralateral hemiparesis and hemisensory loss","Corticospinal and thalamocortical fibres are compact in the capsule.",0],["Which thalamic nucleus relays body sensation to the cortex?","Ventral posterolateral nucleus","Face sensation is relayed via the ventral posteromedial nucleus.",0],["What sensory pattern is seen in length-dependent axonal neuropathies?","Stocking (glove-and-stocking) sensory loss","Axonal neuropathies show length-dependent stocking loss; myelopathies show a sensory level.",0],["A patient has loss of vibration and position sense in the right leg and loss of pain and temperature in the left leg from the umbilicus down. Which lesion?","Right hemisection of the cord (Brown-Sequard)","Dorsal columns are ipsilateral, spinothalamic contralateral, so the lesion is on the side of dorsal column loss.",0],["A patient has ipsilateral facial pain/temperature loss and contralateral body pain/temperature loss with dysphagia and Horner syndrome. Diagnosis?","Lateral medullary (Wallenberg) syndrome","Wallenberg: crossed sensory loss, Horner syndrome, ataxia, dysphagia.",0],["What is hyperalgesia?","An increased response to a normally painful stimulus","Hyperalgesia is an exaggerated pain response to a stimulus that is normally painful.",0],["A patient with a thalamic stroke develops months later burning pain in the numb contralateral hemibody. What term?","Central (thalamic) pain","Dejerine-Roussy thalamic pain syndrome.",0],["Which feature distinguishes CRPS from fibromyalgia?","Regional pain with autonomic and trophic changes after injury","CRPS: regional with allodynia, swelling, colour change; fibromyalgia: widespread tender points, fatigue.",0],["Which disease processes produce dissociated sensory loss?","Syringomyelia and subacute combined degeneration (B12 deficiency)","Dissociated loss is seen in syringomyelia and SCDC, for example from vitamin B12 deficiency.",0],["Which condition is characterised by widespread musculoskeletal pain, fatigue and sleep disturbance with tender points?","Fibromyalgia","Fibromyalgia: widespread pain, tender points, fatigue, non-restorative sleep.",0],["Which sensory modality tests the dorsal columns at the bedside?","Vibration with 128 Hz tuning fork","Vibration and joint position test the dorsal columns; pinprick and temperature test the spinothalamic tract.",0],["Where do spinothalamic fibres cross?","In the spinal cord, within a few segments of entry","Second-order spinothalamic neurons cross in the anterior white commissure close to their level of entry.",0],["Six weeks after a wrist fracture a woman has burning hand pain out of proportion, swelling, shiny cool skin and pain on light touch. X-ray shows patchy osteopenia. Best statement?","Complex regional pain syndrome; treat with early mobilisation and analgesia","CRPS follows trauma with allodynia, oedema and autonomic change; early mobilisation is favoured.",1],["A strict vegan has foot tingling, absent vibration and position sense, a positive Romberg, brisk knees, absent ankle jerks, extensor plantars and macrocytic anaemia. Explanation?","B12 deficiency damaging dorsal columns, corticospinal tracts and nerves","Subacute combined degeneration produces mixed posterior column, pyramidal and neuropathic signs; treat with B12.",1],["A 41-year-old woman has 2 years of widespread aching, morning stiffness, fatigue, poor sleep and multiple tender points. CK, ESR, blood count and neurological examination are normal. Best interpretation?","Fibromyalgia, a clinical diagnosis with normal tests","Widespread pain, fatigue and unrefreshing sleep with normal investigations is fibromyalgia.",1]]},{"id":"wk","name":"Weakness","cards":[["A 60-year-old man has proximal weakness, rising from a chair is difficult, CK is raised and EMG shows positive sharp waves. What is the next test to diagnose?","Muscle biopsy","Biopsy confirms the type of inflammatory myopathy.",0],["A patient has asymmetric weakness of right foot dorsiflexion and loss of sensation on the dorsum of the foot after crossing legs. Which site?","Common peroneal nerve at the fibular head","Foot drop with dorsum sensory loss localises to the peroneal nerve; an L5 root lesion also affects inversion.",0],["A 28-year-old woman has fluctuating ptosis, diplopia and dysphagia, AChR antibodies positive, CT chest: thymoma. Which definitive treatment?","Thymectomy plus immunosuppression","Thymectomy is indicated in all thymoma patients.",0],["A child has Gowers sign, CK 20000, no dystrophin staining on biopsy. Which treatment option does the lecture list?","Steroids, physiotherapy and gene therapy","Treatment: drugs, gene therapy, physiotherapy/OT, orthoses, genetic counselling.",0],["What distinguishes Duchenne muscular dystrophy?","Genetic myopathy with fibres replaced by fat and connective tissue, with calf hypertrophy","Muscular dystrophies have no sensory symptoms.",0],["A patient has weakness of hip flexion and hip adduction with an absent knee jerk after diabetes. Which lesion?","Lumbosacral plexopathy (diabetic amyotrophy)","Multiple roots L1-L3 together suggests the plexus.",0],["A man has right arm weakness, absent biceps reflex with brisk finger flexor reflex and a spastic gait. Which level?","C5-C6 cord compression","Root-level LMN signs at the lesion, UMN signs below it.",0],["Which pattern defines mononeuritis multiplex?","Successive involvement of multiple individual nerves, often with pain","Mononeuropathy multiplex: successive dysfunction of multiple peripheral nerves, typically painful.",0],["Amyotrophic lateral sclerosis affects which structures?","Both corticospinal tracts and anterior horn cells","ALS combines UMN and LMN involvement without sensory loss.",0],["How sensitive are repetitive nerve stimulation and single-fibre EMG in MG?","RNS about 75% (>10% decrement); SFEMG over 95%","Edrophonium testing is positive in about 90%.",0],["A patient with polymyositis fails steroids and shows rimmed vacuoles on repeat biopsy. Revised diagnosis?","Inclusion body myositis","IBM shows inflammatory cells plus rimmed vacuoles and is steroid-resistant.",0],["A man with MG is given gentamicin for sepsis and develops respiratory weakness. Why?","Aminoglycosides impair neuromuscular transmission","Aminoglycosides can precipitate myasthenic crisis.",0],["Which antibody frequencies are quoted for myasthenia gravis?","AChR in 85-90% of generalized and 50-70% of ocular; MuSK in about 40% of seronegative","Anti-striatal antibodies (titin, ryanodine) occur in about 30% of thymoma patients.",0],["Which sign set characterises a lower motor neuron lesion?","Wasting, fasciculations, normal or absent reflexes","LMN signs: wasting, fasciculations, normal tone, reduced/absent reflexes, down-going plantars.",0],["What are the features of dermatomyositis in the lecture?","Gottron's papules and heliotrope rash with perifascicular atrophy","Prognosis is generally good with 10-year survival over 90%.",0],["A patient has back pain radiating to the leg, weak big toe extension and an absent reflex? Which lesion?","Radiculopathy","Radiculopathy causes pain, weakness in the myotome and sensory loss in the dermatome.",0],["What are the EMG findings in myopathy?","Short-duration, low-amplitude polyphasic units and positive sharp waves","Diagnosis combines history, CK, antibodies, EMG, MRI and biopsy.",0],["Which feature of this lesion localises to the neuromuscular junction rather than muscle?","Fatigability with normal CK, ocular involvement and fluctuation","MG: fatigable weakness, ptosis, diplopia, normal CK.",0],["A diabetic man has painful asymmetric proximal leg weakness, weight loss and thigh wasting. Which diagnosis?","Diabetic amyotrophy (lumbosacral radiculoplexus neuropathy)","Painful proximal asymmetric weakness with diabetes.",0],["Thymectomy is indicated in which situations?","All thymoma and young AChR-positive generalized MG, but not MuSK-MG","Thymic hyperplasia occurs in about 80% of younger patients; thymoma in about 7%.",0],["Which drug class should be avoided in myasthenia gravis?","Aminoglycoside antibiotics","Aminoglycosides, quinine and beta-blockers impair neuromuscular transmission.",0],["Which test confirms the dystrophin deficiency in Duchenne muscular dystrophy?","Immunocytochemistry or Western blot of muscle","Muscle biopsy with immunostaining shows absent dystrophin.",0],["A lesion in the base of the pons produces which pattern?","Ipsilateral face and contralateral arm and leg weakness","Fibres to the face have crossed at the pons but those to the body cross at the medulla.",0],["A man with myositis has no response to steroids, slowly progressive finger flexor and quadriceps weakness. Which is the likely diagnosis?","Inclusion body myositis","IBM does not respond well to immunosuppression and affects finger flexors and quadriceps.",0],["Which antibody is found in 85-90% of generalised myasthenia gravis?","Anti-acetylcholine receptor antibody","AChR antibodies are positive in 85-90% of generalised and 50-70% of ocular MG.",0],["Which drug may trigger necrotizing autoimmune myositis?","Statins","NAM may be triggered by statins; dermatomyositis in adults may be associated with malignancy.",0],["What pattern of weakness results from a spinal cord lesion?","UMN weakness below the lesion and root-pattern weakness at the level","Cord lesions give UMN signs below the lesion, a sensory level and bladder/bowel involvement.",0],["A 62-year-old woman has trouble climbing stairs and combing her hair for 3 months, with a violaceous eyelid rash and scaly patches over her knuckles. CK is raised. Which additional step is most important?","Screen for underlying malignancy","Heliotrope rash and Gottron papules with proximal weakness is dermatomyositis, which in adults may accompany cancer.",1],["A diabetic man has abrupt severe right thigh pain then weakness of hip flexion and knee extension, thigh wasting and an absent knee jerk. Spine MRI is normal. Diagnosis?","Diabetic amyotrophy (lumbosacral plexopathy)","Painful asymmetrical proximal leg weakness in diabetes localises to the lumbosacral plexus.",1],["A man with myasthenia gravis given gentamicin for pneumonia develops dysphagia and shallow breathing within a day. Mechanism and action?","Aminoglycoside impairs neuromuscular transmission; stop it and support ventilation","Aminoglycosides, quinine and beta-blockers can precipitate myasthenic weakness.",1],["A 70-year-old has slowly progressive finger flexion and quadriceps weakness with falls. CK is mildly raised; biopsy shows endomysial inflammation and rimmed vacuoles. Prednisolone has not helped. Diagnosis?","Inclusion body myositis","Finger flexor and quadriceps weakness with rimmed vacuoles and steroid resistance is IBM.",1]]},{"id":"cm","name":"Coma","cards":[["A patient after cardiac arrest opens his eyes spontaneously, has sleep-wake cycles but does not follow commands or track objects for several months. What is this state?","Persistent vegetative state (unresponsive wakefulness)","Wakefulness without awareness is the vegetative state; coma lacks eye-opening and sleep-wake cycles.",0],["A patient has absent corneal, oculocephalic and cough reflexes, no respiratory effort off the ventilator at PaCO2 above 6.0 kPa, and a core temperature of 33°C. What is the correct step?","Warm to normal temperature before declaring brainstem death","Hypothermia, drugs and metabolic derangements are confounders and must be corrected before brainstem death testing.",0],["An unconscious patient has E1 V1 M4, one dilated fixed pupil, bradycardia and hypertension after head injury. Which sequence explains the signs?","Raised ICP with uncal herniation compressing CN III, then Cushing response","Rising ICP with herniation compresses the third nerve; Cushing reflex (hypertension, bradycardia, irregular breathing) follows.",0],["A patient is fully aware but can only blink and move the eyes vertically after a basilar artery stroke. How can you tell this is not coma?","Eye-opening is purposeful and blinking answers questions","In locked-in syndrome, consciousness is preserved and communication occurs via blinking and vertical eye movements.",0],["A patient has absent eye movements on caloric testing yet is breathing spontaneously and responding to command with a finger tap. What is the best interpretation?","Locked-in syndrome with a ventral pontine lesion","Awareness with command-following despite loss of lateral gaze and quadriparesis indicates locked-in syndrome.",0],["What happens in the oculovestibular reflex of a patient with intact brainstem when cold water is instilled in the right ear?","Slow eye deviation to the right with fast phase to the left","Cold water causes the slow phase toward the irrigated ear and the fast phase away (COWS) in awake patients; in coma only the tonic deviation toward the cold ear occurs.",0],["In a comatose patient, which observation would suggest a metabolic rather than structural cause?","Preserved pupillary light reflexes with symmetrical findings","Metabolic coma classically preserves pupillary reflexes and shows symmetrical signs.",0],["Which bedside test should be done immediately in all patients with reduced consciousness?","Capillary blood glucose","Hypoglycaemia is an immediately reversible cause and must be checked at once.",0],["A GCS of E4 V1 M1 with eyes open and no sleep-wake cycles indicates what in the first weeks after severe injury?","Unresponsive wakefulness requires awareness assessment before labelling","Eye-opening without awareness is the vegetative state; the label depends on duration and absence of awareness.",0],["Which findings describe Horner's syndrome and its link to carotid dissection?","Miosis, partial ptosis, ipsilateral anhidrosis and enophthalmos","Carotid artery dissection can produce ipsilateral Horner's syndrome.",0],["Which posture is associated with a lesion at the level of the midbrain or pons, with extension of all four limbs?","Decerebrate posturing","Decerebrate posturing involves extension of arms and legs and indicates brainstem dysfunction.",0],["Which respiratory pattern is classically seen with bilateral hemispheric or diencephalic dysfunction?","Cheyne-Stokes respiration","Cheyne-Stokes is a waxing and waning pattern with apnoeic pauses, linked to bilateral hemispheric/diencephalic lesions.",0],["In a comatose patient, equal reactive pupils, absent caloric response and normal CT. Which cause is most likely?","Toxic or metabolic cause such as sedative overdose","Preserved pupils with brainstem reflex loss and no structural lesion suggest a drug effect.",0],["A man is found unresponsive. Eyes open to pain, he makes incomprehensible sounds and flexes his arm abnormally to pain. What is his GCS?","7 (E2 V2 M3)","Eyes open to pain = 2, incomprehensible sounds = 2, abnormal flexion (decorticate) = 3, total 7.",0],["A comatose patient has a unilaterally dilated, fixed right pupil and left hemiparesis after head injury. What is the most likely mechanism?","Right uncal herniation compressing the oculomotor nerve","A blown pupil on the side of an expanding mass indicates uncal herniation compressing CN III.",0],["A patient is unconscious with fever, neck stiffness and petechial rash. What should be started immediately?","IV antibiotics","Suspected bacterial meningitis requires immediate empirical antibiotics; do not delay for LP or CT.",0],["Which term describes a patient who is awake and aware but can only move the eyes and blink because of a ventral pontine lesion?","Locked-in syndrome","Locked-in patients are conscious but quadriplegic and unable to speak, communicating with vertical eye movements and blinking.",0],["Which structure is typically affected in Horner's syndrome from carotid dissection?","The ipsilateral sympathetic supply to the eye and face","The syndrome gives unilateral miosis, partial ptosis, anhidrosis and enophthalmos.",0],["Which posture involves flexion of the arms with extended legs?","Decorticate posturing","Decorticate = arms flexed, legs extended; decerebrate = arms and legs extended with pronation.",0],["What are the three components of the Glasgow Coma Scale?","Eye opening, verbal response, motor response","The GCS scores eye opening (1-4), verbal response (1-5) and motor response (1-6).",0],["A patient with opioid overdose has pinpoint pupils and RR 6/min. What is the specific treatment?","Naloxone","Naloxone reverses opioids; flumazenil reverses benzodiazepines.",0],["A diabetic man is found unconscious, with sweating and tachycardia. What should be given immediately?","IV glucose (dextrose)","Hypoglycaemia is the fastest reversible cause; give glucose with thiamine when appropriate.",0],["A comatose patient is thought to have a benzodiazepine overdose. Which antidote is used?","Flumazenil","Flumazenil is the benzodiazepine antagonist (cautiously, due to seizure risk).",0],["A 24-year-old is brought in after a collision. Eyes open only to pressure, he moans without words and withdraws the right arm from pain, while the left arm and leg extend. The left pupil is 6 mm and unreactive, the right 3 mm and reactive. Which GCS and mechanism fit best?","GCS 7; left uncal herniation compressing the left oculomotor nerve","Eye opening to pressure 2 + incomprehensible sounds 2 + withdrawal 4 (best limb response) = 7. A unilateral fixed dilated pupil is third-nerve compression from uncal herniation, ipsilateral to the mass.",1],["A patient has spontaneous eye opening with eye movements but no response to commands for 2 months after a hypoxic injury and has intact sleep-wake cycles. A relative asks whether he is brain dead. Which statement is accurate?","No: brainstem function is intact; this is vegetative state, not brain death","Brain death requires absent brainstem reflexes and apnoea; the vegetative state has preserved brainstem function and sleep-wake cycles.",1],["After a basilar artery occlusion a man cannot move his limbs or speak, but moves his eyes up and down and blinks twice for yes. EEG shows reactive alpha. What is the correct interpretation?","Conscious; ventral pontine lesion sparing vertical gaze and blinking","Locked-in syndrome leaves awareness and vertical eye movements intact; EEG is usually normal.",1]]},{"id":"ni","name":"Neurologic investigations","cards":[["A patient with ascending weakness has NCS showing absent F-waves, conduction block and prolonged distal latencies. CSF protein 2.1 g/L, cells 3. Which diagnosis and plan?","Guillain-Barre syndrome; IVIG or plasma exchange with respiratory monitoring","Demyelinating pattern with albuminocytological dissociation is GBS.",0],["A patient with proximal weakness has EMG with fibrillations, positive sharp waves, small polyphasic units. Biopsy shows perifascicular atrophy and rash. What next screening in an adult?","Search for malignancy","Adult dermatomyositis is associated with malignancy.",0],["Which sequence correctly describes the CT/MRI choice for suspected stroke?","CT first to exclude haemorrhage; MRI DWI more sensitive for early infarct","CT is fast and excludes blood; DWI MRI detects early ischaemia.",0],["A patient has a pre-treatment visual evoked potential P100 latency of 140 ms (normal 100). Which condition is likely?","Optic neuritis or MS","P100 delay indicates demyelination of the anterior visual pathway.",0],["A child stares for 10 seconds repeatedly; EEG during hyperventilation shows 3 Hz generalised spike-wave. Which diagnosis?","Childhood absence epilepsy","Absence seizures with 3 Hz spike-wave are provoked by hyperventilation.",0],["A coma patient post-cardiac arrest has bilaterally absent N20 on SSEP at day 3. What does this predict?","Poor neurological outcome","Bilateral absence of N20 indicates poor prognosis.",0],["Interictal EEG shows focal temporal sharp waves; MRI shows hippocampal sclerosis; FDG-PET interictal would show?","Hypometabolism in the temporal lobe","Interictal PET: decreased metabolism; ictal: increased.",0],["Which EEG rhythm appears over the posterior head when the eyes are closed in quiet wakefulness?","Alpha","Alpha is attenuated by eye opening and is seen with relaxed wakefulness and closed eyes.",0],["Which CSF pattern would you expect in an MS relapse?","Mild lymphocytosis, mildly raised protein, oligoclonal bands","Intrathecal oligoclonal IgG supports MS.",0],["How do muscle biopsy patterns differ?","Normal: chequerboard; neurogenic: type grouping; myopathic: atrophic fibres","Polymyositis shows mononuclear inflammatory cells invading healthy fibres.",0],["A patient with fatigable weakness has a normal CK, normal NCS, 8% decrement and increased jitter on SFEMG. Interpretation?","Neuromuscular junction disorder; SFEMG is the most sensitive","Normal CK/NCS with jitter means NMJ transmission defect even if RNS is below 10%.",0],["An EEG shows periodic sharp waves, MRI DWI cortical ribboning and CSF 14-3-3 positivity. Which disease and which test confirms in the lecture?","CJD; RT-QuIC","Together these support sporadic CJD.",0],["Which evoked potential assesses brainstem function and helps detect vestibular schwannomas?","Brainstem auditory evoked potentials","BAEP assesses brainstem pathways and vestibular schwannomas.",0],["Which is an absolute concern before lumbar puncture?","Raised intracranial pressure / mass lesion","A suspected mass lesion or raised ICP risks herniation, so imaging comes first.",0],["What do the CSF/blood glucose ratio and CSF volume figures give?","Ratio 0.6 and about 150 mL total","CSF totals 150 mL (125 subarachnoid, 25 ventricular), produced at 600 mL/day.",0],["What does the SNAP amplitude depend on?","The number of sensory nerve action potentials (sensory axons)","The SNAP amplitude depends on the number of sensory nerve fibres that fire.",0],["NGS has 98% accuracy across the genome which equals about how many errors?","About 63 million","98% accuracy is compatible with nearly 63 million errors; read quality measures and bioinformatics are important.",0],["Which EMG pattern suggests neurogenic disease?","Large, long, polyphasic motor units with reduced recruitment","Neurogenic units are large and long; myopathic units are small, short and polyphasic.",0],["A patient has a thunderclap headache with a normal CT 14 hours later. Which CSF finding supports SAH?","Xanthochromia","LP at least 12 hours after onset shows xanthochromia.",0],["What does next-generation sequencing do?","Massively parallel sequencing of fragmented DNA or RNA","NGS sequences many fragments simultaneously and assembles reads against the human genome reference.",0],["Repetitive nerve stimulation in myasthenia gravis shows what?","A decremental response (>10% drop)","RNS shows a decrement greater than 10% between the first and fourth/fifth response.",0],["Which scenario makes lumbar puncture unsafe before imaging?","Papilloedema and focal signs","Raised ICP signs or focal deficits require imaging first.",0],["Compared with demyelinating neuropathy, in axonal neuropathy which NCS parameter is most reduced?","CMAP amplitude","Axonal loss primarily lowers amplitude.",0],["What are the limits of CT mentioned in the lecture?","Poor for inflammation and the posterior fossa; contraindicated in pregnancy","MRI is contraindicated with metal objects, pacemakers or claustrophobia.",0],["Which CSF pattern is characteristic of Guillain-Barre syndrome?","High protein with normal cell count (albuminocytological dissociation)","GBS typically shows raised protein with few cells.",0],["CSF: neutrophils 1000/mm3, protein 2.0 g/L, glucose 1.0 mmol/L (blood 5). Diagnosis?","Bacterial meningitis","Bacterial meningitis gives high neutrophils, high protein and low glucose.",0],["Which investigation differentiates AD from DLB or FTD by regional hypometabolism?","FDG-PET","AD: temporal-parietal; FTD: frontal-temporal; DLB: occipital hypometabolism.",0],["Which muscle biopsy finding is seen in normal muscle on ATPase staining?","A chequerboard pattern of fibre types","Normal muscle shows a chequerboard of type I and II fibres; type grouping indicates reinnervation (neurogenic).",0],["What EEG pattern characterises childhood absence epilepsy?","Three-per-second generalised spike-and-wave","Absence seizures show generalised 3 Hz spike-wave discharges.",0],["Which NCS pattern is typical of a demyelinating neuropathy?","Markedly reduced conduction velocity and prolonged distal latency","Demyelination slows conduction velocity markedly; axonal loss mainly reduces amplitude.",0],["Which numbers describe CSF protein and pressure?","Protein ratio 0.005 and pressure 6-20 cm of water","Effective brain weight is about 50 g instead of 1500 g due to CSF buoyancy.",0],["Absence of which somatosensory evoked potential wave indicates a poor prognosis in coma?","N20","Bilateral absence of the cortical N20 response predicts poor outcome in anoxic coma.",0],["A 4-year-old boy has calf hypertrophy, Gowers sign and CK 25000 U/L. Biopsy shows fibre size variation, fat and connective tissue replacement and absent dystrophin staining. Diagnosis and inheritance?","Duchenne muscular dystrophy; X-linked recessive","Absent dystrophin with this phenotype is Duchenne dystrophy, X-linked recessive.",1],["A 24-year-old has ascending weakness with absent ankle jerks. NCS show prolonged distal latencies, slowed velocities and absent F-waves. CSF has 2 cells/mm3 and protein 2.4 g/L. Interpretation?","Demyelinating polyneuropathy with albuminocytological dissociation (GBS)","Slowed velocities and high protein with few cells are typical of Guillain-Barre syndrome.",1],["A 31-year-old has fatigable ptosis and diplopia. CK and NCS are normal, repetitive stimulation shows a 6% decrement and AChR antibodies are negative. Most sensitive next test?","Single-fibre EMG looking for increased jitter","SFEMG is the most sensitive test of neuromuscular transmission when RNS is borderline.",1],["A 6-year-old stares for 10 seconds many times daily with eyelid fluttering. EEG during hyperventilation shows bilateral synchronous 3 Hz spike-and-wave. Diagnosis and activating procedure?","Childhood absence epilepsy; hyperventilation","3 Hz spike-wave with staring spells is childhood absence epilepsy, provoked by hyperventilation.",1]]},{"id":"su","name":"Substance misuse","cards":[["What advice do the UK Chief Medical Officers give to regular drinkers?","Keep within 14 units per week, spread over at least three days","This is a population guideline, not a diagnostic threshold.",0],["Which statement about the intoxicated patient in the emergency department is correct?","A psychiatric review may be needed to separate primary and secondary diagnoses","The lecture highlights poly-substance users.",0],["Which pair correctly matches the drug and its dependence pattern in the lecture's table?","Alcohol: withdrawal with DTs; opiates: 'cold turkey'","Alcohol withdrawal can include delirium tremens.",0],["Which public health measures does the NICE document discuss?","Minimum unit price, fewer outlets and a possible ban on advertising","They aim to make alcohol less affordable and available.",0],["Which neurotransmitter systems are increased by cocaine and amphetamine?","Noradrenaline, plus a direct effect on the NAc dopamine pathway","They also raise noradrenaline.",0],["Which of these are effects of high-risk drinking in the diagram?","Heart muscle weakness, anaemia and breast cancer","The diagram lists heart failure and impaired blood clotting.",0],["Which DSM-5-TR symptoms belong to the group of symptoms 1-6?","Craving, much time spent obtaining or recovering, and role failure","Tolerance and withdrawal are in 7-11.",0],["How does the lecture define addiction in the brain-disease model?","A chronic, relapsing brain disease with compulsive drug seeking despite harm","The drugs change brain structure and function.",0],["Which cell bodies lie in the VTA and which structure is their major limbic target?","Dopamine cell bodies; nucleus accumbens","It is the origin of the mesolimbic neurons.",0],["Which sign suggests inhalant intoxication?","Nystagmus, unsteady gait and crusting around the nose and mouth","Incoordination reflects cerebellar interference.",0],["What are the costs of alcohol cited by NICE in 2010?","More than £2 billion a year to the NHS; 1.2 million violent incidents a year","Harmful drinkers are 6.8% of UK adults.",0],["Which strengths are given on the 'Know your units' chart?","Ale and lager 3.5-4%, cider 6%, alcopops 5%, wine 11-14%","These are ordinary-strength values.",0],["Which four questions guide the assessment of a patient with a substance problem?","What drug is intoxicating, what drug is withdrawn, which mechanism, which treatment","These are the lecture's Key Questions.",0],["Which statement about brief interventions is correct?","They are low cost, with modest time and minimal professional involvement","They focus on awareness and safe limits.",0],["Which are components of relapse prevention?","Identify high-risk situations, cue exposure and refusal practice","Role play includes 'pusher' and 'user'.",0],["What does the Mental Health Act 1983 (and 2007) say about addiction?","It excludes addiction, so patients cannot be detained for it","One cannot forcibly detain and treat addiction as such.",0],["Which statement correctly pairs inhalant intoxication with its brain region?","Incoordination from cerebellar interference, not basal ganglia","The slide contrasts the cerebellum with the basal ganglia of Parkinson's.",0],["Which statement about nicotine in the lecture is correct?","Single quit attempts succeed in under 10%; bupropion and varenicline help","Multiple attempts are usual.",0],["Which social interventions are listed?","Housing, employment advice, education or training and government policy","The aim is for addicts to be valuable members of society.",0],["Which of these is a laboratory test commonly used in alcohol assessment?","Mean corpuscular volume (MCV)","MCV, GGT, ALT and AST are the lecture's tests.",0],["What is the mechanism of hallucinogens?","Partial agonist at postsynaptic 5-HT receptors, hallucinations via 5-HT2","The exact mechanism is unknown.",0],["Which pair of antagonist half-lives appear in the lecture?","Naloxone 90 minutes; naltrexone 24 hours","Buprenorphine lasts 1-3 days.",0],["Which is the correct description of cannabis pharmacology in the lecture?","Inhibitory G protein, increased GABA and serotonin, NAc effect 15-20% of opiates","The effect on the NAc is small.",0],["What does a drinking diary record?","Each drink, its volume and strength, time, setting and reason","It makes quantity and context visible.",0],["What sexual complication is more common in male smokers?","Secondary impotence (50% more likely)","Smoking also brings more accidents and sick days.",0],["How does DSM-5-TR grade alcohol use disorder severity?","Mild 2-3, moderate 4-5, severe 6 or more","Severity depends on the number of symptoms present.",0],["Where do the mesolimbic dopamine neurons begin?","Ventral tegmental area","The VTA is the origin; its axons ascend to the nucleus accumbens.",0],["Which limitation of the brain-disease model is noted?","It cannot explain every case on its own","Psychological, relational and social factors also shape risk.",0],["Which statement about the MFB on the slide is correct?","It is a fibre tract carrying ascending dopamine axons from the VTA to the NAc","The slide states it is not a relay nucleus.",0],["What minimum price per unit is cited in the NICE alcohol discussion?","40p (45p in the Gilmore proposal)","Making alcohol less affordable is a policy aim.",0],["Which statement about the drug class legal penalties is correct?","Class C possession carries up to 2 years; dealing up to 14 years","Class B dealing also carries up to 14 years.",0],["How do psychological rehabilitation programmes help in the lecture?","Psychoeducation and individual or group psychotherapy","Residential or day centres may be used.",0],["Which pair of pupil findings distinguishes opiate intoxication from opiate withdrawal?","Constriction in intoxication; dilation in withdrawal","Opiate intoxication gives pinpoint pupils.",0],["What are the daily and weekly maximum units for men and women on the Welsh chart?","Women 3 and 14; men 4 and 21","The chart is older than the CMO guidance.",0],["Which statement correctly contrasts DSM-5-TR and ICD-10 for alcohol problems?","DSM-5-TR needs 2 of 11 in 12 months; ICD-10 needs 3 of 6 in the previous year","The two frameworks have different thresholds.",0],["Which substances give psychological rather than physical dependence in the table?","Stimulants and cannabis","Benzodiazepines give rebound insomnia.",0],["Which drugs fall in Class B in the lecture?","Amphetamines, cannabis, methylphenidate and pholcodine","Injectable amphetamine is Class A.",0],["A 26-year-old is brought to the emergency department agitated, grandiose and paranoid, with tachycardia and dilated pupils. He is euphoric and shows repetitive stereotyped movements. Which substance and which receptor-level mechanism fit?","Cocaine or amphetamine; increased dopamine in the nucleus accumbens pathway","Dilated pupils with tachycardia complete the stimulant profile.",1],["A man develops headache, fatigue, drowsiness and nausea on the first day of a long-haul trip without his usual drinks. He denies drug use. What is the most likely cause?","Caffeine withdrawal, usually settling within 1-4 days","Caffeine withdrawal is variable between people.",1],["A student three days after LSD fears people are talking about him, sees colours when he hears music and feels unreal. What is the best response?","Supportive counselling ('talking down'), with benzodiazepines or antipsychotics if needed","These are ideas of reference, synaesthesia and depersonalisation.",1],["A man says that one drink does not matter because he has no cravings. Which formulation fits the lecture's cycle?","A cue or stress raises attention, craving makes use likely, relief reinforces use and consequences restart the cycle","Treatment can interrupt the cycle at several points.",1],["A heroin user is in agony on day three of abstinence with yawning, runny nose, muscle aches and dilated pupils. He asks if he will die. What do you say?","It is very unpleasant but not life threatening, and usually lasts 7-10 days","Patients relapse to avoid the agony.",1]]},{"id":"mv","name":"Movement disorders","cards":[["Which brain structures form the middle level of motor planning?","Sensory-motor cortex, basal ganglia motor loops, cerebellum and brainstem motor nuclei","The middle level converts the motor plan into a motor program.",0],["Which statement about Wilson's disease treatment is correct?","Reduce copper intake, give zinc and penicillamine; liver transplantation in some","It is treatable, so important not to miss.",0],["What is the evolution of dopamine neuron loss in PD according to the graph?","Neuron loss begins long before motor signs; non-motor symptoms appear first","Olfactory dysfunction may predate PD by 4 years.",0],["How does dystonia onset age affect its typical course?","Early onset begins in limbs and may generalise; late onset stays focal","Early onset is under 26; late onset over 25.",0],["Which body parts are affected by parkinsonian rest tremor?","Hands, chin, jaw and legs, almost never the neck","It is a 4-6 Hz pill-rolling tremor.",0],["Which features suggest Wilson's disease as a treatable cause of a PD-like picture?","Kayser-Fleischer rings and low ceruloplasmin","Wilson's disease is rare but treatable.",0],["Which pair is correctly matched with its MRI sign?","MSA: hot cross bun; PSP: hummingbird","CBD shows asymmetrical parietal atrophy.",0],["Which statement about Tourette syndrome inheritance is correct?","A genetic disorder, though no consistent gene mutation is identified","Both parents contribute.",0],["Where are electrodes placed for deep brain stimulation in PD?","Globus pallidus interna or subthalamic nucleus","DBS involves chronic stimulation via implanted electrodes.",0],["Which statement matches PARK1 and PARK4?","Both autosomal dominant, involving alpha-synuclein (SNCA)","PARK4 is a triplication of SNCA.",0],["Which statement about Huntington disease pathology is correct?","Atrophy of caudate and putamen with diffuse, mainly frontal cortical changes","Mutant huntingtin disrupts mitochondria and autophagy.",0],["Which features favour PSP over idiopathic PD?","Early falls, supranuclear gaze palsy and axial rigidity","PSP shows midbrain atrophy.",0],["Which four feature groups combine in MSA?","Parkinsonism, cerebellar, pyramidal and autonomic failure","Early severe orthostatic hypotension is typical.",0],["Which genes are inherited forms of primary generalised dystonia?","DYT1, DYT6, DYT7 and DYT13","DYT1 deletions are most common.",0],["Which molecular factors lead to cell death in sporadic PD?","Oxidative stress and excitotoxicity","The slide shows these converging on cell death.",0],["Why is entacapone used with levodopa?","It inhibits COMT, enabling a reduced levodopa dose","It is only used with levodopa preparations.",0],["How are the epidemiology figures of CBD given?","Incidence 0.62-0.92 and prevalence 4.9-7.3 per 100,000","There is no familial or environmental correlation.",0],["Which statement correctly pairs the movement with its flow chart category?","Hemiballismus: rapid, nonsuppressible, proximal","Chorea is in distal muscles.",0],["How is the substantia nigra described histologically in PD?","Loss of pigmented dopamine neurons in the pars compacta","Lewy bodies are eosinophilic with a halo of fibrils.",0],["Which test results support Wilson's disease?","Urine copper above 100 micrograms/day and low ceruloplasmin","Liver biopsy can confirm copper deposition.",0],["Which pair of genes belongs to PARK13 and PARK15?","HTRA2 (Germany) and FBXO7 (Iran, early onset)","PARK15 is autosomal recessive.",0],["How many motor and non-motor symptoms are required for probable CBS?","At least two asymmetric motor and two non-motor symptoms","Non-motor: apraxia, agnosia, cortical sensory loss, alien limb.",0],["Which statement about primary generalised dystonia is correct?","Childhood onset affects the foot, adult the arm, elderly craniocervical","No other neurological signs except tremor.",0],["What is chorea?","Jerky, irregular, unpredictable involuntary movements, like a dance","It involves the face, orolingual region, trunk and limbs.",0],["Which is a risk factor for idiopathic Parkinson's disease?","Exposure to pesticides or welding (manganese)","Age over 50, male sex, family history and head trauma also increase risk.",0],["Which lesion site and structure cause hemiballismus?","Contralateral subthalamic nucleus lesion, often vascular","Cancer and granulomatous lesions are other causes.",0],["What does the highest level of motor planning do?","Forms the intention to move, specifying type and goal of movement","Limbic cortex, prefrontal and posterior parietal cortex are involved.",0],["Which statement about dystonia distribution is correct?","Focal: one region; segmental: contiguous regions; multifocal: non-contiguous regions","Generalised involves both legs and one other region.",0],["Which statement correctly describes pyramidal signs in MSA?","Spasticity, positive Babinski and brisk reflexes","MSA combines four feature groups.",0],["Which locus and gene combination is correct for PARK6 and PARK7?","Both at 1p36; PINK1 and DJ-1","Both are autosomal recessive and early onset.",0],["How do MSA and CBD differ in survival and onset?","MSA: onset 63, survival 6-9 years; CBD: onset 6th-7th decade, survival 6-7 years","Both are progressive neurodegenerative diseases.",0],["Where do athetosis and dystonia sit on the flow chart of non-rhythmic movements?","Athetosis is slow; dystonia is sustained","Rapid ones divide into suppressible and nonsuppressible.",0],["A 68-year-old man has a 2-year history of right-hand rest tremor, slow movement, reduced arm swing and a soft voice. Which diagnosis and first-line approach fit?","Idiopathic Parkinson's disease; levodopa or a dopamine agonist","Asymmetric rest tremor with bradykinesia is typical of PD.",1],["A 24-year-old has tremor, dystonia, personality change and abnormal liver tests. Slit lamp shows a golden-brown ring at the corneal limbus. What is the next test?","Serum ceruloplasmin and 24-hour urinary copper","These are Kayser-Fleischer rings.",1],["A 45-year-old man has irritability, apathy, clumsiness and jerky, dance-like movements. His father died with a similar illness. What is the likely inheritance and mutation?","Autosomal dominant CAG repeat expansion (huntingtin)","Cell loss affects caudate and putamen.",1],["A 6-year-old boy has repeated eye blinking, throat clearing and shoulder shrugging that he can suppress briefly. He is also inattentive and has obsessions. Diagnosis?","Tourette syndrome with ADHD and obsessive-compulsive features","Tics are rapid and suppressible.",1]]},{"id":"lg","name":"Language dysfunction","cards":[["Which lesion pairing for conduction aphasia is correct?","Arcuate fasciculus, or temporal or parietal lobe sparing Wernicke's area","Many paraphasic errors occur.",0],["What is ideomotor apraxia?","Inability to carry out learned tasks on command despite intact comprehension and motor function","Examples are failing to mimic whistling or combing.",0],["At what age may language dominance skip to the opposite hemisphere after a lesion?","Before the critical age of about 8 years","Tumour or epilepsy surgery can trigger the shift.",0],["What is pure word deafness?","Cannot understand speech but can hear, speak, read and write","Non-speech sounds and emotional intonation are often recognised.",0],["Which components form Gerstmann's syndrome?","Left-right confusion, finger agnosia, dyscalculia and dysgraphia","The lesion is in the angular gyrus.",0],["Which lesion causes alexia without agraphia?","Dominant occipital lobe plus splenium of the corpus callosum","Visual input cannot reach Wernicke's area.",0],["Which speech elements may be relatively preserved in Broca's aphasia?","Overused phrases, expletives and sung lyrics","Automatic speech can be spared.",0],["Why does anomia occur in Wernicke's aphasia according to the table?","The lexical-semantic database is damaged","In Broca's aphasia the motor plan is the problem.",0],["What is constructional apraxia?","Visuospatial dysfunction, for example when drawing simple objects","It is a non-dominant parietal sign.",0],["Which arterial territory is involved in Broca's aphasia?","Superior division of the middle cerebral artery","It often comes with contralateral face and arm weakness.",0],["Which phenomenon is typical of the non-dominant parietal lobe?","Contralateral sensory inattention (neglect)","Neglect appears with two simultaneous stimuli.",0],["Which feature is present in essentially all aphasias?","Anomia (impaired naming)","Naming is therefore a screening test.",0],["What is topographical disorientation?","Inability to find the way around familiar spaces","It accompanies other non-dominant parietal signs.",0],["What does the Wada test do?","Sequentially anaesthetises each hemisphere to assess language dominance","It has largely been replaced by fMRI.",0],["What is a semantic paraphasia?","A real but unintended word, such as 'hotel' for 'hospital'","Phonemic paraphasia substitutes sounds.",0],["Which visual field deficit accompanies pure alexia?","Right homonymous hemianopia","The left occipital lobe is damaged.",0],["Where is Broca's area?","Posterior part of the inferior frontal gyrus","It lies next to the motor cortex for the face.",0],["Which statement defines agnosia?","Inability to recognise sensory information despite intact sensory modalities","Prosopagnosia is an example.",0],["Why does anomia occur in conduction aphasia?","The pathway between meaning and speech output is severed","The patient can process the word but cannot transmit it cleanly.",0],["Which problems are not counted as aphasia?","Problems of attention, initiative or articulation","These are other causes of impaired communication.",0],["In Broca's aphasia, which kinds of words are typically omitted?","Conjunctions and prepositions","Only key nouns and verbs are strung together ('want go store').",0],["Which language function is modulated by the right hemisphere?","Prosody and emotional tone of voice","The right hemisphere also organises the choice and synthesis of a story.",0],["Which type of paraphasia is typical of Broca's aphasia?","Phonemic (sound-based) paraphasias","An example is 'papple' for apple.",0],["A woman speaks fluently but her sentences are nonsensical, containing made-up words. She cannot follow commands and seems unaware of any problem. She has a right upper visual field loss. Which diagnosis?","Wernicke's aphasia from an inferior division MCA infarct","Neologisms and quadrantanopia suggest a posterior superior temporal lesion.",1],["A 70-year-old man after a left frontal stroke understands commands but speaks haltingly in short phrases ('want go store'). He cannot repeat and is frustrated. Which lesion and artery?","Left posterior inferior frontal gyrus; superior division of the middle cerebral artery","Broca's aphasia, often with right face and arm weakness.",1],["A man hears speech normally but says words sound like a foreign language. He can read, write and speak, recognises a doorbell and the emotion in a voice. Which diagnosis?","Pure word deafness","Wernicke's area or its auditory input is damaged.",1]]},{"id":"pa","name":"Psychoanalysis","cards":[["How did Strupp (1986) define psychotherapy?","The systematic use of a human relationship to relieve distress by enduring changes in thinking, feeling and behaviour","It aims at enduring changes.",0],["According to Freud, when does anxiety occur?","When a person becomes aware of repressed feelings, memories or experiences","The ego then uses defence mechanisms.",0],["What happens if a child does not successfully pass through a psychosexual stage?","They become psychologically fixated","Adult personality is largely set in the first three stages.",0],["Which goal is part of psychoanalytic therapy?","Strengthen the ego so choices rest on reality, not instincts or guilt","Choices are made more consciously.",0],["What does the patient usually do in classical analysis?","Lie on a couch with the therapist out of view, free associating","Free association is encouraged.",0],["How does psychodynamic psychotherapy differ from psychoanalysis?","Less frequent sessions, less rigid rules and more flexibility","It keeps the basic principles.",0],["What does the libido represent?","The life instinct driving survival, creativity, pain avoidance and pleasure","The death instinct drives aggressive behaviour.",0],["Which tools reveal unconscious aspects in psychoanalysis?","Dreams, free association, resistance and transference","Repressed experiences and countertransference are also considered.",0],["Which patient is best suited to psychoanalysis?","A young adult with stable relationships, intelligent and not psychotic","It is insight oriented.",0],["Which defence is expressing the opposite of what one really feels?","Reaction formation","The real feeling is too dangerous to express.",0],["Which are the three groups of defence mechanisms shown?","Mature, neurotic and immature","Defences are normal and healthy when used in moderation.",0],["Which statement about Freud's training is correct?","He was a neurological researcher and neuroanatomist","Bleuler and 'Preliminary Communications on Hysteria' feature in the lecture.",0],["What is the premise of psychoanalysis?","Psychological problems originate from repressed childhood impulses and conflicts","The aim is to bring repressed feelings into awareness.",0],["What is free association?","Undirected expression of conscious thoughts and feelings to reach unconscious processes","The therapist remains out of view.",0],["What happens in the latency stage?","Sexual interests subside and are replaced by other interests","It comes after the phallic stage.",0],["How often does classical psychoanalysis take place?","4-5 sessions a week for months or years","Psychodynamic psychotherapy is less frequent.",0],["What is resistance?","Forces within the patient opposing the goals of evaluation and treatment","Talking about it with the patient may reduce it.",0],["How are dreams viewed in psychoanalysis?","As representing conflict between urges and fears","The analyst interprets them to achieve therapeutic goals.",0],["A patient on the couch says whatever comes to mind and, after a pause, falls silent when he reaches a painful memory. Which concept applies to the silence?","Resistance","It opposes the goals of treatment.",1],["A patient who feels abandoned by her father becomes furious when her therapist is ten minutes late. Which phenomenon is this?","Transference","She transfers feelings about her father onto the therapist.",1]]},{"id":"pn","name":"Paediatric neurology","cards":[["Which factors raise the risk of cerebral palsy?","Hypoxic-ischaemic injury, prematurity, low birth weight, chorioamnionitis and congenital infection","Perinatal stroke is also a cause.",0],["Which are the four domains of child development?","Gross motor, vision and fine motor, hearing speech and language, social emotional and behaviour","Skills are acquired in a similar sequence but at a variable rate.",0],["Which features suggest Down syndrome?","Flat face, upslanting fissures, Brushfield spots, single palmar crease and hypotonia","Congenital heart defects are common.",0],["How does hemiplegic cerebral palsy often present?","Early hand preference and fisting with brisk reflexes on one side","The plantar is upgoing on the affected side.",0],["Which is a developmental red flag at any age?","Regression, loss of skills al
