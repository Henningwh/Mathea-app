<title>MED 301 Flashcards</title>

<style>
:root{--bg:#f6f4ef;--surf:#fffdf8;--fg:#1f2a2e;--mut:#6a7478;--line:#ddd8cc;--acc:#1f6f6b;--accfg:#fff;--ok:#2f7d4f;--okbg:#e2f1e7;--bad:#b4552b;--badbg:#f6e4da;--case:#7a4f9a;--shadow:0 1px 2px rgba(30,40,40,.06),0 8px 24px rgba(30,40,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--surf:#1d2427;--fg:#e8ecea;--mut:#98a4a6;--line:#2f3a3d;--acc:#4fb3ac;--accfg:#0c1514;--ok:#6cc58e;--okbg:#1d3326;--bad:#e49067;--badbg:#38241a;--case:#b995d6;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--surf:#1d2427;--fg:#e8ecea;--mut:#98a4a6;--line:#2f3a3d;--acc:#4fb3ac;--accfg:#0c1514;--ok:#6cc58e;--okbg:#1d3326;--bad:#e49067;--badbg:#38241a;--case:#b995d6;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;margin:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font:600 30px/1.15 Fraunces,Georgia,serif;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 18px}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;gap:8px}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;align-items:center}
.deck:hover{border-color:var(--acc)}
.deck b{font-weight:600;min-width:0}.deck span{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.prog{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.deck.done b::after{content:" ✓";color:var(--ok)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.top h2{font:600 22px/1.2 Fraunces,Georgia,serif;margin:0;min-width:0;text-wrap:balance}
.meta{color:var(--mut);font-size:13px;margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap}
.tag{color:var(--case);font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:260px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer;width:100%;text-align:left}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.q{font:500 20px/1.4 Fraunces,Georgia,serif;overflow-wrap:anywhere}
.a{font-weight:600;font-size:17px;color:var(--acc);overflow-wrap:anywhere}
.e{color:var(--mut);overflow-wrap:anywhere}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:10px 0}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.acts3 .btn{padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;min-width:0}.acts3 small{font-weight:400;font-size:11px;opacity:.85;text-align:center}.disc{text-align:center;margin-top:12px}.link{background:none;border:0;color:var(--mut);text-decoration:underline;padding:6px 10px;font-size:13px}.link:hover{color:var(--bad)}.mid{background:var(--surf);border-color:var(--acc);color:var(--acc)}.prog{position:relative}.prog i{position:absolute;left:0;top:0}.prog i.g2{background:var(--acc);opacity:.45}
.acts .btn{padding:12px}
.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.yes{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.sum{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.sum b{font:600 28px Fraunces,Georgia,serif}

<script>
var DECKS=[{"id":"ps","name":"Introduction to psychopathology","cards":[["A patient says he cannot talk about abuse. According to the lecture, how should the clinician proceed?","Respect the wish initially, build alliance, then ask directly later","Respect the patient's wish to avoid subjects on first encounter, yet be direct about sensitive material.",0],["In the lecture's prevalence list, which country had one of the highest lifetime rates of psychological disorder?","United States (about 1 in 4, 26%)","The United States is quoted at 1 in 4 (26%), one of the highest in the world; Nigeria and China were among the lowest.",0],["What does the History of Present Illness include?","Why the patient came, support system, vegetative and psychotic symptoms, functioning","HPI covers the current episode, impact on work and relationships, symptoms and secondary gain.",0],["Which set belongs to the mental status exam?","Observations plus questions on thoughts, beliefs, perceptions and cognition","MSE creates a picture of the patient.",0],["Which comparison between models is correct?","Biomedical: mind-body dualism; BPS: micro and macro levels","Biomedical reductionistic, BPS macro and micro level.",0],["In the biopsychosocial model slide, 'self-esteem', 'trauma' and 'coping skills' are examples of which group?","Psychological factors","Self-esteem, trauma and coping skills are listed as psychological factors.",0],["Which element belongs to the past psychiatric history?","Previous admissions, self-harm, ECT and medication trials","Past psychiatric history: admissions, providers, self-harm, medication trials, ECT.",0],["What is the final step of the clinical interview approach in the lecture?","Formulation using ICD-10 vs DSM-5 and a biopsychosocial approach","Step D is the formulation: ICD-10 vs DSM-5 and the biopsychosocial approach.",0],["Why is the therapeutic alliance important?","The patient needs to feel safe and trust to share information","It is critical to gather information.",0],["Which statement describes the biomedical model rather than the biopsychosocial model?","It is reductionistic and considers a single causal factor","Biomedical: reductionistic, single causal factor, mind-body dualism, emphasises illness over health.",0],["How should a doctor ask about sensitive material such as abuse or domestic violence?","Directly and openly","The lecture says to be direct: hesitating or being indirect makes the patient less likely to volunteer information.",0],["What should one do when a patient wishes to avoid a subject on first encounter?","Respect the wish on initial encounter","Follow the patient's lead.",0],["A doctor is about to interview an agitated patient. Which preparation does the lecture stress?","Pre-plan staff safety","Staff safety should be pre-planned before entering the room.",0],["The lecture states that a mental illness is diagnosable from specific symptoms and usually treated how?","Pharmacologically and/or with therapy","A mental illness is diagnosable based on specific symptoms and usually can be treated pharmacologically and/or with therapy.",0],["In the biopsychosocial model slide, 'family circumstances', 'peers' and 'school' belong to which group?","Social factors","Family, peers, school and family relationships are social factors.",0],["What should questions in the psychiatric history ideally be?","Open ended, inviting the patient to tell a narrative","All questions should be open ended and invite the patient to tell a narrative or story.",0],["In the biopsychosocial model, 'genetic vulnerability' and 'temperament' fall under which group?","Biological factors","On the slide, genetic vulnerability, drug effects and physical health sit with biological factors; temperament was also placed in the biological group.",0],["What does the history of present illness ask about the relationship between physical and psychological symptoms?","Whether they are related","It also asks about vegetative and psychotic symptoms.",0],["A student says the term 'biopsychosocial' simply means adding therapy to medication. How do biomedical and biopsychosocial models differ in the lecture's table?","Biomedical: reductionistic with a single causal factor and mind-body dualism; BPS: multiple causes, macro and micro level, mind and body inseparable","The lecture compares them across reductionism, causal factors, dualism and emphasis on health.",1],["Which of the following belongs in the history of present illness rather than past psychiatric history?","Why the patient came now, support system, vegetative and psychotic symptoms, functioning when well and secondary gain","HPI covers the current episode; past psychiatric history covers admissions, providers, self-harm, medication trials and ECT.",1],["A 19-year-old's history lists a parent with depression, poor coping skills, bullying at school and a late-diagnosed thyroid condition. Which grouping into the biopsychosocial model is correct?","Parent's depression and thyroid biological, coping skills psychological, bullying social","Genetic vulnerability and physical health are biological, coping skills psychological, peers and family circumstances social.",1]]},{"id":"fm","name":"Family and SES","cards":[["Which statements about divorce data are correct?","About 50% of marriages end within 10 years; recent dips reflect more marriages, not fewer divorces","The US has the highest divorce rate among Western nations.",0],["Why are breast cancer rates higher in high-SES women?","Later childbearing raises risk, beyond better detection from insurance","The lecture adds that lesbian women have rates about 8 times higher due to postponed childbearing.",0],["Why are Type A people less likely to have a second heart attack?","They are more likely to follow their doctor's advice","Type A people are prone to do what doctors tell them to improve health.",0],["What do studies find about children of divorced parents?","More behavioural, physical and mental developmental problems and slower growth","They do not reach milestones as quickly.",0],["A man scores 340 on Holmes-Rahe. How should risk be interpreted?","About 80% chance of major health breakdown in 2 years","Over 300 points raises odds to about 80%.",0],["Which is a feature of low SES families in the lecture?","Sharply defined sex roles and action-oriented language","Low SES families are also often single-parent, female-headed.",0],["Which similarity predicts a lasting marriage?","Similar background, race, education, intelligence and lifestyle","The more similar, the more likely to remain married.",0],["How does marital satisfaction change after children are born?","It falls sharply and stays low until children leave","Couples without children report higher satisfaction.",0],["Which life event has the highest weighting on the Holmes and Rahe stress scale?","Death of a spouse","Death of a spouse is the most stressful event on the scale.",0],["What does the lecture say about economics and marriage stability?","Marriages based on money are more stable; women's economic independence raises divorce","Similar partners are more likely to stay married.",0],["What percentage of US households fit the 'typical' working father, non-working mother and two children?","About 15%","More than 50% of mothers with children work outside the home.",0],["According to the lecture, what is the real link between Type A behaviour and coronary heart disease?","Hostility","Hostility, and what people do with it, underlies the link.",0],["Why did the divorce rate slightly decline in recent years?","An increase in people not marrying rather than fewer divorces","The number of divorces did not fall.",0],["Why shouldn't parents always stay married for the children?","A hostile environment can be harder on children than divorce","Divorce is sometimes the lesser of two evils.",0],["Which belief about social support matters most for coping?","Perceived support matters more than objective support","Believing support is available is key, and one significant person is especially important.",0],["Which group typically has very high SES but low income?","Religious figures","Ministers, priests, rabbis and imams.",0],["What do the three Cs of the hardy personality stand for?","Challenge, commitment, control","Hardy people love challenge, are committed and feel in control.",0],["Why is breast cancer more frequent in women of high SES (after removing screening differences)?","Later child-bearing","Postponing child-bearing increases the risk of breast cancer.",0],["Which country has the highest divorce rate among Western nations?","United States","The rate has risen steadily for 50 years.",0],["How does the educational level of partners relate to divorce?","The woman's education predicts divorce; the man's does not","47% of women with no high school education divorce versus 17% of those with college degrees.",0],["A Holmes-Rahe score above 300 implies about what risk of major health breakdown?","About 80% within two years","<150 low; 150-300 about 50%; >300 about 80%.",0],["How are families described in the lecture?","Unique, continuously evolving social systems","They are based on biological, legal, emotional and geographical bonds.",0],["What language style characterises low SES?","Action oriented, about doing rather than reflecting","Language reflects activity.",0],["Why does later marriage predict stability?","Older couples tend to stay married","College graduates marry later.",0],["What is the usual composition of low SES families?","Single-parent families headed by women","They differ from the traditional nuclear family.",0],["How does marital satisfaction change with children?","High after marriage, falling sharply after children, recovering when they leave","Having a child to save a marriage is therefore not advised.",0],["In the Holmes-Rahe scale, which life event carries the highest value?","Death of a spouse (100)","Death of spouse = 100, divorce 73, marital separation 65, marriage 50.",0],["What proportion of mothers with children work outside the home?","More than 50%","This is the norm.",0],["Which variable is not a direct determinant of SES?","Money, wealth or income","Wealth is positively correlated.",0],["SES is a weighted combination of which two things?","Occupation and education","SES is occupation and education; money is correlated but not a direct determinant.",0],["What happens to divorce rates as women gain economic independence?","They rise","Women are less likely to stay in a miserable marriage.",0],["Which marriages are more stable?","Those based on finances than on affection","This goes against romantic notions.",0],["A 29-year-old paramedic scored over 300 on the Holmes-Rahe scale this year (separation, bereavement, job change, a move). Colleagues with similar scores have had breakdowns, yet he has not been ill. He volunteers for the hardest call-outs, says nobody else decides his path, and is restless on quiet shifts. He sees few people but is sure his brother would drop everything for him. Which explanation fits the lecture best?","Hardy personality, with perceived social support as a moderator","Thriving under stress marks the hardy type; the belief in support matters more than the number of people around, so his brother counts even though his contacts are few. Type A is linked to hostility and heart disease, not resilience.",1],["A 38-year-old solicitor with excellent insurance, who married at 36 and has no children, has a breast lump. A trainee suggests it only seems common in her group because screening is better. After equalising screening, high-SES women still have more breast cancer. What is the next step in the lecture's reasoning, and what else is more frequent in her SES group?","Postponed childbearing raises risk; anxiety and bipolar disorders are also more frequent","Even after adjusting for detection, later marriage and childbearing explain the excess; high SES also has more anxiety disorders and bipolar disorder despite better overall health.",1],["A clinician records that a low-SES father holds sharply defined views of what men and women should do, rejects other approaches as wrong, and describes problems in short concrete action terms ('we just fix it'). A colleague concludes he has low intelligence. Which evaluation fits the lecture?","Unsupported: language reflects activity, and rigid roles are typical of low SES","The lecture says action-oriented language reflects concrete activity (plumber vs lawyer) and is neither a money nor an intelligence issue; low SES involves sharper sex-role expectations and more rigidity.",1],["Two colleagues both face the same job relocation. Dana calls it a chance to grow, believes her friends would help, though she has few contacts. Eli sees it as everything about his life changing, and has many relatives but believes none would help. Which statement fits the lecture?","Eli is at greater risk: threat appraisal and low perceived support matter more than the number of contacts","The lecture says appraisal of the event matters and that belief about the amount of social support is more important than objective support.",1]]},{"id":"hv","name":"HIV/AIDS","cards":[["Why should barrier methods be recommended for oral sex with HIV risk?","It can spread by oral-genital contact, and secondary lesions such as herpes or syphilis raise the risk","Data suggest a secondary lesion is needed, and most people with HIV have such lesions.",0],["A pregnant HIV-positive mother takes AZT, delivers by C-section and gives nevirapine to the baby but does not breastfeed. Expected transmission?","About 2% or less","AZT+nevirapine cuts transmission to 2%; breast-feeding adds up to 50%.",0],["Why has AIDS fallen from first to fifth leading cause of death at ages 25 to 44 in the US?","Better treatments mean people do not die soon","The illness has not been reduced; deaths have.",0],["What do the lecture figures show about HIV-positive patients and anal intercourse in the US?","It is more common heterosexually because there are far more heterosexuals","The lecture stresses absolute numbers: far more heterosexuals exist, so anal intercourse occurs more often heterosexually.",0],["What proportion of new infections in 2017 were among gay men and other men who have sex with men?","About 18%","Clients of sex workers also made up 18%.",0],["How is late HIV diagnosis defined in the lecture?","CD4 count below 350 cells/mm3 within 3 months of diagnosis","Late diagnosis means CD4 <350 within three months, implying at least three years of undiagnosed infection.",0],["How long had HIV been present in Central Africa before AIDS was recognised?","About two decades","Stored serum specimens showed this.",0],["What is a reason why HIV is increasingly viewed as a chronic disease?","Treatment turns the infection into a treatable chronic condition","Awareness of how to live with it matters.",0],["What do the epidemiological quiz questions in the lecture illustrate?","Different questions have different answers, so focus on exactly what is asked","One must read the question carefully.",0],["Where do almost all people living with HIV reside?","In low- and middle-income countries (97%)","About 97% live in low- and middle-income countries, particularly sub-Saharan Africa.",0],["Which long-term problems occur in the ageing HIV-positive population?","Cardiovascular, metabolic, bone and neurological problems","These layer on top of a complex condition.",0],["Which age-related trend affects people with HIV?","They live into old age and older people acquire HIV","Older people remain sexually active.",0],["Which statement on HIV transmission is correct?","Male-to-female is easier than female-to-male; risk is greater during menses","Heterosexual transmission is easier from men to women; uncircumcised men have 8x more risk.",0],["What makes an undiagnosed person more likely to transmit HIV?","Three times more likely than a diagnosed person","HPA 2016 evidence.",0],["What do health professionals tend to do with HIV diagnosis?","Miss and under-diagnose it, even in symptomatic people","Broader testing has been shown feasible and acceptable.",0],["Which unusual infection was most frequently reported in the first AIDS cases?","Pneumocystis pneumonia","Cases were in previously healthy homosexual men in California and New York.",0],["Why do heterosexual people account for more anal intercourse in the US in absolute numbers?","There are many more heterosexuals than homosexuals","This is an absolute not a relative figure.",0],["What is the HIV risk per needle-stick with HIV-positive blood?","About 1 in 250 (1 in 100 to 1 in 1000)","The slide quotes 1 in 100 to 1 in 1000, around 1 in 250.",0],["What percentage of new HIV infections in 2017 were in the rest of the population (outside key groups)?","52%","Key populations accounted for 48%; the rest of the population 52%.",0],["A 22-year-old sex worker asks whether she should use barrier protection during oral sex with clients. What does the lecture advise and why?","Yes, because HIV can be spread by oral-genital contact when secondary lesions such as herpes or syphilis are present","The lecture says barrier use is recommended; most people with HIV have secondary lesions such as herpes and syphilis.",1],["A prevention programme wants to cut mother-to-child transmission as far as possible. Which regimen gives the lowest rate in the lecture?","AZT plus nevirapine (about 2%)","AZT halves risk to about 10%, with C-section 5%, nevirapine 10% and AZT plus nevirapine about 2%.",1],["Why has AIDS fallen from first to fifth leading cause of death at ages 25-44 in the US, according to the lecture?","Better treatments reduce death, not the number of cases","The lecture states cases have not fallen; people simply do not die as soon.",1]]},{"id":"s1","name":"Sexuality I","cards":[["Which statement about the physician's role in sexuality is consistent with the lecture?","Patients usually ask the physician, who should know basic facts, labelling of sexual aberrations and myths versus reality","The lecture says that if you feel comfortable with these topics you can greatly assist patients.",0],["A manager known for harsh, unkind behaviour is described by a colleague as sadistic. How does the lecture view this?","It misuses the term: sadism refers to sexual arousal from causing pain or humiliation","Sadism is about sex, not general nastiness.",0],["A teenage girl's first sexual experience was at 14. Which fact from the lecture is most relevant to counselling?","25% of females have first sex before 15 and a substantial share of these are unwanted or forced","The lecture ties early first sex to unwanted or forced experiences.",0],["How should a paraphilia between consenting adults, where nobody is hurt, usually be handled?","Usually let go, while trying to persuade the person to enter treatment","Success rates for treatment are mixed; harm or lack of consent changes the approach.",0],["What does the lecture say about people with transvestite fetishism?","They cannot become aroused unless dressed in the other gender's clothes, and are mostly heterosexual","Transvestites in their overall majority are heterosexual.",0],["A patient who never stands up to her boss is called 'a masochist' by her friends. What is the lecture's comment?","The term is being misused; masochism is sexual arousal from being abused or dominated","Masochism is a sexual term and is not about being unassertive.",0],["A public health report lists STDs by number of new cases in 2024. Which measure is this, and which infection tops it?","Incidence; HPV","Incidence counts new cases in a period; HPV has the highest incidence.",0],["Which statement correctly contrasts the sexual response cycle with the biopsychosocial model?","The cycle has four stages shared by both sexes; the model has four interacting domains","The slides give four stages and four overlapping domains.",0],["Why does the lecture state that attention to the exact wording of STD questions is important?","Highest incidence, highest prevalence and most common are different questions with different answers","HPV, HSV-2 and chlamydia/gonorrhoea answer different versions of the question.",0],["A sadist and a masochist are in a consensual relationship and no one is harmed. When should intervention be encouraged?","When behaviour goes beyond the boundaries of the consensual time","Treatment is encouraged only when they go outside the boundaries of consent.",0],["Out of 1000 pregnant teenage girls, about how many have elective abortions and how many give birth?","About 330 abortions and 500 births","50% give birth, 33% abort electively and the rest (about 17%) abort spontaneously.",0],["Quality of current and past relationships, intervals of abstinence, life stressors and finances belong to which domain?","Interpersonal","These are the interpersonal examples on the slide.",0],["Which pair describes the consequences for the child of a teenage mother?","Neonatal deaths, prematurity and lower scores on intellectual tests","Neonatal death and prematurity are common and test scores are lower, though the lecture stresses this does not necessarily mean mental retardation.",0],["A biological male identifies as female and wants male partners. Which label from the lecture's table fits?","Gender identity disorder (transsexual)","The table lists female identity with male partner for gender identity disorder.",0],["Which perpetrator breakdown matches the lecture for female victims of rape?","Intimate partner 51%, acquaintance 41%, family member 13%, stranger 14%","The most common perpetrators are intimate partners and acquaintances; strangers account for a minority.",0],["Why is pedophilia handled differently from exhibitionism or voyeurism in the lecture?","Most people act on their urges, so it causes assault and is criminal behaviour","The lecture says it is the most common cause of sexual assault and must not be let go.",0],["A couple consists of an exhibitionist and a voyeur who are both content with their arrangement. What does the lecture suggest?","They probably need no intervention","If two people are compatible within their paraphilias, intervention is not usually needed.",0],["A man cannot be aroused unless he wears women's underwear. Which statement about him is most accurate?","Transvestite fetishism; most such men are heterosexual","Transvestite fetishism means arousal depends on wearing the other gender's clothes.",0],["Which pair of measures is a teenager's STD risk described by in the lecture?","1 in 5 (25%) will have an STD, and teenagers have more STDs than any other group","This is a statement of the teenage burden of STD.",0],["Which statement about hypoxyphilia is correct?","It is potentially life threatening and involves reduced oxygen supply during arousal","It is also called autoerotic asphyxiation or asphyxophilia.",0],["If about 1 million teenage girls become pregnant, roughly how many pregnancies end in spontaneous abortion?","About 170,000","The remainder after 50% births and 33% elective abortions is about 17%.",0],["Which one of these is NOT listed among the psychological sequelae of sexual assault on the slide?","Psychotic episodes","The slide lists low self-esteem, GAD, substance abuse, PTSD and mood swings.",0],["A 19-year-old woman was raped by a classmate she had been dating. She now has nightmares, avoids the campus, drinks heavily and has low self-esteem. Which classification and screening list fit the lecture?","Acquaintance (date) rape; screen for PTSD, GAD, substance abuse, mood swings and low self-esteem","Acquaintance rape is committed by someone known; the sequelae include PTSD, GAD, substance abuse, mood swings and low self-esteem.",1],["A married man can only become aroused when his wife wears a particular leather jacket. She consents and nobody is harmed. Which diagnosis and approach fit?","Fetishism; usually no intervention is needed while it is consensual","Fetishism needs a secondary object; consensual paraphilias between adults without harm are usually left alone.",1],["You see a woman with injuries after a sexual assault and wonder who the perpetrator might be. Which statement matches the lecture's statistics?","Intimate partners and acquaintances are the most commonly reported perpetrators, stranger assault is less common","Among female victims 51% reported an intimate partner, 41% an acquaintance, 13% a family member and 14% a stranger.",1]]},{"id":"sx","name":"Sexuality II","cards":[["Which set of figures does the sexuality lecture give for erectile disorder (young adults vs men over 80), married women who have never achieved orgasm, and overall anorgasmia?","ED: 8% in young adults, 75% over 80; 5% of married women never orgasm; anorgasmia 30%","Female arousal disorder may reach 33%; probability of orgasm increases with age.",0],["What advice about position after myocardial infarction does the lecture give?","The one who had the heart attack lies at the bottom; the man is flat on his back for him","If the woman had the heart attack, she is at the bottom.",0],["A woman with painful intercourse never manages penetration due to involuntary spasm of the vaginal muscles. Treatment?","Progressive relaxation with Hegar dilators","Vaginismus is treated with relaxation and dilators.",0],["What best describes female sexual arousal disorder?","Desire and fantasies are present but physical responses such as lubrication are lacking","Antihistamine and anticholinergic drugs can dry secretions and mimic this picture.",0],["What do dyspareunia and chronic pelvic pain link to?","Chronic pelvic pain is more common in women who have been raped or sexually abused","Dyspareunia is recurrent persistent pain.",0],["What best answers a post-MI patient asking when to resume sex?","Whenever you feel comfortable","Giving a timeframe is avoided because patients follow it literally; comfort or stress test is advised.",0],["Which causes should be checked before neurological causes of male erectile disorder?","Alcohol, smoking, diabetes and marital conflict","Secondary causes should be excluded first; smokers are about 50% more likely to be affected.",0],["What distinguishes retarded from retrograde ejaculation?","Retrograde: orgasm occurs but ejaculate goes into the bladder; retarded: orgasm is not released","In retrograde ejaculation orgasm occurs but ejaculate passes backward into the bladder.",0],["What test helps to differentiate physiological from psychological erectile disorder?","Postage stamp test or REM sleep erections","Nocturnal erections suggest psychological causes.",0],["Why does premature ejaculation link to early experiences?","Sexual responses are conditioned and hurried early contexts carry over","It is more likely if early experiences were hurried or linked to early masturbation.",0],["What should always be checked before assessing a sexual dysfunction?","Medication that may interfere with sexual function","Pharmacology is increasingly seen in practice.",0],["Which statements describe vaginismus and its treatment?","Involuntary constriction preventing penetration, treated with relaxation and Hegar dilators","Dyspareunia is recurrent pain; chronic pelvic pain is more common in women who were raped or abused.",0],["Which treatments are listed for premature ejaculation?","Start-stop technique, squeeze technique and SSRIs","Hegar dilators are for vaginismus.",0],["What effect do dopamine agonists have?","Enhance erection and sometimes libido","Neuroleptics have the opposite effect.",0],["Which advice about timing should not be given after a myocardial infarction?","A fixed time frame","Patients take time frames literally.",0],["Which medications can dry vaginal secretions?","Antihistamines and anticholinergics","They mimic lack of arousal.",0],["Which drugs are linked to erectile dysfunction in the lecture?","Beta blockers, tricyclics and neuroleptics","Beta-blockers, tricyclics and neuroleptics may cause ED; dopamine agonists may enhance erection.",0],["Which description of dyspareunia matches the sexuality lecture?","Recurrent and persistent pain with intercourse, more common in women","Dyspareunia is a sexual pain disorder: recurrent and persistent pain, more common in women. Vaginismus is the involuntary constriction that prevents insertion.",0],["What is retarded ejaculation?","Inability to reach orgasm and ejaculation in the vagina, with orgasm possible by masturbation","Retrograde ejaculation has an orgasm.",0],["A 31-year-old woman has had recurrent pelvic pain during and after intercourse for 8 months. Penetration is possible and there is no vaginal muscle spasm on examination. She discloses a sexual assault at 19. Which diagnosis and association fit the lecture?","Dyspareunia; chronic pelvic pain is more common after rape or sexual abuse","Recurrent, persistent pain with intercourse is dyspareunia (a pain disorder, more common in women); vaginismus needs involuntary constriction preventing penetration. Chronic pelvic pain is more common in women who have been raped or sexually abused, so ask about abuse sensitively and directly.",1],["A 28-year-old man ejaculates before or immediately on penetration. His first sexual experiences were hurried, in a car. What explanation does the lecture give, and which treatments?","Conditioned response learned in contexts demanding quick orgasm; start-stop, squeeze technique or SSRIs","Sexual responses are conditioned, and the lecture lists start-stop, squeeze and SSRIs.",1],["A 68-year-old man has survived a massive MI and asks when he can resume sex. What is the answer favoured by the lecture?","Whenever he feels comfortable or when a stress test says it is fine, such as climbing a flight of stairs without breathlessness","Giving a fixed time frame backfires because patients follow it literally.",1]]},{"id":"an","name":"Anxiety disorders","cards":[["Which statement about the fight or flight response is correct?","It can boost adrenaline to allow extraordinary feats but may misfire in anxiety","The SNS drives it.",0],["Which feature defines OCD in terms of time and distress?","Obsessions/compulsions taking more than 1 hour per day or causing marked distress","OCD is time-consuming (>1 hr/day) or causes marked distress and impairment.",0],["According to NICE evidence in the lecture, what is the preferred first-line treatment for anxiety disorders where possible?","Psychological therapy","Psychological therapy is more effective than pharmacological therapy and is first line where possible.",0],["What is a typical cognitive-behavioural cycle in anxiety?","Thoughts, feelings, physical sensations and behaviours that maintain each other","The CBT diagram links thoughts, feelings, physical sensations and behaviours (avoid, escape or freeze).",0],["Which description fits the recognition of obsessions as a product of one's own mind?","Insight that they are self-generated","This separates OCD from psychosis.",0],["Which cluster list describes PTSD symptoms?","Re-experiencing, reliving, avoidance/numbing and autonomic arousal","PTSD follows life-threatening trauma with intrusive memories, flashbacks, avoidance and hyperarousal.",0],["How does the lecture distinguish fear, stress and anxiety?","Fear: alarm to present danger; stress: demands exceed resources; anxiety: exaggerated anticipatory danger","Anxiety includes perceived uncontrollability, uncertainty and vulnerability.",0],["What proportion of people have isolated panic attacks without any clinical syndrome?","About 15%","A panic attack is not a disorder in itself.",0],["How is a specific phobia defined?","Marked persistent excessive fear of a specific object or situation, recognised as excessive and avoided","Exposure provokes an immediate anxiety response.",0],["Which symptom group is typical of anxiety?","Dry mouth, palpitations, tremor, paraesthesia and urinary frequency","These reflect autonomic hyperactivity.",0],["Which are common themes of obsessions?","Contamination, aggression, bodily fears, safety and need for symmetry","Compulsions neutralise them.",0],["What does evidence say about combined therapy?","Combined psychological and drug treatment is increasingly shown to beat either alone","Stepped care, psychoeducation, CBT and medication are the lecture's framework.",0],["Compulsions meet the OCD threshold when they do what?","Take more than 1 hour a day or markedly interfere with routine","Obsessions and compulsions must cause marked distress, be time-consuming or interfere significantly.",0],["Which feature makes anxiety pathological?","It is out of proportion to the situation and persists after the stressor has gone","It may also appear for no apparent reason.",0],["What does agoraphobia describe?","Fear of places from which escape or help would be difficult if panic occurred","Patients may become housebound.",0],["Which statement correctly separates social phobia from specific phobia?","The fear concerns scrutiny by others and fear of humiliation","Performance anxiety is one form.",0],["What does the lecture say about SSRIs and GABA?","Imaging suggests SSRIs may act directly on GABA neurons","This is recent imaging evidence; many anxiolytics modulate GABA receptors.",0],["Which lifetime prevalence figures match the epidemiology table?","Panic 1.5-4%, phobia 10%, OCD 2-3%, GAD 3-8%, PTSD 1-3%","Phobias are the most prevalent anxiety disorder; panic typically begins in the late 20s.",0],["Which fears are typical of an anxious patient?","Fear of death, heart attack or nervous breakdown","Fear of hurting others also occurs.",0],["How does CBT explain the maintenance of anxiety?","Avoidance is rewarded because it briefly reduces anxiety","Avoidance is reinforced by short-term relief; gradual exposure teaches the person to act differently and observe outcomes.",0],["How did Beck define fear and anxiety?","Fear is the appraisal of danger; anxiety is the unpleasant feeling it evokes","Fear is a cognitive appraisal of danger; anxiety is the unpleasant feeling state evoked by it.",0],["Which treatment is first-line for panic disorder in NICE guidance?","Cognitive behavioural therapy or an SSRI, offered as a first choice","Benzodiazepines are not recommended long term.",0],["Which statement about obsessions is correct?","They are not simply excessive worries about real-life problems","They are egodystonic.",0],["Which substances can mimic anxiety disorders?","Stimulants such as cocaine and amphetamines","Misuse of prescribed drugs is also a cause.",0],["What is the ICD code group for obsessive-compulsive disorders?","F42","Dissociative disorders are F44.",0],["Which feature separates panic disorder from phobias?","Attacks are unpredictable and occur without a stimulus","Panic disorder is episodic, recurrent and unpredictable, occurring in the absence of a stimulus.",0],["A 38-year-old has felt persistent worry about work, health and finances for 8 months, with tension and poor sleep, and no discrete panic attacks. She has also been drinking more coffee. What is the key initial step per the lecture?","Exclude substance and organic causes and treat comorbidity before diagnosing GAD, which is a diagnosis of exclusion","GAD is largely a diagnosis of exclusion; caffeine, alcohol, stimulants and depression are on the differential.",1],["A student with fear of flying learns to approach feared situations gradually in a structured way and observes what happens. Which principle is being used?","Graded exposure in CBT, which counters escape and avoidance that reward anxiety by reducing it briefly","CBT uses gradual exposure so patients learn from acting differently and observing outcomes.",1],["A 31-year-old woman has repeated sudden episodes of palpitations, sweating and fear of dying that peak within 10 minutes with no trigger. Between attacks she is well but fears the next one and avoids crowded trains. Which diagnosis?","Panic disorder with agoraphobia","Recurrent unexpected attacks peaking within 10 minutes with anticipatory fear and avoidance indicate panic disorder with agoraphobia.",1],["A patient with anxiety disorders is on a stepped-care pathway. Which statement about NICE findings in the lecture is correct?","Psychological therapy is more effective than drugs and should be used first where possible; most drug evidence supports SSRIs","The lecture says NICE recommends psychological therapy first line, with pharmacological therapy also effective, most evidence for SSRIs.",1]]},{"id":"af","name":"Affective disorders","cards":[["What is first-line for less severe depression in NICE groups?","Active monitoring, guided self-help, CBT or behavioural activation","Antidepressants are not routinely first unless preferred.",0],["Which features raise suspicion of bipolar depression?","Earlier onset, recurrent brief episodes, family history and past antidepressant activation","They are not diagnostic.",0],["What does the lecture say about NICE and light therapy for seasonal pattern?","Evidence is limited and inconclusive; discuss uncertainty and preference","Seasonal timing should be established across episodes.",0],["How many of nine symptoms are needed for a major depressive episode?","At least 5, including low mood or loss of interest","Five of nine symptoms for at least 2 weeks, one being low mood or anhedonia.",0],["Which treatment statements are correct?","ECT: severe depression needing quick response; rTMS: non-invasive, not equivalent to ECT","ECT uses a controlled seizure under anaesthesia.",0],["What is the key criterion for persistent depressive disorder in adults?","At least 2 years, with no symptom-free gap over 2 months","Major depressive episodes can be superimposed.",0],["Which signs may indicate lithium toxicity?","Vomiting, diarrhoea, coarse tremor, unsteadiness or confusion","Dehydration and some medicines raise lithium levels; monitor renal and thyroid function and calcium.",0],["What does NICE advise if mania develops during antidepressant monotherapy?","Consider stopping it and offer an antipsychotic","Antidepressants should not be routine stand-alone treatment for bipolar I.",0],["What can limit overdose risk?","Limit medication quantities when clinically indicated","Consider overdose toxicity.",0],["What distinguishes grief from a depressive episode?","Grief comes in waves with self-esteem preserved; depression is pervasive with worthlessness","Thoughts of death in grief often centre on reunion with the deceased.",0],["What is the aim of behavioural activation?","Plan small achievable activities linked to pleasure or values","Review barriers rather than treat missed activity as failure.",0],["Which feature is typical of a manic episode?","Reduced need for sleep and pressured speech","Grandiosity and risky activity also.",0],["Which monitoring applies to long-term bipolar treatment?","Renal function, thyroid function and calcium for lithium","Dehydration and some medicines raise lithium levels.",0],["What does the lecture say about risk scales for suicide?","They cannot reliably predict suicide","Use individual assessment and a follow-up plan.",0],["What is affect?","The person's moment-to-moment emotional expression observed by the clinician","Mood comes from the person's report.",0],["Which antidepressant class has important dietary and drug interactions?","MAOIs","They are usually specialist.",0],["What is a seasonal pattern?","Depressive episodes repeatedly begin and remit at a particular time of year","Establish across episodes.",0],["How long must symptoms last for hypomania in DSM-5-TR?","At least 4 consecutive days","Hypomania needs at least 4 days; mania usually at least 1 week.",0],["What is a CBT step after identifying a thought?","Examine the evidence and alternatives","Then test a balanced response through experiment.",0],["What type of therapy works on grief, conflict or role transitions?","Interpersonal therapy","It addresses relationships and life events.",0],["Which is a feature of adjustment disorder?","Distress out of proportion to an identifiable stressor","Another disorder should not explain it.",0],["What are the rapid cycling and mixed features definitions?","Rapid cycling: at least four episodes in 12 months; mixed: depression with elevated activation","These patterns complicate treatment.",0],["What are SNRIs?","Drugs that reduce serotonin and noradrenaline reuptake","Withdrawal effects may need a taper.",0],["How does mania differ from hypomania?","Mania: marked impairment, about a week; hypomania: at least 4 days, no marked impairment","Bipolar II has hypomania plus major depression.",0],["Which defines bipolar II disorder?","At least one hypomanic and one major depressive episode, never mania","Cyclothymic disorder involves subthreshold hypomanic and depressive symptoms.",0],["Which drug class is commonly used first-line for depression?","SSRIs","They may cause nausea, sleep or sexual effects.",0],["How many associated symptoms are needed for mania?","At least 3, or 4 if the mood is only irritable","Mania usually lasts at least 1 week unless hospitalisation is needed sooner.",0],["What is the minimum duration for a major depressive episode?","Two weeks","Symptoms are present nearly every day.",0],["What are the core symptoms of depression?","Persistently low mood and loss of interest or pleasure","Anhedonia is loss of pleasure.",0],["Which antidepressant class is especially toxic in overdose?","Tricyclics","Anticholinergic and cardiac effects also.",0],["What is first-line for more severe depression?","Psychological therapy, antidepressant or a combination","Discuss benefits and harms.",0],["What does ECT treat best?","Severe depression needing a quick response","It is a neuromodulation option.",0],["What is rapid cycling?","At least four distinct mood episodes within 12 months","It complicates treatment.",0],["A woman was widowed 6 weeks ago. She cries in waves when reminded of her husband, preserves her self-esteem and sometimes wishes she could join him. Which feature best favours grief over a major depressive episode?","Emotions come in waves linked to reminders, with self-esteem preserved and thoughts of death centred on reunion","The lecture's table: grief shows waves, preserved self-esteem and reunion thoughts; depression is more pervasive with worthlessness and hopelessness.",1],["A patient with depression says: 'My boss criticised one report, so I am useless and will never succeed.' He avoids colleagues and falls behind. Which CBT step comes first in the lecture's sequence?","Notice the thought, then examine the evidence and test a balanced response with a behavioural experiment","The sequence: notice the thought, examine it, test a response, then consolidate and address core beliefs.",1],["A 29-year-old has not slept for 4 nights but feels energised, talks fast, spends heavily and believes he has a special mission. He has been hospitalised. What is the diagnosis and key distinction?","Mania (bipolar I), because there is marked impairment, hospitalisation or psychosis","Marked impairment, hospitalisation or psychosis indicates mania rather than hypomania; a single manic episode supports bipolar I.",1],["A woman starting long-term lithium develops vomiting, diarrhoea, a coarse tremor and unsteadiness after a gastroenteritis. What is the best interpretation?","Possible lithium toxicity needing urgent assessment, since dehydration raises levels","Dehydration and some medicines raise lithium levels; vomiting, diarrhoea, coarse tremor and unsteadiness suggest toxicity.",1],["A patient stops sertraline abruptly and within days has dizziness, nausea, anxiety and electric-shock sensations. Which statement best fits the lecture?","Discontinuation symptoms that may be mistaken for relapse; plan a gradual taper","Abrupt stopping can cause dizziness, flu-like symptoms, nausea, anxiety, insomnia and sensory symptoms, so taper gradually.",1]]},{"id":"sc","name":"Schizophrenia","cards":[["What is the role of expressed emotion in family contexts?","High criticism or over-involvement predicts relapse, yet families do not cause schizophrenia","Family intervention supports communication, problem-solving and early-warning plans.",0],["When does the lecture recommend offering clozapine?","After two adequate antipsychotic trials, including one non-clozapine second-generation drug","Blood monitoring and review of metabolic, cardiac and gastrointestinal adverse effects are essential.",0],["Which findings require urgent assessment in psychosis?","Suicidal intent, dangerous commands, self-neglect, new catatonia or acute confusion","Fluctuating attention, fever or seizures suggest a medical cause such as delirium.",0],["What physical measures are monitored before antipsychotic treatment?","Weight, waist, pulse, blood pressure, HbA1c or glucose, lipids and prolactin","ECG when indicated.",0],["What does Hemsley's model propose?","Past regularities guide perception; reduced context makes neutral events seem salient","It is a partial, testable account.",0],["What is true about childhood adversity and psychosis?","It increases population-level likelihood, but most exposed people do not develop psychosis","Pathways vary between people.",0],["Which cognitive domains may be affected in schizophrenia?","Attention, processing speed, working memory, verbal learning and social cognition","They shape daily function.",0],["Which differential should be excluded in a first psychotic episode?","Mood disorder with psychotic features, schizoaffective disorder, substances and medical causes","Time course matters.",0],["What does DSM-5-TR require for schizophrenia?","At least 2 of 5 symptoms for a month, one being delusions, hallucinations or disorganised speech, plus 6 months of signs","ICD-11 uses a 1-month requirement without the 6-month/functional-decline rule.",0],["Which neurotransmitter system has the strongest evidence for positive symptoms?","Presynaptic striatal dopamine signalling","Increased presynaptic striatal dopamine is linked most clearly to positive symptoms.",0],["Which cognitive process may maintain persecutory beliefs?","Jumping to conclusions and avoidance of testing the belief","Avoidance reduces anxiety briefly.",0],["Which statements about terminology are correct?","Kraepelin: dementia praecox; Bleuler: schizophrenia; not multiple personalities","Modern classifications use clinical criteria.",0],["What does Frith's model propose about voices?","Mismatched self-monitoring makes inner speech feel external","It is a specific hypothesis.",0],["What is a delusion?","A strongly held belief that persists despite counterevidence and is not explained by culture","It must be understood in context.",0],["What does the 5Ps formulation include?","Presenting, predisposing, precipitating, perpetuating and protective","It links symptoms and circumstances to revisable hypotheses.",0],["At what age does onset most often occur?","Late adolescence or the twenties","It occurs earlier in men on average.",0],["What is catatonia?","A psychomotor syndrome with stupor, mutism, negativism, posturing or stereotypy","New catatonia needs urgent assessment.",0],["What is true about hearing voices?","A person can hear voices without meeting criteria for schizophrenia","Appraisal of power influences fear.",0],["Which are the five symptom domains in the lecture?","Positive, disorganisation, negative, cognitive and affective/functional","Domains are interpreted with duration, distress and context.",0],["What is the role of the family in relapse risk?","High criticism, hostility or over-involvement is associated with relapse, but families do not cause psychosis","Family intervention supports communication.",0],["About how many people worldwide live with schizophrenia (WHO estimate)?","About 1 in 300","WHO estimates roughly 1 in 300 people, about 27 million.",0],["Which drug is used for treatment-resistant schizophrenia?","Clozapine, after two adequate trials of other antipsychotics","Clozapine needs blood monitoring for neutropenia.",0],["Which signs call for urgent assessment in psychosis?","New catatonia, acute confusion, fever, seizures or neurological signs","They suggest a medical cause such as delirium.",0],["What does a formulation's 'perpetuating' factor mean?","What may keep distress going","Protective factors support safety.",0],["What does NICE recommend for first-episode psychosis?","Antipsychotic plus individual CBT and family intervention","NICE recommends medication together with CBT and family intervention.",0],["What is a hallucination?","A perception-like experience without an external stimulus","Voices are common.",0],["What is aberrant salience?","Neutral events feel unusually significant","It may lead to a search for meaning.",0],["What does the ICD-11 require in terms of duration?","Symptoms most of the time for at least 1 month","DSM requires 6 months of continuous signs.",0],["What defines schizoaffective disorder?","Psychotic and major mood symptoms both occur","The timing and proportion matter.",0],["Which physical monitoring is recommended with antipsychotics?","Prolactin, lipids, glucose or HbA1c and movement symptoms","ECG is added when indicated by risk or product information.",0],["What is the strongest dopamine evidence in schizophrenia?","Increased presynaptic striatal signalling, linked with positive symptoms","It relates to aberrant salience.",0],["Which symptom group does derailment belong to?","Disorganisation","Tangentiality and incoherence also.",0],["What is anhedonia?","Reduced interest or pleasure","Asociality is reduced social interest.",0],["Who grouped symptoms under dementia praecox?","Kraepelin","He distinguished its course from mood illness.",0],["Psychosis is best described as what?","A syndrome, not a diagnosis","Psychosis is a syndrome of altered reality testing seen in many conditions.",0],["What is Frith's self-monitoring model?","Mismatched monitoring may make inner events feel external","It is one hypothesis about voices and experiences of control.",0],["Who introduced the term schizophrenia?","Bleuler","Kraepelin used dementia praecox.",0],["Alex, 21, has withdrawn socially over 8 months. For 6 weeks he has heard two voices commenting on his actions and believes neighbours monitor him. He uses cannabis most weekends and sleeps poorly. What is the most defensible first step?","Take a timeline of symptoms, mood, substances and sleep, and ask about safety and command content","Psychosis is a syndrome, not a diagnosis: the cause comes from a longitudinal history, examination and course, with direct risk questions; no scan or blood test confirms schizophrenia.",1],["A 22-year-old has withdrawn, shows little facial expression, speaks very little and has no interest in his studies, yet has no hallucinations or delusions. He is also tearful and sleeping 12 hours a day. Before calling the symptoms primary negative symptoms, what should be assessed?","Depression, medication effects, anxiety, substance use and social deprivation","The lecture advises excluding secondary causes of negative symptoms such as depression, medication effects and deprivation first.",1],["A patient with schizophrenia stops her tablets because of adverse effects and stigma and fears relapse. Which approach fits the lecture's shared decision principles?","Discuss concerns without blame, consider options such as a long-acting injectable, and agree an early-warning plan","The lecture advises non-blaming discussion, possible injectable preparation and written early-warning and contact plans.",1],["A man has had two adequate trials of different antipsychotics, including one non-clozapine second-generation drug, with adherence confirmed and cannabis stopped, but persistent positive symptoms. What does NICE advise?","Offer clozapine with blood monitoring and metabolic, cardiac and gastrointestinal review","Clozapine is offered after inadequate response to at least two adequate trials, including one non-clozapine second-generation drug.",1],["A 24-year-old has heard voices and held persecutory beliefs for 3 weeks, beginning the day after a binge of amphetamines, and they fade as he abstains. Which statement is most accurate?","A substance-induced psychotic disorder must be considered before schizophrenia, whose DSM duration is not met","Onset after exposure and resolution with abstinence suggest a substance effect; DSM-5-TR also needs continuous signs for at least 6 months.",1]]},{"id":"sl1","name":"Sleep I","cards":[["What did Landrigan et al. (NEJM 2004) and Wu et al. (JAMA 1991) report?","35.9% more serious errors on extended shifts; 41% of residents blamed fatigue for a mistake","Dawson and Reid compared wakefulness with blood alcohol.",0],["What are the main hypothesised functions of sleep listed in the lecture?","Macromolecule repair, waste clearance, energy conservation, memory consolidation and plasticity","The functions overlap and differ in evidence.",0],["After total sleep deprivation, what should the recovery night show?","More N3 early and more REM later, not full repayment","Rebound is stage-specific and incomplete.",0],["What frequency range characterises N3 slow waves, and what AASM change occurred in 2007?","0-4 Hz; stages 3 and 4 were combined into N3","N3 is high-amplitude and most prominent early in the night.",0],["Which neurons inhibit wake-promoting systems to initiate NREM sleep?","Preoptic GABA/galanin neurons including the VLPO","VLPO GABA/galanin neurons inhibit arousal systems; orexin neurons stabilise wake.",0],["What did the Dawson and Reid study show about 17 hours of wakefulness?","Performance comparable to a blood alcohol level of about 0.05%","24 hours equals about 0.10%.",0],["What does the two-process model of sleep regulation propose?","Sleep depends on homeostatic pressure and circadian wake promotion","Process S builds with wakefulness; Process C follows biological time. Both set sleep timing.",0],["Why do people feel adapted to sleep loss?","They may feel adapted before performance has recovered","Insight is impaired.",0],["Which clinical conditions involve K-complexes?","Epilepsy, Alzheimer's disease, sleep apnoea and restless legs","K-complexes promote and protect sleep.",0],["How do slow waves change with age?","N3 and slow-wave activity fall with age; slow waves become smaller and less synchronised","Older adults also have more awakenings and earlier timing.",0],["What is the role of chin EMG in polysomnography?","Shows muscle tone, including REM atonia","EOG shows eye movements; EEG shows cortical activity; SpO2 shows oxygenation.",0],["What does 'rebound' mean after sleep loss?","Increased pressure for the lost stage on the next sleep opportunity, not full repayment","N3 rebounds early and REM later.",0],["Which neurochemical state characterises REM sleep?","Low noradrenaline and serotonin with relatively high acetylcholine","This is a cholinergic state.",0],["What time of day is core body temperature typically lowest?","About 04:30","The circadian chart shows lowest body temperature near 04:30 and highest around 19:00.",0],["Which neurons stabilise wakefulness and prevent inappropriate transitions between sleep and wake?","Hypothalamic orexin neurons","The VLPO neurons inhibit arousal systems.",0],["Which system promotes cortical arousal?","Ascending reticular activating system","The ARAS projects to thalamus, hypothalamus and cortex.",0],["Which function is linked to N3 slow-wave sleep?","Declarative memory consolidation and growth hormone secretion","N3 supports declarative memory, restoration, GH pulses and immune regulation.",0],["What is a circadian rhythm?","A natural biological rhythm repeating roughly every 24 hours","Light and darkness help synchronise it.",0],["Which signals entrain the suprachiasmatic nucleus?","Retinal light signals","Light synchronises the body clock.",0],["What is the proposed role of REM sleep in emotional memory?","Keep the memory while reducing its emotional intensity","REM occurs with low noradrenaline and serotonin and relatively high acetylcholine, perhaps reducing affective tone.",0],["Which change in sleep occurs with ageing?","Less N3, more awakenings and earlier timing","These are population trends.",0],["What do sleep spindles contribute to?","Learning-related plasticity and sleep protection","They characterise N2.",0],["What proportion of residents said fatigue contributed to a significant mistake?","41%","This is from the resident self-report data.",0],["A junior doctor finishes a night shift at 08:00, feels exhausted but wakes after 4 hours of daytime sleep. Which explanation best uses the two-process model?","Homeostatic sleep pressure is high, but circadian wake promotion in the daytime opposes sleep continuity","Process S builds with wakefulness; Process C varies with biological time, so tiredness and ability to sleep can come apart.",1],["An intern works 24 hours without sleep. Which statement matches the evidence cited in the lecture?","About 17 hours awake impairs performance like a blood alcohol level of 0.05%, and extended shifts were linked to more serious medical errors","The lecture cites Dawson & Reid (17 h = 0.05% BAC), Landrigan et al. (35.9% more serious errors) and notes poor insight.",1],["A polysomnogram of the first third of the night shows high-amplitude slow waves, and the patient is hard to rouse. Which feature and clinical link?","N3; high arousal threshold, sleep inertia and NREM parasomnias","N3 is concentrated early in the night, with high arousal threshold, sleep inertia and NREM parasomnias.",1]]},{"id":"sl2","name":"Sleep II","cards":[["Why can sleep hygiene advice alone not be called CBT-I?","CBT-I also includes stimulus control, sleep restriction and cognitive therapy","Sleep hygiene is taught within CBT-I but does not replace its core components.",0],["Which statement about airflow in OSA versus central apnoea is correct?","Airflow is absent in both, so a trace alone cannot distinguish them","Respiratory effort differentiates.",0],["What is a typical bright-light regimen for winter seasonal affective disorder?","A UV-filtered 10,000-lux light box for 30-45 minutes daily","Typical SAD therapy is a 10,000-lux UV-filtered light box, often in the morning.",0],["What should be done for a patient whose mood improved but insomnia persists?","Assess and address the sleep complaint on its own","A psychiatric diagnosis does not exclude insomnia disorder.",0],["Which assessment sequence applies to suspected OSA?","Clinical assessment, objective testing (home test or PSG), interpretation with history","Assess symptoms, test objectively, interpret in context.",0],["Which AHI cut-offs define severity in adults?","<5 minimal, 5-14.9 mild, 15-29.9 moderate, 30 or more severe","AHI is apnoeas plus hypopnoeas per hour of sleep and guides severity but is not the whole patient.",0],["How often must insomnia occur to meet chronic insomnia disorder criteria?","At least 3 nights a week for 3 months","The criteria are at least 3 nights weekly for at least 3 months.",0],["How are STOP-BANG scores interpreted?","0-2 lower, 3-4 intermediate, 5-8 high risk; a screen, not a diagnosis","Diagnosis requires appropriate sleep testing.",0],["What is the orexin deficiency feature of narcolepsy type 2?","None; there is no cataplexy and orexin is not documented deficient","Type 1 has cataplexy or documented orexin deficiency.",0],["Which perpetuating factors keep insomnia going?","Long periods awake in bed and fear of not sleeping","These are predisposing and precipitating factors.",0],["Which items does the general sleep history cover?","Bedtime, waking, naps, workdays and free days","Also snoring, pauses and movements.",0],["Which statement about sleep terrors is correct?","They arise from NREM, often N3, earlier in the night, with limited recall","Nightmares are usually REM; RBD involves dream enactment.",0],["Which parasomnia involves dream enactment with loss of normal REM atonia?","REM sleep behaviour disorder","RBD is assessed with video-PSG; sleep terrors arise from N3.",0],["Which cognitive therapy target is used in CBT-I?","Catastrophic beliefs, worry and effort to force sleep","Stimulus control re-associates bed with sleep.",0],["What pattern characterises seasonal affective disorder?","Recurrent depressive episodes in winter with increased sleep and appetite","SAD: seasonal pattern, low mood, low energy, hypersomnia and increased appetite.",0],["Which contexts typically cause central sleep apnoea?","Heart failure, opioids and altitude","An airflow trace alone cannot reliably distinguish central from obstructive events.",0],["Which question screens for hypersomnolence?","Do you doze off unintentionally?","These question types separate different complaints.",0],["Which tool records when and how much a person sleeps?","Sleep diary","Actigraphy may be used selectively.",0],["Which experiences occur as sleep begins and on waking, respectively?","Hypnagogic and hypnopompic hallucinations","Hypnagogic hallucinations occur at sleep onset; hypnopompic during awakening.",0],["Which statement about jet lag is correct?","Eastward adjustment is often harder than westward adjustment","Timed light and melatonin shift the clock; eastward travel is usually harder.",0],["A 66-year-old shouts and punches during vivid dreams and has hurt his wife. Video-PSG shows REM without atonia. Which step matters most beyond safety?","Specialist follow-up for later neurodegenerative disease","RBD needs bedroom safety, review of medication and neurological follow-up.",1],["A 37-year-old New Yorker with winter-pattern SAD asks how to get sustained bright daytime light. Which option do the slides lead towards?","A prescribed UV-filtered 10,000-lux light box for 30-45 minutes daily, often in the morning","The lecture's typical winter-SAD approach is a 10,000-lux light box, with review of response and mood activation risk.",1],["A woman reports lying awake worrying although she has enough time in bed, with daytime fatigue. She has had it 3 nights a week for 5 months. Which diagnosis and first-line treatment?","Chronic insomnia disorder; CBT-I","Chronic insomnia needs at least 3 nights weekly for at least 3 months despite adequate opportunity; CBT-I is first-line.",1]]},{"id":"dm","name":"Dementia","cards":[["A 63-year-old accountant becomes disinhibited, eats compulsively, loses empathy; memory is normal. MRI shows frontal atrophy. Diagnosis?","Behavioural variant FTD","Early behavioural change with preserved memory suggests bvFTD.",0],["Which dementia definition features are included in the DSM-IV description?","Memory impairment plus aphasia, apraxia, agnosia or executive disturbance for over 6 months","Apraxia is loss of learned purposeful movement; agnosia is failure to recognise despite intact senses.",0],["A patient has MMSE falling 3 points a year and nursing-home admission 4 years after diagnosis. Total illness duration?","About 10-12 years","Symptoms 1-3 years pre-referral, diagnosis to nursing home 3-6 years, total 10-12 years.",0],["Which are named strategic single-infarct sites for vascular dementia?","Thalamus, frontal white matter, basal ganglia and angular gyrus","Multi-infarct dementia arises from emboli of cardiac or internal carotid origin.",0],["Hachinski score: abrupt onset 2, stepwise 1, fluctuating 2, history of stroke 2, hypertension 1, focal signs 2. Total and meaning?","10, vascular dementia","10 >= 7 suggests vascular dementia.",0],["Which antipsychotic approach is advised in Lewy body dementia?","Avoid them, or use quetiapine or clozapine only if necessary","Patients are very sensitive to antipsychotics; atypicals like quetiapine or clozapine are used if necessary.",0],["What is the relationship of amyloid and tau in biomarker timelines?","Amyloid deposition begins ~20 years before symptoms, then hippocampal atrophy and hypometabolism","Biomarker curves: Aβ first, then metabolism and volume loss.",0],["Which drug class is used for mild to moderate Alzheimer's disease?","Acetylcholinesterase inhibitors such as donepezil","Donepezil, rivastigmine and galantamine raise acetylcholine levels.",0],["What is the dementia screen blood panel?","FBC, U&E, LFT, TFT, glucose, B12, folate, calcium, CRP","Plus urinalysis, neurological exam, MMSE/ACE-III, and MRI or CT.",0],["Which potentially modifiable risk factors are among the 12 listed for dementia?","Hearing loss, social isolation and diabetes","About 35% of dementia risk is potentially modifiable.",0],["A 58-year-old has rapid dementia over 4 months, myoclonus and periodic sharp waves. Which CSF marker?","14-3-3 protein / positive RT-QuIC","CJD diagnosis supported by 14-3-3 protein and RT-QuIC.",0],["Which features describe Binswanger's disease?","Small vessel white-matter disease, gradual course, pseudobulbar signs and small stepping gait","Fluctuating cognition with good and bad days can occur; CADASIL is a related small vessel disease.",0],["A patient has dementia, ataxia, and a codon 102 prion mutation. Which condition?","Gerstmann-Straussler-Scheinker syndrome","GSS: codon 102 proline-to-leucine mutation; cerebellar ataxia then dementia.",0],["What is agnosia?","Loss of ability to recognise objects, persons, sounds or smells despite intact senses","Agnosia is a failure of recognition with intact primary sensation.",0],["Which atrophic pattern and metabolism fits AD on imaging?","Medial temporal and parietal atrophy with temporoparietal hypometabolism","AD: temporal and parietal; FTD: frontal and temporal; DLB: occipital.",0],["A patient has MMSE 24 but was a High Court judge, another has 24 as a labourer. Which concept?","Cognitive reserve","Cognitive reserve explains differing functional impairment for equal pathology.",0],["What proteins define Alzheimer pathology?","Extracellular beta-amyloid plaques and intracellular tau tangles","Plaques are beta-amyloid (outside cells); neurofibrillary tangles are hyperphosphorylated tau (inside).",0],["Which dementia mimics should be excluded?","Depression, MCI, metabolic causes, structural lesions","Mimics: depression, normal ageing, MCI, metabolic causes, SOL.",0],["How does dementia prevalence change with age in the lecture?","It roughly doubles every five years, reaching 13-16% at 80-85","Prevalence is 1% at 60-65, 2% at 65-70, 3-5% at 70-75, 8% at 75-79.",0],["Mutations in which genes cause familial early-onset AD?","APP, PS1 and PS2","Familial AD: APP (chr 21), presenilin 1 (chr 14), presenilin 2 (chr 1).",0],["Which anticholinesterase effect helps DLB?","Improves behaviour and visual hallucinations","Cholinesterase inhibitors help DLB; avoid antipsychotics.",0],["Which gene allele is the major genetic risk factor for late-onset AD?","ApoE4","ApoE4 carries the highest risk, especially E4/E4.",0],["Which dementia involves rapidly progressive dementia, myoclonus and periodic sharp waves on EEG?","Creutzfeldt-Jakob disease","CJD: rapid dementia, myoclonus, periodic sharp waves, DWI cortical ribboning, CSF 14-3-3 and RT-QuIC positivity.",0],["Which findings fit frontotemporal dementia?","Onset 45-65, Pick bodies with tau, knife-edge frontal atrophy","FTD (Pick's) begins 45-65 with bilateral frontal and anterior temporal atrophy; about 40% show tau inclusions.",0],["Which new therapies target amyloid in early AD?","Lecanemab, aducanumab and donanemab","Monoclonal antibodies target aggregated beta-amyloid.",0],["Which finding unlikely favours Alzheimer disease?","Sudden onset or focal neurological signs from the start","Unlikely AD: sudden onset, focal signs, seizures, gait dysfunction, parkinsonism, hallucinations early.",0],["Which core symptom is most characteristic of Lewy body dementia?","Fluctuating cognition with visual hallucinations","DLB: fluctuating cognition, recurrent visual hallucinations, parkinsonism, REM sleep behaviour disorder.",0],["Which dementia presents with disinhibition or apathy and preserved memory initially?","Behavioural variant frontotemporal dementia","bvFTD: personality change and social conduct alteration with relatively preserved perception, praxis and memory.",0],["Which FTD subtype loses word meaning (e.g. 'antelope - no idea what that is')?","Semantic dementia","Semantic dementia: loss of word and object knowledge.",0],["Which CSF markers does NICE list for AD investigation?","Total tau, phospho-tau and amyloid beta 1-42/1-40","NICE suggests FDG-PET/SPECT or CSF biomarkers in further investigation.",0],["Which biomarker is a promising blood test for AD?","Plasma phosphorylated tau 217","Plasma p-tau217 accurately identifies biological AD.",0],["What do the natural history figures for Alzheimer's give?","Illness 10-12 years, MMSE falling about 3 points a year, 3-6 years to nursing home","Symptoms are typically present for 1-3 years before referral.",0],["Which vitamin deficiency causes dementia with subacute combined degeneration?","Vitamin B12","B12 deficiency: dementia, SCD, neuropathy, anaemia, glossitis.",0],["A man aged 70 with insidious memory loss, anomia and disorientation over 2 years; MMSE 22. Which diagnosis?","Alzheimer disease","Gradual amnesia with language problems suggests AD, mild stage.",0],["A 59-year-old salesman has become rude, eats sweets and has lost interest in his family over 18 months. Memory and visuospatial tests are normal, executive function poor. MRI shows bilateral frontal and anterior temporal atrophy. Diagnosis?","Behavioural variant frontotemporal dementia","Early personality change with preserved memory and frontotemporal atrophy is bvFTD.",1],["A 71-year-old has well-formed visual hallucinations of small animals, marked fluctuation in alertness, mild rigidity and acts out dreams. A GP neuroleptic caused severe rigidity. Diagnosis and approach?","Dementia with Lewy bodies; cholinesterase inhibitor, avoid typical antipsychotics","Hallucinations, fluctuation, parkinsonism, REM behaviour disorder and neuroleptic sensitivity indicate DLB.",1],["Two 70-year-old patients score 24/30 on MMSE with similar plaque load; one is a former labourer and the other a judge who functioned normally until recently. Which concept explains this?","Cognitive reserve","Education and occupational complexity allow tolerance of more pathology before symptoms.",1],["A 61-year-old develops rapidly progressive dementia over 3 months with myoclonus and ataxia. EEG shows periodic sharp waves and MRI DWI shows cortical ribboning. Supportive CSF finding?","14-3-3 protein or positive RT-QuIC","CJD is supported by periodic sharp waves, DWI change and CSF 14-3-3 or RT-QuIC.",1],["A 68-year-old hypertensive diabetic has stepwise decline, a small stepping gait, urgency and emotional lability. Hachinski score is 9; MRI shows diffuse white matter change. Diagnosis?","Vascular dementia (subcortical small vessel disease)","HIS of 7 or more favours vascular dementia; stepping gait and pseudobulbar signs fit Binswanger disease.",1]]},{"id":"dl","name":"Delirium","cards":[["An 85-year-old with moderate dementia, on oxybutynin, with UTI becomes agitated. Which sequence fits management?","Treat the infection, stop the anticholinergic and use non-drug measures first, haloperidol only if dangerous","Cause first, drugs second, non-drug measures, then minimal sedation.",0],["In scenario 1 (older woman found on floor, talking to herself, drowsy, smelling of urine), what is the best working diagnosis?","Delirium, probably due to infection","Acute change, fluctuating alertness, and hallucination-like speech suggest delirium; look for UTI, hip fracture.",0],["4AT: alertness abnormal (4), AMT4 two errors (1), months backward not tested (2), acute change yes (4). Result?","11, possible delirium","4AT >=4 suggests delirium.",0],["Mechanistically, why is systemic infection more likely to trigger delirium in dementia?","Primed microglia over-respond to cytokines with reduced cholinergic inhibition","Primed microglia plus cholinergic loss amplify neuroinflammation.",0],["Which sedative does the lecture advise in delirium for patients with Lewy body dementia or Parkinson's disease?","Lorazepam 0.5-1 mg up to two hourly, maximum 3 mg in 24 hours","In DLB/PD, antipsychotics are avoided and lorazepam is used instead.",0],["Which scenario justifies CT head in an acutely confused patient?","Confusion after a fall with new focal signs","Indications: focal signs or low GCS, suspected encephalitis, head injury, raised ICP.",0],["What are the CAM diagnostic criteria for delirium?","Acute onset/fluctuation and inattention, plus disorganised thinking or altered consciousness","CAM requires features 1 and 2 plus either 3 or 4.",0],["What does the lecture claim about preventability?","With better routine care, delirium could be prevented in at least a third of patients","Delirium is associated with adverse outcomes.",0],["Which measure helps prevent delirium in hospital?","Reorientation, glasses, hearing aids and sleep promotion","Multicomponent non-pharmacological prevention can prevent delirium in at least a third.",0],["Which feature separates delirium from dementia in the comparison table?","Delirium: impaired attention and common hallucinations; dementia: attention preserved, hallucinations absent","Delusions are fleeting in delirium and often absent in dementia.",0],["A drowsy man with alcohol misuse and nystagmus is confused. Which action is crucial?","IV thiamine before glucose","Thiamine prevents Wernicke encephalopathy.",0],["Which inflammatory mediators are named in the neuroinflammation mechanism?","IL-6 and IL-8 released in sepsis, with microglial over-activation","CSF IL-8 is increased; cerebral autoregulation is lost.",0],["Which drug classes have anticholinergic activity and can cause delirium?","Tricyclic antidepressants, oxybutynin and antihistamines","The le
