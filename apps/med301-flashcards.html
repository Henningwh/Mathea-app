ready acquired","Parental concern is also a red flag.",0],["Which finding suggests peripheral rather than central hypotonia?","Prominent weakness with reduced or absent reflexes","Central hypotonia has other CNS signs.",0],["What are the two core domains of autism in DSM-5?","Social communication and interaction, and restricted repetitive behaviours","Onset is in the early developmental period.",0],["Which cause of floppy infant affects the neuromuscular junction?","Congenital myasthenic syndromes and infant botulism","Others affect muscle or nerve.",0],["Which drug classes treat ADHD?","Stimulants such as methylphenidate and non-stimulants such as atomoxetine","Medication is for age 5 and above with significant impairment.",0],["Which infections cause congenital intellectual disability?","CMV, rubella, toxoplasmosis, syphilis and HIV","Meningitis is postnatal.",0],["What is cerebral palsy?","A permanent, non-progressive disorder of movement and posture from damage to the developing brain","It begins before, during or soon after birth.",0],["How many symptoms are needed for ADHD diagnosis in a child under 17?","At least 6 of 9 in a domain","They must last 6 months in two or more settings.",0],["Which syndromes arise from 15q11-q13 abnormalities?","Prader-Willi and Angelman","Both are imprinted.",0],["Which are examples of stereotypies in autism?","Rocking, flapping, toe walking and banging","Also called stimming.",0],["Which is an anterior horn cell cause of floppy infant?","Spinal muscular atrophy","SMA affects the anterior horn cells.",0],["Which age should be used to assess development in a preterm baby?","Corrected age","Corrected age accounts for prematurity.",0],["Which investigation must always be done in suspected autism?","Hearing test","Hearing impairment is a differential.",0],["How is cerebral palsy diagnosed?","Clinically, with MRI brain to define the structural abnormality","Management is multidisciplinary.",0],["Which reflex appears at 6 to 9 months and persists for life?","Parachute reflex","It is a protective reflex.",0],["What is the prevalence of cerebral palsy?","About 2 per 1,000 live births","Causes can be acquired or genetic.",0],["What is global developmental delay?","Significant delay in two or more domains under age 5","Early intervention is key.",0],["Which brain area is damaged in dyskinetic cerebral palsy?","Basal ganglia","Dystonia, chorea and athetosis occur.",0],["What diagnosis is made by exclusion in a floppy infant?","Benign infantile hypotonia","It may persist with joint hypermobility.",0],["At what age does a child typically use 2 to 3 word phrases?","24 months","Not using them by 2.5 years is a red flag.",0],["Which cerebral palsy type affects legs more than arms?","Diplegia","Intelligence is often normal.",0],["Which syndrome is caused by a MECP2 mutation?","Rett syndrome","It is a single-gene disorder.",0],["What is the mechanism of atomoxetine?","Noradrenaline reuptake inhibition","Methylphenidate blocks both dopamine and noradrenaline reuptake.",0],["Which is the commonest chromosomal cause of intellectual disability?","Down syndrome (trisomy 21)","Severity is usually mild to moderate.",0],["What is Landau-Kleffner syndrome?","Epileptic aphasia","It mimics autism with regression.",0],["What treatment is used for spasticity in cerebral palsy?","Botulinum toxin","Orthopaedic surgery comes later.",0],["Which motor type of CP involves the cerebellum?","Ataxic","Poor balance and coordination.",0],["Which cerebral palsy distribution is the most severe?","Quadriplegia","Seizures may start in the first 48 hours.",0],["At what age does a child typically smile responsively?","4 to 6 weeks","It is a first social milestone.",0],["What is the IQ band of profound intellectual disability?","Below 20","ICD-10 bands.",0],["By what age should most primitive reflexes fade?","4 to 6 months","Persistence beyond 6 months suggests delayed maturation.",0],["Which is the most common motor type of cerebral palsy?","Spastic","It follows damage to the motor cortex and its pathways.",0],["At what age does a child typically sit unsupported?","6 to 8 months","Sitting comes before walking.",0],["What are the IQ bands for mild intellectual disability?","50 to 69","IQ has a mean of 100 and SD of 15.",0],["At what age does a child typically walk unsupported?","12 months","Not walking at 18 months is a red flag.",0],["What is the most common cause of a floppy infant?","Central (cerebral) hypotonia","Central hypotonia is most common.",0],["A 3-year-old boy lines up cars, has few words, little social interest and outbursts but likes cuddles. What must be checked first?","Hearing","Hearing impairment is a differential of ASD.",1],["A 7-year-old has morning vomiting, headache on waking, a sixth nerve palsy and ataxia. What is the next step?","Urgent MRI brain for red flag headache","Red flags need urgent imaging.",1],["A 10-month-old has no sitting, persistent mouthing, drooling and hand preference at 6 months. What is suspected?","Cerebral palsy or developmental delay","Early hand preference suggests hemiplegia.",1],["A floppy infant has tongue fasciculations, absent reflexes and weakness with alertness. Which diagnosis?","Spinal muscular atrophy","Anterior horn cell disease.",1],["A 2-year-old has a febrile generalised seizure lasting 5 minutes, once. Which type and advice?","Simple febrile seizure; reassure, no prophylaxis","Prognosis is good.",1],["A baby has a port-wine stain on the forehead, seizures and glaucoma. What is the diagnosis?","Sturge-Weber syndrome","V1 distribution.",1]]},{"id":"nm","name":"Skeletal muscle and NMJ","cards":[["Which patients have thymoma in myasthenia gravis?","Those in the 5th to 7th decade, with anti-striational antibodies","Titin and ryanodine antibodies are found in 30%.",0],["Which extramuscular features accompany inflammatory myopathies?","Fever, malaise, arthralgia, Raynaud's, cardiac and lung involvement","Respiratory weakness is rare.",0],["What are the EMG features of myopathy?","Short-duration, low-amplitude polyphasic units and positive sharp waves","The creatine kinase is variably increased.",0],["What is the end plate potential?","Local depolarisation from sodium entry after acetylcholine binds the receptor","It activates voltage-gated sodium channels.",0],["What does a repetitive nerve stimulation decrement indicate?","Greater than 10% drop between the first and fourth response","It supports a postsynaptic block.",0],["Which signs occur in Duchenne dystrophy?","Calf pseudohypertrophy, Gower's sign, lordosis and wheelchair by 12 years","Contractures and scoliosis occur.",0],["What is myasthenic crisis?","Worsening weakness causing respiratory failure requiring ventilation","It occurs in 15-20% of patients.",0],["What triggers acetylcholine release at the nerve terminal?","Activation of voltage-gated calcium channels","The rise in calcium causes exocytosis of quanta.",0],["Which symptoms characterise myasthenia gravis?","Fatigable weakness, diplopia, ptosis and dysphagia, with no sensory symptoms","Weakness is proximal more than distal.",0],["Which procedure treats young AChR-positive generalised MG and all thymoma?","Thymectomy","It is not used in MuSK-MG.",0],["What is the prognosis of inflammatory myopathy in general?","Generally good, with 10-year survival over 90%","Treatment is with steroids and sparing agents.",0],["Which treatment forms the first-line symptomatic therapy in myasthenia gravis?","Anticholinesterase inhibitors","Steroids are the next step.",0],["Which test is a positive bedside test using an acetylcholinesterase inhibitor?","Edrophonium (Tensilon) test","About 90% are positive.",0],["Where is the defect in Lambert-Eaton myasthenic syndrome?","Presynaptic","It is an autoimmune presynaptic disorder.",0],["Which triggers exacerbate MG?","Drugs, pregnancy, menstruation, infection and stress","Spontaneous long remissions are rare.",0],["Which feature of history suggests a channelopathy or metabolic myopathy?","Episodic weakness","Chronic slow progress suggests dystrophy.",0],["Which myositis may be triggered by statins?","Necrotizing autoimmune myositis","Biopsy shows necrotic fibres without inflammatory infiltrates.",0],["Which MG type is always generalised, with bulbar and axial involvement?","MuSK-MG","Limbs are mildly affected and atrophy is commoner.",0],["What is the incidence of Duchenne muscular dystrophy?","1 in 3500 male births","It is X-linked.",0],["How does botulinum toxin cause paralysis?","It prevents the release of acetylcholine","It acts presynaptically.",0],["Which myositis does not respond to immunosuppression?","Inclusion body myositis","It causes wasting of finger flexors and quadriceps.",0],["Which treatments are used in myasthenia crisis?","IV immunoglobulin or plasma exchange","Intubation may be needed.",0],["What is the biopsy finding of dermatomyositis?","Perifascicular atrophy","Polymyositis shows invasion of healthy fibres.",0],["Which is the most common disorder of neuromuscular transmission?","Myasthenia gravis","It is an acquired immunological abnormality.",0],["What is the sex preference in myasthenia gravis?","Women more than men","The distribution is bimodal.",0],["What proportion of myasthenic patients have thymic hyperplasia?","About 80%","Thymoma occurs in about 7 to 20%.",0],["Which tempo suggests an inflammatory myopathy?","Acute or subacute progressive weakness","Muscular dystrophies are chronic.",0],["A man with small cell lung cancer has proximal leg weakness that improves with repeated effort and dry mouth. What is the diagnosis?","Lambert-Eaton myasthenic syndrome","A presynaptic defect.",1],["A 25-year-old woman has ptosis and double vision worse in the evening, with normal sensation. Which test is best to confirm?","Acetylcholine receptor antibodies","Also single fibre EMG.",1],["A myasthenic patient develops breathlessness and is unable to cough after infection. What is the diagnosis and treatment?","Myasthenic crisis; ICU, IVIG or plasma exchange","Infection is a trigger.",1],["A 4-year-old boy falls frequently and climbs up his legs to stand, with enlarged calves. What is the diagnosis?","Duchenne muscular dystrophy","Calf pseudohypertrophy.",1]]},{"id":"sp","name":"Spinal cord disorders","cards":[["Why is pain and temperature loss contralateral in Brown-Sequard syndrome?","Fibres cross to the opposite side a few levels above their entry","The spinothalamic fibres decussate before ascending.",0],["Why may a hypotensive episode cause spinal cord infarction?","The cord watershed lies between vertebral supply above and the anterior spinal artery below","The watershed may reach up to about T4.",0],["Which conus medullaris finding distinguishes it from a cauda equina lesion?","A mix of upper motor neuron signs such as hyperreflexia and Babinski signs","The cauda equina lesion affects roots and the cord itself is unaffected.",0],["Which pattern of reflexes is found below a complete cord lesion once spasticity develops?","Brisk reflexes with extensor plantars and absent abdominal reflexes","Legs become spastic.",0],["What does congenital canal stenosis predispose to?","Earlier degenerative symptoms because the sagittal diameter is reduced","A narrow canal reduces reserve.",0],["How may a spinal arteriovenous malformation present?","Stuttering, slowly progressive deficits over months or years","Course is stuttering.",0],["Why do extradural bony lesions cause pain although the cord itself does not feel pain?","The pain arises from the diseased bone","The cord does not feel.",0],["What is the pattern of sensory loss in a central cord lesion such as syringomyelia?","Bilateral cape-like loss of pain and temperature with preserved touch and position","The loss is dissociated.",0],["Which statement about spinal cord infarction is correct?","There are no good treatments and prognosis is often poor","Venous infarcts are rare.",0],["Which tests can demonstrate conduction through sensory and motor tracts?","Evoked potentials","Evoked potentials show tract conduction.",0],["Which structures carry proprioception and two-point discrimination?","Posterior columns","The posterior columns form the medial lemniscal system.",0],["Which symptoms follow sacral root lesions?","Bowel, bladder and sexual dysfunction","These are sacral root functions.",0],["Which cord disorder follows radiation therapy?","Radiation myelopathy developing months to years later","Radiation and paraneoplastic syndromes affect the cord broadly.",0],["Where do the alpha motor neurons of the spinal cord lie?","In the anterior horn of the grey matter","The anterior horn contains alpha motor neurons and the fibres innervating skeletal muscle.",0],["Which treatment is needed for a spinal epidural abscess?","Surgical drainage and antibiotics","It often follows skin infection, tuberculosis or osteomyelitis.",0],["Which illness preferentially affects the posterior columns?","Vitamin B12 deficiency","Syphilis also affects the posterior columns.",0],["Which common cause of cord compression is extradural?","Bony metastases from breast or prostate cancer","Meningiomas and neurofibromas are intradural extramedullary.",0],["Which clinical picture fits anterior spinal artery syndrome?","Weakness and loss of pain and temperature below the lesion with preserved position sense","It also causes back pain and sphincter dysfunction.",0],["Why do patients with syringomyelia risk burns?","They lose pain and temperature sensation","Tissue injury goes unnoticed.",0],["Which finding indicates a lower motor neuron lesion?","Wasting and fasciculations with normal or absent reflexes","LMN lesions affect anterior horn cells, roots or peripheral nerves.",0],["Where does the C8 nerve root exit?","Above the first thoracic vertebra","There is no C8 vertebra.",0],["What is syringomyelia?","Expansion of the fluid space in the centre of the cord over several levels","It is the classic central cord lesion.",0],["Which description fits an intradural extramedullary lesion?","Meningioma or neurofibroma","Intradural lesions lie outside the cord substance.",0],["Which investigation best demonstrates a syrinx?","MRI","MRI gives sagittal views of the whole cord.",0],["Which artery feeds the anterior spinal artery caudally and supplies most of the thoracic cord?","Artery of Adamkiewicz","It is fed by perforating aortic branches at about L2.",0],["Where are the motor and sensory roots at each spinal level?","Motor anteriorly, sensory posteriorly","Motor roots are anterior and sensory roots posterior.",0],["With which malformation are about half of syrinxes associated?","Chiari malformation","They are associated with posterior skull and brain malformations.",0],["How many pairs of spinal nerves emerge along the cord?","31","8 cervical, 12 thoracic, 5 lumbar, 5 sacral and 1 coccygeal.",0],["Which finding indicates an upper motor neuron lesion?","Increased tone with brisk reflexes and up-going plantars","UMN weakness has no wasting.",0],["Which feature defines Brown-Sequard syndrome?","Ipsilateral weakness and position loss with contralateral pain and temperature loss","It is a hemicord syndrome.",0],["How is the spinal level of a compressive lesion estimated clinically?","By the highest level of motor dysfunction","Finger weakness at C7-C8 with preserved function above locates the lesion.",0],["A 58-year-old woman with breast cancer has two weeks of back pain, now with leg weakness, a sensory level at T8 and urinary retention. What is the diagnosis and level of urgency?","Metastatic cord compression, a neurologic emergency","Extradural bony metastases are a common cause.",1],["After a long hypotensive operation a patient wakes with paraplegia, loss of pain and temperature below T6 but preserved vibration and position sense. Which diagnosis fits?","Anterior spinal artery infarction","Position sense is preserved.",1],["A patient with ataxic gait, loss of position and vibration sense and a positive Romberg test has megaloblastic anaemia. Which cord pathology explains this?","Posterior column degeneration from vitamin B12 deficiency","B12 deficiency leads to posterior column disease.",1],["A patient with back pain after a skin infection develops fever, spinal tenderness and rapidly progressive leg weakness. Which is the likely cause and treatment?","Epidural abscess; surgical drainage and antibiotics","Epidural abscesses follow skin infection or osteomyelitis.",1]]},{"id":"pu","name":"Peripheral neuropathies","cards":[["Which two features are required for the diagnosis of Guillain-Barre syndrome?","Progressive weakness of more than one limb and areflexia or hyporeflexia","These are the NINDS criteria.",0],["What are the nerve conduction findings of a demyelinating neuropathy?","Markedly prolonged latency and slowed velocity with relatively normal CMAP amplitude","The pattern is the opposite in axonal neuropathy.",0],["Which diabetic neuropathy is associated with weight loss and intense pain?","Acute axonal polyneuropathy (neuropathic cachexia)","Insulin neuritis occurs with improved glycaemic control.",0],["Which components make up the peripheral nervous system?","Cranial nerves, peripheral nerves, neuromuscular junction and autonomic ganglia","The PNS connects sensory receptors to the CNS and the CNS to effectors.",0],["Which foot deformities are typical of Charcot-Marie-Tooth disease?","Pes cavus and hammer toes","It presents with distal muscular atrophy.",0],["Which feature suggests CIDP rather than Guillain-Barre syndrome?","Slowly evolving or relapsing course over months","It typically affects adults aged 40 to 60.",0],["Which compression neuropathies are more frequent in diabetics?","Median at the wrist, ulnar at the elbow, peroneal at the knee","Diabetics are more susceptible.",0],["What is pandysautonomia?","A dysimmune autonomic disorder after viral infection with ganglionic acetylcholine receptor antibodies","It affects sympathetic and parasympathetic systems.",0],["What is mononeuritis multiplex?","Several single nerves affected simultaneously or sequentially in an asymmetric pattern","It is also called multifocal neuropathy.",0],["Which layer of the peripheral nerve binds the fascicles together and merges with the dura of the roots?","Epineurium","It contains collagen, elastic fibres and fat.",0],["Which signs suggest a large fibre neuropathy?","Loss of vibration and position sense with loss of reflexes","Large fibres carry vibration and proprioception.",0],["What is Wallerian degeneration?","Disintegration of the axon and myelin distal to the site of injury","It follows axonal injury.",0],["What are the respiratory and infectious complications of Guillain-Barre syndrome?","About 20% need ventilation and 25% develop pneumonia","Dysphagia may need an NG tube or gastrostomy.",0],["Which neuropathy does Mycobacterium leprae cause?","Mononeuropathy multiplex favouring cool areas","Nerve hypertrophy may be seen.",0],["How common are critical illness neuropathies in ICU patients after two weeks?","About 50%","They cause difficulty weaning from the ventilator.",0],["Which diabetic neuropathy presents with severe thigh pain followed by hip and thigh weakness?","Diabetic amyotrophy","It affects older type 2 diabetics.",0],["What is a polyneuropathy?","Diffuse process affecting many nerves, usually distal and symmetrical","Some demyelinating forms are initially proximal.",0],["Which symptom suggests a small fibre neuropathy?","Disturbed temperature sensation and autonomic dysfunction","Cardiac arrhythmia and orthostatic hypotension may occur.",0],["Which treatments are used in CIDP?","Periodic IVIG, steroids and azathioprine","These are immunotherapies.",0],["Which pattern fits a length-dependent neuropathy?","Distal, symmetric, stocking-glove","Longest nerves are affected first.",0],["Which cranial nerves are most often affected in diabetic mononeuropathy?","Third, fourth and sixth","Truncal radiculopathy also occurs.",0],["Which test is raised in Guillain-Barre syndrome CSF?","Protein, without pleocytosis","Albuminocytologic dissociation.",0],["When is a nerve biopsy indicated?","Suspected vasculitic or infiltrative neuropathy","It is reserved for specific causes.",0],["Which drugs treat orthostatic hypotension from autonomic neuropathy?","Fludrocortisone and midodrine","Avoid large meals.",0],["Which conditions cause an autonomic neuropathy?","Amyloid, Chagas disease and paraneoplastic disorders","Toxins such as vincristine and cisplatin also cause it.",0],["What is the best treatment for diabetic polyneuropathy?","Tight glucose control","Symptomatic pain relief uses tricyclics, duloxetine or gabapentin.",0],["Which metabolic neuropathy mimics Guillain-Barre syndrome with abdominal pain?","Acute intermittent porphyria","It causes rapidly evolving weakness with areflexia.",0],["Which causes give a chronic neuropathy?","CIDP, diabetes and uraemia","Relapsing course suggests CIDP.",0],["What are the nerve conduction findings of an axonal neuropathy?","Reduced amplitude with normal or slightly slowed velocity","Amplitude reflects the number of axons.",0],["A 25-year-old has ascending leg weakness, absent reflexes and tingling two weeks after diarrhoea. CSF protein is raised with normal cells. What is the diagnosis and treatment?","Guillain-Barre syndrome; IVIG","Monitor respiratory function.",1],["A man from an endemic area has hypopigmented anaesthetic skin patches, thickened nerves and loss over the cool areas. What is the diagnosis?","Leprosy neuropathy","Dapsone is used.",1],["A diabetic of 12 years has burning feet, stocking sensory loss and orthostatic hypotension. What is the diagnosis?","Diabetic distal symmetric polyneuropathy with autonomic involvement","Tight glucose control is best treatment.",1],["A woman has abdominal pain, psychiatric symptoms and rapid flaccid weakness with areflexia. Which diagnosis should be considered?","Acute intermittent porphyria","It mimics Guillain-Barre syndrome.",1]]},{"id":"cn","name":"Cranial neuropathies","cards":[["Which features accompany Bell's palsy besides facial weakness?","Posterior auricular pain, decreased tearing and taste disturbance","These reflect facial nerve branches.",0],["Which finding occurs in a unilateral hypoglossal palsy from a lower motor neuron lesion?","Tongue deviates towards the side of the lesion","In upper motor neuron lesions it points away.",0],["What is the typical presentation of optic neuritis?","Acute monocular visual loss or blurring with pain on eye movement","Colour vision is affected.",0],["Where does the abducens nerve lie in the cavernous sinus?","In the middle alongside the internal carotid artery","The other nerves lie in the lateral wall.",0],["Through which structure do olfactory fibres enter the olfactory bulb?","Cribriform plate of the ethmoid bone","The olfactory nerve originates in the olfactory mucosa.",0],["What is the reversed jaw wink?","Twitching of the mouth corner or chin dimpling with each blink","It follows aberrant regeneration.",0],["What are the typical features of trigeminal neuralgia?","Brief stabbing electric shock-like facial pain triggered by touch","Trigger areas include chewing, talking and shaving.",0],["Which late complication of Bell's palsy produces tearing during eating?","Crocodile tears from aberrant regeneration","This is an autonomic synkinesis.",0],["Which brain injury mechanism commonly damages the olfactory tract?","Coup-contrecoup trauma","It also follows meningitis and frontal lobe tumours.",0],["Which is the less common cause of abducens palsy, as a false localising sign?","Raised intracranial pressure","Giant cell arteritis is another less common cause.",0],["What are the actions of the superior oblique muscle, in order of importance?","Intorsion, depression, abduction","Primary is intorsion.",0],["When do most patients with Bell's palsy start to recover?","Within about three weeks","Most recover well.",0],["What compresses the left recurrent laryngeal nerve?","Lung cancer or an aortic aneurysm","It loops under the aortic arch.",0],["Which finding distinguishes upper motor neuron facial weakness?","Preserved forehead movement with a weak lower face","The upper face has bilateral cortical input.",0],["Which aneurysm classically causes a painful oculomotor palsy with a dilated pupil?","Posterior communicating artery aneurysm","It is a vascular cause.",0],["Why is the trochlear nerve susceptible to injury in head trauma?","It has a long course","Microvasculopathy can also cause isolated palsies.",0],["Which condition may follow optic neuritis as a first episode?","Multiple sclerosis","Optic neuritis may be the initial episode.",0],["Which neurosurgical procedure gives the longest pain relief in trigeminal neuralgia?","Microvascular decompression","The others trade numbness for pain relief.",0],["Which are features of glossopharyngeal neuralgia?","Jabbing unilateral pain of the throat, tongue and tonsil, triggered by swallowing or speaking","It may awaken the patient from sleep and is treated like trigeminal neuralgia.",0],["Which cranial nerve carries pain sensation from the nose, so that damage to CN I does not reduce it?","Trigeminal nerve","Olfactory damage does not reduce pain sensation.",0],["What causes Bell's palsy in more than 90% of cases?","Reactivation of a dormant herpes virus","It is an inflammatory process.",0],["Which treatment is given for Bell's palsy?","Oral steroids with valaciclovir and eye protection","Eye patch, drops or ointment prevent damage from dryness.",0],["Through which foramen does the maxillary division exit the cavernous sinus?","Foramen rotundum","The other nerves enter the orbital apex through the superior orbital fissure.",0],["Which condition may cause bilateral vestibular schwannomas?","Neurofibromatosis type 2","They compress the vestibulocochlear nerve.",0],["What colour change is characteristic of optic neuritis?","Red desaturation","It is a sign of optic nerve dysfunction.",0],["A 28-year-old woman has a painful, blurred left eye for three days, worse on eye movement, with red desaturation and a relative afferent pupillary defect. What is the likely diagnosis and the risk?","Optic neuritis, with a risk of later multiple sclerosis","Methylprednisolone may speed up recovery.",1],["A patient has an acute painful third nerve palsy with a dilated pupil. What is the most important cause to exclude?","Posterior communicating artery aneurysm","Compressive lesions affect the pupil.",1],["A 62-year-old woman has stabbing electric facial pain triggered by brushing teeth or a breeze. What is the first-line treatment?","Carbamazepine","Surgery is for drug-resistant cases.",1]]},{"id":"np","name":"Clinical neuropsychology","cards":[["Which lobe is probably implicated if a person has new difficulty with decision making, planning and attention?","Frontal lobe","These are executive functions.",0],["For which situation is a neuropsychological evaluation recommended?","Whenever brain-based impairment of cognition or behaviour is suspected","It also tracks rehabilitation progress.",0],["How do achievement tests differ from aptitude tests?","Achievement measures developed skills; aptitude is a more general stable trait","They are contrasted with each other.",0],["How is speech production different from expressive language?","It is the formulation of speech sounds with lips, teeth and tongue","Expressive language is the formulation of thoughts into words.",0],["Which pair makes up the two biggest categories of memory?","Short-term (working) and long-term","They differ by storage time.",0],["What does neuropsychology study?","The structure and function of the brain as they relate to specific processes and behaviours","It is a clinical and experimental field of psychology.",0],["Which test uses the Wada procedure in preoperative assessment?","Intracarotid sodium amobarbital test","It assesses language and memory lateralisation in epilepsy surgery.",0],["Which cluster describes defective executive behaviour?","A cluster of deficiencies, one or two possibly prominent","Qualitative behaviour is also important.",0],["Which qualitative behaviours suggest frontal dysfunction during testing?","Impulsivity, perseveration and disinhibition","Personality change may occur.",0],["Which are the three aspects of memory mostly tested?","Immediate recall, delayed recall and recognition","These give a profile of memory function.",0],["What are normative data?","Data from standardisation used as a comparison standard for individual performance","They allow comparison of an individual with a reference group.",0],["What is visual figure-ground discrimination?","Distinguishing a shape or character from its background","It is one aspect of visual processing.",0],["What is meant by functional interconnectivity?","Brain areas wired together to complete functions","Specialisation and connectivity guide test choice.",0],["Which test measures attention and processing speed, with symbols and digits?","Symbol Digit Modalities Test","It appears in the executive tests list.",0],["Which condition is a typical reason for neuropsychological referral for developmental assessment?","ADHD or autism","Also Down syndrome and developmental disorders.",0],["What is visual closure?","Recognising an object when only parts are visible","It is part of visual processing.",0],["Which tests assess achievement or functional academics?","WIAT and Nelson-Denny Reading Test","Achievement tests measure learned skills.",0],["What are the two main forms of intelligence assessed?","Verbal and nonverbal","Verbal solves language problems and nonverbal solves visual and spatial ones.",0],["Which memory type requires conscious thought?","Explicit (declarative) memory","It is what most people think of as memory.",0],["What does the TOPF or NART estimate?","Pre-morbid ability","It identifies discrepancy between obtained and estimated scores.",0],["What is the sequence of the memory process?","Encoding, storage, retention, retrieval","Tests look at immediate recall, delayed recall and recognition.",0],["Which test is an infant and toddler development scale?","Bayley Scales","It is used in the earliest ages.",0],["What is expressive language?","The output of language, such as words combined into sentences","It includes gestures and facial expressions.",0],["What does executive function connect?","Past experience with present action","It includes planning, organising and strategising.",0],["Which memory type lets you do things on autopilot?","Implicit memory","It does not need conscious thought.",0],["Which is an example of an executive function?","Abstract thinking and problem solving","Others include sequencing and working memory.",0],["A 45-year-old man recently struggles to plan his week, makes impulsive decisions and cannot focus. Which domain and tests are most appropriate?","Executive functioning; Wisconsin Card Sorting and Trail Making","These symptoms suggest the frontal lobe.",1],["A woman before temporal lobe epilepsy surgery needs to know which hemisphere is dominant for language and memory. Which test is used?","Intracarotid amobarbital (Wada) test","Verbal memory reflects left hemisphere function.",1],["A patient forgets a list of words after 20 minutes but recognises them when given options. Which memory component is affected?","Retrieval","Recognition is spared.",1],["A lawyer requests an assessment to determine disability after a head injury. Is neuropsychological evaluation appropriate?","Yes, it is useful for disability determination and forensic purposes","It also helps planning education and work.",1]]},{"id":"dy","name":"Demyelinating diseases","cards":[["What happens to the MS risk of those who move from a low-risk to a high-risk region before age 15?","They adopt the risk of the new region","A childhood latent viral infection may play a role.",0],["Where do MS lesions have a predilection to occur?","Periventricular white matter, corpus callosum and cerebellar peduncles","Lesions are seen on T2-weighted MRI.",0],["What do disease-modifying agents in MS achieve?","Reduce relapse rate, MRI lesion burden and accumulated disability","They are used in relapsing-remitting and secondary progressive disease.",0],["Which features predict a better prognosis in MS?","Young age at onset, female sex, sensory or optic neuritis onset","Rapid remission and mild relapses also help.",0],["Which findings are present in transverse myelitis below the lesion?","Hyperreflexia, Babinski signs and loss of abdominal reflexes","Bowel and bladder function may be lost.",0],["What is the clinical picture of PRES?","Acute confusion and cortical blindness with preserved pupillary reactions","It occurs with rapidly developing hypertension or eclampsia.",0],["Which investigation shows prolonged P100 latency in old optic neuritis?","Visual evoked potentials","It documents prior optic neuritis.",0],["After 15 to 20 years, what proportion of patients with MS have a benign course?","About one third","Half have developed secondary progressive disease.",0],["How much more often are women affected by MS than men?","Two to three times","Women are more often affected.",0],["Which findings in CIS raise the risk of developing MS?","Clinically silent MRI lesions and CSF oligoclonal bands","These are the risk factors.",0],["What is Lhermitte's sign?","Electric tingling down the spine on neck flexion","It is a feature of MS.",0],["Which feature typifies optic neuritis in MS?","Painful unilateral loss of acuity, worse with movement","Colour discrimination is affected.",0],["How is urinary urgency in MS managed?","Anticholinergic agents and intermittent self-catheterisation","Bladder dysfunction is common.",0],["What is ADEM?","Monophasic demyelination commonly after viral infection or vaccination","Lesions are acute and enhance with gadolinium.",0],["What is secondary progressive MS?","Incomplete remission with deterioration of baseline function","It follows relapsing-remitting.",0],["Which drugs manage spasticity in MS?","Baclofen, diazepam, tizanidine or dalfampyridine","Dalfampyridine improves walking.",0],["What is the pathological hallmark of MS?","Acquired loss of myelin with relative preservation of axons","It is a demyelinating disorder.",0],["What is the acute treatment of an MS relapse?","IV methylprednisolone followed by an oral prednisone taper","It shortens the relapse.",0],["What is the prognosis of neuromyelitis optica?","Poor, with paralysis and blindness in the long term","Pain is common and severe.",0],["Which patients develop PML?","Immunocompromised patients, including those on monoclonal antibodies","AIDS, leukaemia and lymphoma are examples.",0],["Which are uncertain risk factors for MS?","Vitamin D deficiency, EBV infection and smoking","HLA genes are also implicated.",0],["How do transverse myelitis findings in MS present?","Partial cord lesion with a band of tingling around the torso","Reflexes are exaggerated below the lesion.",0],["A 25-year-old woman has painful loss of vision in the right eye on movement, with colour desaturation. MRI shows periventricular lesions. Which diagnosis fits?","Multiple sclerosis presenting with optic neuritis","Periventricular lesions suggest MS.",1],["A boy has seizures, hyperactivity and speech problems, with raised very long-chain fatty acids and adrenal insufficiency. What is the diagnosis?","X-linked adrenoleukodystrophy","Lorenzo's oil is a dietary treatment.",1],["A patient feels an electric shock down the spine when flexing the neck. What is the sign and condition?","Lhermitte's sign in multiple sclerosis","It occurs with cervical cord demyelination.",1]]},{"id":"mn","name":"Meningitis and intracranial infections","cards":[["What effect does oral antibiotic pre-treatment have on the CSF?","Does not significantly alter WBC or glucose but reduces protein and yield of Gram stain and culture","PCR can help.",0],["Which causes of seizures occur in the first week of bacterial meningitis?","Fever, focal ischaemia, cortical vein thrombosis, subdural collection, hyponatraemia and antibiotics","Seizures are a neurological complication.",0],["Which signs indicate cerebral herniation in meningitis?","Coma, unilateral fixed dilated pupil, decerebrate rigidity and Cheyne-Stokes breathing","The risk is independent of lumbar puncture.",0],["Which clinical findings are indications for CT before lumbar puncture?","Coma, focal deficit, papilloedema or posterior fossa signs","CT is not always required.",0],["What is a normal CSF white cell count after 8 weeks of age?","5 per mm3 or fewer","Over 5 is abnormal.",0],["Which empirical antibiotics are used in adults over 50 years?","Ceftriaxone plus amoxicillin, with or without vancomycin","The amoxicillin covers Listeria.",0],["Which EEG finding occurs in HSV encephalitis?","Periodic lateralised epileptiform discharges (PLEDs)","The CJD pattern is generalised periodic sharp waves.",0],["Which agent causes cryptococcal meningitis, the most common fungal CNS infection?","Cryptococcus neoformans","Acquired by inhalation from soil and pigeon droppings.",0],["What is aseptic meningitis?","Acute meningeal irritation with mononuclear CSF pleocytosis and no bacteria on smear or culture","Course is self-limited and benign.",0],["Which clinical triad occurs in 90% of herpes simplex encephalitis?","Headache, fever and altered mental status","Seizures may have olfactory or gustatory hallucinations.",0],["What complications arise in tuberculous meningitis?","Cranial nerve palsies, hydrocephalus and infarcts","The basal meninges are affected.",0],["Which organisms commonly cause bacterial meningitis in adults?","Streptococcus pneumoniae and Neisseria meningitidis","They are the main adult pathogens.",0],["What does a normal CRP indicate in suspected meningitis?","A high negative predictive value (99%) for bacterial meningitis","It helps exclude bacterial meningitis.",0],["Which brain regions does HSV encephalitis involve?","Temporal and frontal lobes","It spreads from the trigeminal ganglia.",0],["What is the CSF cell count in viral meningitis?","Mild pleocytosis of 100 to 1000 per microlitre","Lymphocytes predominate.",0],["Which prophylaxis is given for contacts of Haemophilus influenzae meningitis?","Rifampicin","Four days of rifampicin.",0],["Approximately how often is raised intracranial pressure seen in bacterial meningitis?","6 to 8%","Raised pressure is expected.",0],["What serum procalcitonin cut-off suggests bacterial meningitis?","0.74 ng/ml or higher","It has sensitivity of 95% and specificity of 100%.",0],["In which bacterial meningitis may lymphocytes predominate?","Listeria monocytogenes and tuberculosis","Early viral meningitis may show neutrophils.",0],["When is CSF PCR particularly useful?","Negative Gram stain or pre-treatment with antibiotics","PCR can be carried out on CSF, blood and throat swabs.",0],["What is the classic triad of meningitis symptoms with meningismus?","Fever, headache and neck stiffness","Photophobia, vomiting and altered consciousness are also classic.",0],["What is the first-line empirical antibiotic for adult bacterial meningitis aged 3 months to 50 years?","Ceftriaxone","Vancomycin may be added.",0],["Which signs of meningism are tested at the bedside?","Kernig's and Brudzinski's signs","They indicate meningeal irritation.",0],["How sensitive is Ziehl-Neelsen staining of CSF in tuberculous meningitis?","About 60%","Large volumes examined for a prolonged time.",0],["Which viruses commonly cause aseptic meningitis?","Enteroviruses, HSV-1 and HSV-2, VZV and HIV","They are detected by CSF PCR.",0],["How is meningitis defined?","Fever, headache and meningismus with subarachnoid inflammation shown by CSF pleocytosis","It may be bacterial or viral.",0],["For how long are meningococci treated?","7 days","With ceftriaxone or benzylpenicillin.",0],["Which drug treats herpes simplex encephalitis?","Acyclovir","10 mg/kg every 8 hours for 3 weeks.",0],["Which cell type predominates in bacterial meningitis CSF?","Polymorphonuclear cells","Viral meningitis has a lymphocytic predominance.",0],["Which test is needed to diagnose meningitis?","Examination of the CSF","Meningitis can only be diagnosed by CSF examination.",0],["What are the typical CSF findings in tuberculous meningitis?","High protein, lymphocytes and low glucose","Protein is 100 to 500 mg/dL.",0],["What chemoprophylaxis is given to contacts of meningococcal meningitis?","Ciprofloxacin","Rifampicin is used for Haemophilus contacts.",0],["What incidence is quoted for bacterial meningitis in adults?","2.6 to 6 per 100,000","It is a medical emergency.",0],["How often is the Gram stain positive in pneumococcal meningitis?","About 90%","It is 70-90% for meningococcus, 50% for Haemophilus and 25-35% for Listeria.",0],["Which virus causes most cases of herpes encephalitis?","HSV-1","HSV-1 causes about 90%.",0],["Which organism causes tuberculous meningitis?","Mycobacterium tuberculosis","It has a predilection for the basal meninges.",0],["What is the sensitivity of CSF PCR in HSV encephalitis?","About 98%","The CSF cell count may be normal.",0],["What drug is given with antibiotics in bacterial meningitis?","Dexamethasone","Give before or with the first dose, or within 12 hours.",0],["For how long is Listeria meningitis treated?","21 days","With ceftriaxone 2 g intravenously every 4 hours as listed.",0],["What is the typical CSF glucose in bacterial meningitis?","Low","CSF to serum ratio below 0.3.",0],["A man has lightning leg pains, poor balance and small irregular pupils that accommodate but do not react to light. What is the diagnosis?","Tabes dorsalis from neurosyphilis","Argyll Robertson pupils.",1],["A patient with sinusitis develops headache, fever and a focal deficit; CT shows a ring-enhancing lesion. What is the diagnosis and treatment?","Brain abscess; aspiration and prolonged IV antibiotics","Respiratory pathogens invade from sinuses.",1],["A 60-year-old has rapidly progressive dementia, startle myoclonus and periodic sharp waves on EEG with 14-3-3 positive. What is the diagnosis?","Creutzfeldt-Jakob disease","Sporadic CJD can be fatal within months.",1],["A student has fever, headache, photophobia, neck stiffness and a petechial rash. What are the immediate management and organism?","Urgent ceftriaxone with dexamethasone; Neisseria meningitidis","Meningitis is an emergency.",1],["A man has weeks of headache, malaise, cranial nerve palsies and CSF with low glucose, high protein and lymphocytes. What is the diagnosis?","Tuberculous meningitis","Basal meningeal predilection.",1],["A man with fever, confusion and a seizure with an olfactory aura has temporal lobe changes on MRI. What treatment is started?","Acyclovir","HSV encephalitis.",1]]},{"id":"sy","name":"Systemic and metabolic disorders","cards":[["In antiphospholipid syndrome, which statement about thrombosis is correct?","Most thrombotic episodes are venous, and in arterial events the brain is the most common site","Both small- and large-vessel stroke occur.",0],["How should hyponatraemia be corrected to avoid central pontine myelinolysis?","Slowly, with a limited rise of sodium per hour","Overly rapid correction precipitates it.",0],["Which CNS manifestation of lupus is difficult to recognise because there is no diagnostic test?","Isolated psychosis or depression","Neuropsychiatric lupus has no specific test.",0],["How is antiphospholipid antibody syndrome confirmed?","High-titre IgG antibodies on two occasions at least 6 weeks apart","Lupus anticoagulant prolongs the partial thromboplastin time.",0],["Which investigations help if serum B12 is normal but deficiency is suspected?","Homocysteine and methylmalonic acid","Both are elevated when B12 is deficient.",0],["Which peripheral nerve patterns occur in lupus?","Distal sensory polyneuropathy and mononeuropathy multiplex from vasculitis","Both are listed.",0],["Which hypothalamic features occur in neurosarcoidosis?","Hypopituitarism, diabetes insipidus, sleep disturbance and obesity","Thermoregulatory disturbance also occurs.",0],["Which feature is characteristic of toxic-metabolic encephalopathy?","Fluctuation, with waxing and waning arousal","Severity ranges from mild inattention to coma.",0],["Which neurological sign of hypothyroidism worsens myasthenia gravis?","Neuromuscular junction dysfunction","Hypothyroidism worsens myasthenia.",0],["Which disease causes headache, blindness, polyneuropathy and stroke?","Giant cell arteritis","It is a vasculitis.",0],["Which muscle finding occurs in hypothyroidism?","Cramps and stiffness with proximal weakness and raised CK","Proximal more than distal.",0],["What is the expected response to B12 replacement in subacute combined degeneration?","Partial improvement","Treat early.",0],["How does the antiphospholipid antibody promote coagulation?","It upregulates tissue factor in monocytes and endothelial cells","Tissue factor initiates coagulation.",0],["Which clinical picture can follow central pontine myelinolysis?","Spastic quadriparesis or locked-in syndrome","It also causes an acute confusional state.",0],["What is encephalopathy?","Disruption of brain function without a direct inflammatory process in the parenchyma","It is associated with metabolic disturbance, hypoxia, drugs, organ dysfunction or systemic infection.",0],["What is the most common neurological manifestation of sarcoidosis?","Cranial neuropathy from chronic basal meningitis","The facial and optic nerves are most often affected.",0],["Which patients are predominantly affected by systemic lupus erythematosus?","Young women","It is an inflammatory connective tissue disorder.",0],["Which disease causes dementia, seizures, myoclonus and supranuclear ophthalmoplegia?","Whipple disease","It also causes oculomasticatory myorhythmia.",0],["Which ataxia pattern occurs in hypothyroidism?","Truncal and gait ataxia more than limb ataxia","Dysarthria and nystagmus also occur.",0],["What is sarcoidosis?","A multisystem noncaseating granulomatous disorder of unknown cause","Pulmonary disease is the most common form.",0],["What is the long-term treatment for antiphospholipid antibody syndrome with stroke?","Warfarin to a target INR","Anticoagulation is long term.",0],["Which CSF finding is typical of neurosarcoidosis?","Raised protein with lymphocytic pleocytosis","Serum ACE may also be elevated.",0],["Which condition causes venous or arterial thrombosis, recurrent fetal loss and thrombocytopenia?","Antiphospholipid antibody syndrome","It is associated with raised antibodies against phospholipids.",0],["A 60-year-old alcoholic man is brought in confused with truncal ataxia and abnormal eye movements. What is the diagnosis, and what is the urgent treatment?","Wernicke's encephalopathy; IV thiamine before glucose","IV glucose can precipitate Wernicke's.",1],["A 65-year-old has headache, jaw claudication and sudden loss of vision in one eye. What diagnosis, and which family of diseases?","Giant cell arteritis, a systemic vasculitis","It is a neurologic manifestation of vasculitis.",1],["After thiamine treatment, a patient is alert but cannot form new memories and invents stories to fill gaps. What is this?","Korsakoff syndrome","Isolated memory disturbance with confabulation.",1]]},{"id":"pd","name":"Personality disorders","cards":[["Which features suit schizotypal personality disorder?","Magical thinking, social anxiety, odd speech and dress, and few friends","They believe in telepathy.",0],["Why are patients with Cluster B disorders usually seen in clinics?","Because of somatoform disorders or substance abuse, not their personality","They are ego syntonic.",0],["What is the relationship of Cluster A to schizophrenia?","They show some behaviours but no florid symptoms such as delusions or hallucinations","They are often biological relatives of schizophrenics.",0],["Which feature defines a personality disorder?","Relatively inflexible maladaptive thinking, feeling and behaving that deviates from cultural norms","It has a developmental origin and is lifelong.",0],["What does ego syntonic mean for personality disorders?","The person feels there is nothing wrong with them","They think everyone else needs to change.",0],["Which therapy for BPD uses mindfulness to reduce self-harm?","Dialectical behaviour therapy","It aims at reducing self-harming behaviour.",0],["How does avoidant personality disorder differ from schizoid?","Avoidant individuals desperately want friends but fear rejection","They are excessively shy.",0],["What is a drawback of the categorical approach?","Arbitrary cut-offs and ignoring overlap","It is simple and good for epidemiology.",0],["What are the Big Five personality dimensions?","Openness, conscientiousness, extraversion, agreeableness and neuroticism","The dimensional approach.",0],["Which group has a higher prevalence of personality disorder?","Males, unemployed and divorced or separated","Cluster C is more commonly reported.",0],["Which aetiological factors are proposed for personality disorder?","Heritability of traits, childhood experiences and attachment","Psychodynamic theories and affective dysregulation are included.",0],["Why do borderline patients self-mutilate?","To ensure they are real, because of instability and confusion","They may also be at higher suicide risk.",0],["What is the key feature of dependent personality disorder?","Avoiding responsibility and decisions, relying on others","They fear caring for themselves.",0],["Which disorders are associated with Cluster B comorbidity?","Functional psychoses, mood and anxiety disorders and substance misuse","Cluster C is associated with mood and anxiety disorders.",0],["What does the neuroticism dimension describe?","Inclination to worry or be vulnerable or temperamental","It is one of the Big Five.",0],["Which features suit paranoid personality disorder?","Mistrust, reluctance to confide and carrying grudges","They have no delusions.",0],["Whom do people with personality disorders try to change?","The world around them","They cannot change themselves.",0],["What happens to Cluster B disorders with increasing age?","They become less common","Symptomatic improvement occurs with age.",0],["What does conscientiousness describe?","Planning ahead rather than being spontaneous","It is one of the Big Five.",0],["How does the psychoanalytic view explain antisocial personality disorder?","A lack of superego","There is no morality in their actions.",0],["What would be a better name for obsessive-compulsive personality disorder?","Perfectionistic personality disorder","They have no obsessions or compulsions.",0],["What is a categorical classification?","Qualitatively distinct clinical syndromes","Used in ICD-11 and DSM-5.",0],["Which features suit schizoid personality disorder?","Lifelong social withdrawal that they like, with restricted emotions","Males are affected twice as often as females.",0],["What is the dimensional approach?","Personality on a continuum, with normal and disordered at the extremes","It is complex to use.",0],["How does antisocial differ from schizoid personality disorder?","Antisocial individuals are criminals, whereas schizoid avoid relationships","They are often confused.",0],["How pervasive is a personality disorder?","It appears in all areas of life","If behaviour is only odd in one setting it is not a personality disorder.",0],["What proportion of borderline patients commit suicide?","About 5%","The risk is higher in this group.",0],["A 30-year-old woman has intense unstable relationships, impulsive spending, cuts herself and describes people as all good or all bad. What is the diagnosis and therapy?","Borderline personality disorder; dialectical behaviour therapy","Splitting is present.",1],["A man insists on lists, rules and perfect order, cannot throw things away and lacks humour, with no obsessions or compulsions. What is the diagnosis?","Obsessive-compulsive personality disorder","It lacks obsessions and compulsions.",1],["A man fears his colleagues are plotting against him, reads hidden meanings in remarks and holds grudges, with no hallucinations. What is the diagnosis?","Paranoid personality disorder","He has no delusions or hallucinations.",1],["A clinician is asked which drug helps aggression and impulsivity in Cluster B disorders. What is the answer?","Mood stabilisers or anti-epileptics","NICE found no evidence for medication in BPD.",1]]},{"id":"cv","name":"Cerebrovascular disease","cards":[["How does the WHO define stroke by duration?","Focal loss of cerebral function lasting more than 24 hours or leading to death, with no cause other than vascular","Symptoms are rapidly developing.",0],["What is the cause and typical presentation of subarachnoid haemorrhage?","Aneurysmal bleeding within the circle of Willis with sudden severe headache and vomiting","Coma may follow a rapid rise in ICP.",0],["What are common lacunar syndromes?","Pure motor hemiparesis, hemisensory loss, sensorimotor stroke, ataxic hemiparesis and dysarthria clumsy hand","Lacunar strokes spare the cortex.",0],["How does cerebral venous sinus thrombosis typically present?","Subacute headache, vomiting, visual symptoms, seizures and focal deficits","It is due to raised ICP, venous infarction or haemorrhage.",0],["Which are typical locations of hypertensive intracerebral haemorrhage?","Basal ganglia-internal capsule, thalamus, caudate and cerebellum","Amyloid angiopathy prefers the parietal and occipital lobes.",0],["When is mechanical thrombectomy given alongside thrombolysis?","Within 6 hours for proximal anterior circulation occlusion","Later windows need perfusion imaging.",0],["Which features suggest vertebrobasilar stroke?","Bilateral weakness, ataxia, diplopia, dysarthria, dysphagia and impaired consciousness","Posterior circulation strokes affect the brainstem.",0],["Which surgery is used for large infarcts?","Decompression for malignant MCA syndrome or large cerebellar infarction","These are brain-swelling syndromes.",0],["What are Charcot-Bouchard aneurysms?","Microaneurysms of small vessels under 300 microns","They are associated with hypertensive haemorrhage.",0],["Which risk factors apply to small vessel stroke?","Age and hypertension, but not AF","Hyaline arteriolosclerosis is the cause.",0],["Which causes of ICH occur in the elderly with lobar bleeds?","Cerebral amyloid angiopathy","Anticoagulants are another cause.",0],["When are antihypertensives given in acute stroke?","Only if cardiac failure or encephalopathy unless thrombolysis given","Blood pressure is otherwise left.",0],["Which drug minimises vasoconstriction and delayed ischaemia after subarachnoid haemorrhage?","Nimodipine","Aneurysms are clipped or coiled to prevent rebleeding.",0],["Which carotid dissection sign is typical?","Ipsilateral Horner's syndrome with preserved sweating","Sudomotor fibres ascend with the external carotid artery.",0],["What is the blood pressure target for intracerebral haemorrhage?","Systolic 130 to 150 mmHg","Reverse anticoagulation.",0],["Which scale helps recognise stroke in the emergency room?","ROSIER score","A score above 0 makes stroke likely.",0],["What is the duration of a typical transient ischaemic attack?","Seconds to minutes, typically under an hour","Many patients with TIA over 10 minutes have an infarct on MRI.",0],["What time window applies to intravenous alteplase?","Within 4.5 hours of onset","Intracranial haemorrhage must be excluded.",0],["Which is a cause of CVST?","Pregnancy, puerperium, combined OCP or thrombophilia","Dehydration and head injury are others.",0],["Which factor in INTERSTROKE was protective?","Regular physical activity","Odds ratio 0.69.",0],["Which cortical features occur in large vessel stroke?","Neglect, dysphasia, dyspraxia and hemianopia","Large vessel strokes affect cortical function.",0],["When should aspirin be started in acute ischaemic stroke?","Within 24 hours once haemorrhage is excluded","A statin is also started within 24 hours.",0],["What are the secondary prevention targets after stroke?","BP below 130/80 and LDL below 77 mg/dl","Lifestyle advice applies to all stroke types.",0],["What is the cause of vertebral artery dissection?","Neck manipulation or trauma","It causes neck pain and posterior circulation stroke.",0],["When is a cerebellar clot removed?","If there is brainstem compression","Cerebral clot removal is controversial.",0],["When is carotid endarterectomy indicated?","Symptomatic carotid stenosis of 50% or more","Angioplasty is an alternative.",0],["Which cardiac cause is a common source of cerebral embolism?","Atrial fibrillation","Cardiac causes have an OR of 2.38.",0],["What is the stroke risk after a TIA at three months?","About 20%","Half occurs within 2 to 10 days.",0],["What proportion of ischaemic strokes are preceded by TIAs?","20 to 25%","TIAs are a warning.",0],["Which headache accompanies carotid dissection?","Severe ipsilateral retro-orbital headache","Stroke involves the anterior circulation.",0],["What is the target blood glucose range after acute stroke?","4 to 11 mmol/L","140-180 mg/dl.",0],["Which types of stroke exist?","Cerebral infarction, intracerebral haemorrhage, subarachnoid haemorrhage and venous thrombosis","Cerebral venous thrombosis is also a type.",0],["Which was the strongest risk factor for stroke in the INTERSTROKE study?","Hypertension","Odds ratio 2.64.",0],["What are the causes of ischaemic stroke by vessel size?","70% large vessel disease and 30% small vessel disease","Small vessel disease causes lacunar infarcts.",0],["How is CVST treated?","Anticoagulation for 6 months","Even if there is some haemorrhage on CT.",0],["What is the commonest cause of primary intracerebral haemorrhage?","Hypertension","Age is also a major factor.",0],["How is CVST diagnosed?","CT or MR venography","Investigate for an underlying cause.",0],["A 45-year-old has a sudden thunderclap headache and vomiting then collapses; CT shows blood in the basal cisterns. What is the likely cause and treatment?","Ruptured aneurysm; coiling or clipping with nimodipine","Prevent rebleeding and vasoconstriction.",1],["A patient had 10 minutes of left arm weakness that resolved. What is the immediate management?","Emergency assessment with aspirin loading and clopidogrel, statin and imaging","TIA is an emergency.",1],["After neck manipulation a man has neck pain and vertigo, diplopia and ataxia. What is the diagnosis?","Vertebral artery dissection with posterior circulation stroke","It follows neck manipulation or trauma.",1],["A young man's MCA infarct is swelling with a falling consciousness level. What is the surgical option?","Decompressive craniectomy for malignant MCA syndrome","It is a brain-swelling syndrome.",1],["A hypertensive 60-year-old collapses with headache, vomiting and hemiparesis; CT shows a basal ganglia haemorrhage. What is the main cause and the BP target?","Hypertension; systolic 130-150 mmHg","Reverse anticoagulation if present.",1]]},{"id":"no","name":"Neuro-ophthalmology","cards":[["Why do medical oculomotor lesions spare the pupil?","Microangiopathy affects the vasa vasorum of the main trunk, sparing the pial supply of parasympathetic fibres","Hypertension and diabetes are the causes.",0],["Which investigation is urgent in a third nerve palsy?","Immediate imaging if pupil involved, extra deficits, age under 50 or duration over 3 months","MRI with contrast and MRA.",0],["Which causes lead to unilateral optic disc swelling?","Optic neuritis, ischaemic optic neuropathy, central retinal vein occlusion and compression","Bilateral swelling suggests raised ICP.",0],["What are the features of optic neuritis?","Reduced vision, RAPD, impaired colour vision, enlarged blind spot and pain on eye movement","Pain arises because muscle origins surround the optic nerve.",0],["Which structures does the trigeminal nerve motor supply include?","Muscles of mastication, anterior digastric, mylohyoid, tensor tympani and tensor palati","The facial nerve supplies the stapedius.",0],["Why is the lateral rectus at increased risk of microvascular compromise?","It has only one anterior ciliary vessel","Other recti have two.",0],["Where do combined III, IV and VI palsies arise?","Cavernous sinus, superior orbital fissure and orbit","They lie close together.",0],["How does a patient with a paralysed muscle position the head to avoid diplopia?","Face turned into the field of action of the paralysed muscle","Diplopia increases in the direction of the paralysed muscle.",0],["Why is the abducens nerve a false localising sign?","Raised ICP readily causes sixth nerve palsy, often bilateral","It is vulnerable crossing the petrous temporal bone.",0],["Which investigations support optic neuritis?","MRI FLAIR, delayed evoked potentials and CSF oligoclonal bands","They support demyelination.",0],["What is the effect of IV methylprednisolone in optic neuritis?","Hastens visual recovery but does not affect final acuity","Based on the Optic Neuritis Treatment Trial.",0],["What happens to the lens during accommodation?","It becomes more convex as zonular fibres relax","The ciliary muscle contracts.",0],["What does a homonymous hemianopia mean?","Loss of the same half of the field in both eyes","It is a postchiasmal defect.",0],["What does the iris dilator muscle do and which system supplies it?","Dilates the pupil via sympathetic innervation","The iris sphincter constricts via parasympathetic fibres.",0],["What are the signs of Horner's syndrome?","Miosis, partial ptosis, anhidrosis and enophthalmos","Heterochromia may occur if congenital.",0],["Which trigeminal sign does the nasociliary nerve involvement predict in herpes zoster?","Hutchinson's sign with ocular involvement","The tip of the nose is involved.",0],["Which tests assess the afferent visual pathway?","Visual acuity, colour vision, visual fields, RAPD and fundoscopy","These are the five assessments.",0],["What does bilateral disc swelling suggest, with preserved optic nerve function?","Raised intracranial pressure (papilloedema)","Causes include idiopathic intracranial hypertension.",0],["Which muscles does the oculomotor nerve supply?","Superior, inferior and medial recti, inferior oblique and levator palpebrae","LR6SO4 mnemonic: the rest are CN III.",0],["How does ptosis size differ between Horner's and a third nerve palsy?","Horner's gives minimal ptosis under 2 mm; third nerve gives over 2 mm","The pupil is small in Horner's and large in third nerve palsy.",0],["Which visual field defect is typical of glaucoma?","Bilateral asymmetrical arcuate pattern","Retinal detachment is unilateral.",0],["What eye movement sign is pathognomonic of demyelinating disease?","Internuclear ophthalmoplegia","It indicates MS.",0],["What type of diplopia occurs in trochlear palsy?","Oblique diplopia worse on downgaze","Examine old photographs.",0],["Which are causes of Horner's syndrome?","Pancoast tumour, carotid dissection and congenital","A pharmacological test locates the lesion.",0],["When do most patients with a third nerve palsy regain function?","By about 3 months","Treat the underlying abnormality.",0],["What are the demographic features of optic neuritis?","Age 20 to 50 years, female to male ratio 3:1","It is associated with MS.",0],["Which parasympathetic functions does the oculomotor nerve control?","Iris sphincter constriction and ciliary muscle accommodation","They run on the outside of the nerve.",0],["Which muscle closes the eyelid and which nerve supplies it?","Orbicularis oculi, facial nerve","The levator is supplied by CN III.",0],["Which lesions of the oculomotor nerve involve the pupil?","Surgical lesions such as trauma and aneurysm","They compress the parasympathetic fibres.",0],["Which test examines the afferent pathway of the optic nerve?","Relative afferent pupillary defect test","It compares one optic nerve response with the other.",0],["An elderly man has painful vesicular rash on the forehead and tip of the nose with red eye. What is the diagnosis and treatment?","Herpes zoster ophthalmicus; aciclovir within 72 hours and ophthalmology review","Hutchinson's sign.",1],["A 28-year-old woman has painful visual loss in one eye, RAPD and red desaturation. What is the probable diagnosis and key risk?","Optic neuritis; risk of multiple sclerosis","MRI and neurology referral.",1],["A woman has unilateral facial weakness including the forehead, dry eye and hyperacusis, with onset 48 hours ago. What is the management?","Bell's palsy; oral steroids and eye protection","Early steroids are used.",1],["A man has miosis, partial ptosis and anhidrosis after a neck injury. What is the diagnosis and a possible cause?","Horner's syndrome from carotid dissection","Pancoast tumour is another cause.",1]]},{"id":"hd","name":"Headaches","cards":[["Which cervical spine referred pain pattern occurs?","Burning occipital pain, worse with sustained flexion, with neck stiffness","Shoulder or arm pain may accompany.",0],["What are the causes of thunderclap headache?","SAH, carotid dissection, CVT, intracranial hypotension, pituitary apoplexy and acute hypertension","Often benign or migrainous.",0],["Which features suggest temporal arteritis?","Age over 60, unilateral burning pain, jaw claudication and visual loss","Limb girdle pain and weakness may occur.",0],["When is migraine prophylaxis appropriate?","When attacks occur more than once per month","Options include tricyclics, valproate and topiramate.",0],["What are the features of a space-occupying lesion headache?","Frontal or occipital dull ache, worse in the morning and on coughing or straining","Under 5% of tumours present with isolated headache.",0],["Which features suggest a tension-type headache?","Tight band or pressure, vertex or occiput, resistant to analgesia","Psychosocial stress is associated.",0],["Which facial pain syndromes are listed with cluster headache?","Trigeminal neuralgia, paroxysmal hemicrania and SUNCT","They are trigeminal autonomic and neuralgic pain.",0],["What treatment is used for benign intracranial hypertension?","Weight loss, lumbar puncture, acetazolamide and shunting","Shunt for refractory cases.",0],["Which drugs are CGRP monoclonal antibodies?","Erenumab, eptinezumab, fremanezumab and galcanezumab","Gepants are receptor antagonists.",0],["How is frontal sinusitis characterised?","Frontal bursting pain, worse in the morning, with nasal blockage and voice change","Progressive over days.",0],["Which drugs can cause headache?","Analgesics, oral contraceptives, nitrates and nifedipine","Anticoagulants may cause haemorrhage.",0],["Which sex and age is typical of cluster headache?","Adult males, much more than females","It is uncommon.",0],["What happens to CGRP during a migraine attack?","It is released from the trigeminovascular system","Injection of CGRP causes migraine headache.",0],["Which features suggest acute glaucoma?","Severe boring pain with nausea, vomiting and visual impairment","Onset over several hours.",0],["Who typically develops benign intracranial hypertension?","Obese women aged 20 to 40","Headache is generalised and worse in the morning.",0],["Which symptom is rare but very specific for temporal arteritis?","Jaw claudication","Visual loss is the feared complication.",0],["Which precipitating factor suggests a CSF volume headache?","Postural change","High or low CSF volume headache.",0],["What caution applies to triptans?","Coronary artery disease","They are vasoconstrictors.",0],["How quickly does a thunderclap headache reach maximum intensity?","Within 3 seconds","It is worst at outset.",0],["What is the prevalence of migraine and tension headache?","250 per 100,000 for each","Cluster is less common.",0],["What proportion of migraine patients have aura?","About 30%","Aura is flashing lights or other focal symptoms.",0],["What is a primary headache?","Headache and associated features in the absence of any exogenous cause","Migraine, tension-type and cluster headache are primary.",0],["What are the characteristics of benign sexual headache?","Dull or explosive, postural; exclude SAH","Propranolol is used.",0],["Which treatment is used for temporal arteritis?","Urgent steroids, prednisone 60 mg/day","Diagnosis by biopsy, ESR and CRP.",0],["What is a secondary headache?","Head pain related to an important underlying cause","It needs investigation.",0],["Which features suggest temporomandibular joint dysfunction?","Unilateral temporal pain worse in the morning, pain on eating","Teeth grinding at night may contribute.",0],["Which hour of the day suggests raised intracranial pressure?","Mornings","Cluster headache wakes the patient at night.",0],["Which associated features accompany migraine?","Nausea, vomiting and photophobia or phonophobia","The cluster features are lacrimation and nasal blockage.",0],["Which headache is the commonest cause of neurology outpatient referral?","Headache","About 40% of people in the UK have headache.",0],["What is the acute treatment of cluster headache?","100% oxygen at 12 L/min, triptan","Steroids may be used.",0],["Which visual features occur in benign intracranial hypertension?","Scotoma and optic oedema","Nausea and vomiting also occur.",0],["Does the brain parenchyma have pain receptors?","No","Pain arises from meninges, arteries, scalp and cranial nerves.",0],["What is a gepant?","A CGRP receptor antagonist","Rimegepant and ubrogepant are examples.",0],["A 68-year-old woman has new unilateral temporal headache, jaw claudication and blurred vision. What should be done immediately?","Urgent high-dose steroids with ESR, CRP and temporal artery biopsy","Prevent blindness.",1],["A man has severe unilateral orbital pain for 45 minutes nightly, with lacrimation and nasal blockage, for three weeks. What is the diagnosis and treatment?","Cluster headache; 100% oxygen and triptan","Verapamil prophylaxis.",1],["An obese 30-year-old woman has morning headache, nausea, transient visual obscurations and bilateral papilloedema. What is the diagnosis and treatment?","Benign intracranial hypertension; weight loss and acetazolamide","LP can relieve pressure.",1],["A man has the worst headache of his life with abrupt onset. CT at 6 hours is normal. What is next?","Lumbar puncture for xanthochromia, or CT/MR angiography","CT sensitivity is 97% at 12 hours.",1],["A woman uses painkillers on 20 days per month for 4 months, with daily headache. What is the diagnosis and treatment?","Medication overuse headache; stop the overused medication abruptly","Allow analgesics twice a week afterwards.",1]]}];
(function(){
var P='bb-fc2-',DAY=864e5;
function g(k,d){try{var v=localStorage.getItem(P+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function s(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}}
function h(str){var x=5381;for(var i=0;i<str.length;i++)x=((x<<5)+x+str.charCodeAt(i))|0;return (x>>>0).toString(36)}
var S=g('state',{}); // key -> {r:'good',due:ts} | {r:'easy'}
var app=document.getElementById('app');
var st={view:'home',deck:null,q:[],flip:false,seen:0,total:0};
function key(d,c){return d.id+':'+h(c[0])}
function sv(){s('state',S)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function stats(d){var e=0,gd=0,due=0,nw=0,now=Date.now(),next=0,xd=0;
 d.cards.forEach(function(c){var x=S[key(d,c)];
  if(x&&x.r==='x')xd++;else if(!x)nw++;else if(x.r==='easy')e++;else if(x.due<=now)due++;else{gd++;if(!next||x.due<next)next=x.due}});
 return {easy:e,good:gd,due:due,nw:nw,next:next,xd:xd,n:d.cards.length-xd}}
function dueList(d){var now=Date.now();var l=[];d.cards.forEach(function(c,j){var x=S[key(d,c)];if(!x||(x.r==='good'&&x.due<=now))l.push(j)});return l}
function when(ts){var m=Math.ceil((ts-Date.now())/36e5);if(m<24)return 'in '+m+' hour'+(m===1?'':'s');var dd=Math.ceil(m/24);return 'in '+dd+' day'+(dd===1?'':'s')}
function home(){
 var tot=0,ez=0,dueAll=0;DECKS.forEach(function(d){var x=stats(d);tot+=x.n;ez+=x.easy;dueAll+=x.due+x.nw});
 var o='<h1>MED 301 Flashcards</h1><p class="sub">'+DECKS.length+' lectures · '+tot+' cards · '+dueAll+' to study now · '+ez+' easy</p>';
 o+='<div class="bar"><button class="btn" id="reset">Reset all progress</button></div><div class="grid">';
 DECKS.forEach(function(d,i){var x=stats(d),nn=x.n||1,p=Math.round(100*x.easy/nn),p2=Math.round(100*(x.easy+x.good)/nn);
  o+='<button class="deck'+(x.n&&x.easy===x.n?' done':'')+'" data-i="'+i+'"><b>'+esc(d.name)+'</b><span>'+(x.due+x.nw)+' to study · '+x.easy+' easy</span><div class="prog"><i class="g2" style="width:'+p2+'%"></i><i style="width:'+p+'%"></i></div></button>'});
 app.innerHTML=o+'</div>';
 app.querySelectorAll('.deck').forEach(function(b){b.onclick=function(){begin(+b.dataset.i)}});
 var r=document.getElementById('reset');r.onclick=function(){if(r.dataset.sure){S={};sv();home()}else{r.dataset.sure=1;r.textContent='Tap again to erase all progress'}};
}
function begin(i){var d=DECKS[i];st.deck=i;st.q=shuf(dueList(d));st.flip=false;st.view='study';draw()}
function endScreen(d){
 var x=stats(d),o='<div class="top"><h2>'+esc(d.name)+'</h2></div><div class="sum">';
 if(!x.n){o+='<b>All cards discarded</b><p class="sub">Nothing left in this lecture.</p><div class="bar" style="justify-content:center"><button class="btn pri" id="rest">Restore '+x.xd+' discarded</button><button class="btn" id="back">All lectures</button></div>'}
 else if(x.easy===x.n){o+='<b>All '+x.n+' cards are easy</b><p class="sub">The easy cards are ready to come back for a full review.</p><div class="bar" style="justify-content:center"><button class="btn pri" id="rev">Review all cards again</button>'+(x.xd?'<button class="btn" id="rest">Restore '+x.xd+' discarded</button>':'')+'<button class="btn" id="back">All lectures</button></div>'}
 else{o+='<b>Session done</b><p class="sub">'+x.easy+' easy · '+x.good+' good'+(x.next?' (next due '+when(x.next)+')':'')+'. Good cards return after two days; easy cards return once every card in the lecture is easy.</p><div class="bar" style="justify-content:center">'+(x.good?'<button class="btn" id="early">Study good cards early</button>':'')+(x.xd?'<button class="btn" id="rest">Restore '+x.xd+' discarded</button>':'')+'<button class="btn" id="back">All lectures</button></div>'}
 app.innerHTML=o+'</div>';
 document.getElementById('back').onclick=function(){st.view='home';home()};
 var r=document.getElementById('rev');if(r)r.onclick=function(){d.cards.forEach(function(c){var y=S[key(d,c)];if(!y||y.r!=='x')delete S[key(d,c)]});sv();begin(st.deck)};

 var e=document.getElementById('early');if(e)e.onclick=function(){st.q=shuf(d.cards.map(function(c,j){return j}).filter(function(j){var y=S[key(d,d.cards[j])];return y&&y.r==='good'}));st.flip=false;draw()};
}
function draw(){

 if(!st.q.length){endScreen(d);return}
 var c=d.cards[st.q[0]];
 var o='<div class="top"><h2>'+esc(d.name)+'</h2><button class="btn" id="back">All lectures</button></div>';
 o+='<div class="meta"><span>'+st.q.length+' left in this session</span>'+(c[3]?'<span class="tag">Clinical case</span>':'')+'</div>';

 if(!st.flip)o+='<div class="q">'+esc(c[0])+'</div>';else o+='<div class="q" style="font-size:15px;color:var(--mut)">'+esc(c[0])+'</div><div class="a">'+esc(c[1])+'</div>'+(c[2]?'<div class="e">'+esc(c[2])+'</div>':'');
 o+='</button><div class="hint">'+(st.flip?'':'Tap the card or press space to reveal')+'</div>';
 if(st.flip)o+='<div class="acts3"><button class="btn no" id="ag">Again<small>later this session</small></button><button class="btn mid" id="gd">Good<small>in 2 days</small></button><button class="btn yes" id="ez">Easy<small>when all are easy</small></button></div>';
 o+='<div class="disc"><button class="link" id="dc">Discard this card</button></div>';
 app.innerHTML=o;
 document.getElementById('card').onclick=function(){st.flip=!st.flip;draw()};
 document.getElementById('back').onclick=function(){st.view='home';home()};
 var k=key(d,c);
 document.getElementById('dc').onclick=function(){st.q.shift();S[k]={r:'x'};sv();st.flip=false;draw()};
 if(st.flip){
  document.getElementById('ag').onclick=function(){var j=st.q.shift();st.q.push(j);delete S[k];sv();st.flip=false;draw()};
  document.getElementById('gd').onclick=function(){st.q.shift();S[k]={r:'good',due:Date.now()+2*DAY};sv();st.flip=false;draw()};
  document.getElementById('ez').onclick=function(){st.q.shift();S[k]={r:'easy'};sv();st.flip=false;draw()};
 }
}
document.addEventListener('keydown',function(e){if(st.view!=='study')return;var c=document.getElementById('card');if(!c)return;
 if(e.key===' '||e.key==='Enter'){e.preventDefault();c.click()}
 else if(st.flip&&e.key==='1')document.getElementById('ag').click();
 else if(st.flip&&e.key==='2')document.getElementById('gd').click();
 else if(st.flip&&e.key==='3')document.getElementById('ez').click()});
home();
})();
</script>
