{"t":"sl1","q":"A shift worker is most impaired at which part of the circadian cycle?","a":["Around 04:30 when core temperature is lowest","Around 14:30 when reaction time is fastest","Around 19:00 when body temperature peaks","Around 10:00 when coordination is best"],"e":"Body temperature is lowest around 04:30 and alertness is poor."},
{"t":"sl1","q":"Which statement about the ascending reticular activating system is correct?","a":["Brainstem reticular projections via thalamus and hypothalamus drive cortical arousal","Cerebellar projections via the thalamus drive cortical arousal","Brainstem projections via the spinal cord drive muscle tone and arousal","Hypothalamic projections via the cerebellum drive circadian arousal"],"e":"The ARAS maintains wakefulness through thalamic and hypothalamic relays to the cortex."},
{"t":"sl2","q":"A 54-year-old obese man snores, has witnessed apnoeas and sleepiness while driving. Which assessment pathway is appropriate?","a":["Clinical assessment, then home sleep apnoea test or PSG","Clinical assessment, then MSLT to confirm daytime sleepiness","CPAP trial without any objective test, titrated to symptoms","Overnight EEG with neurology referral, then CPAP"],"e":"OSA is assessed by symptoms and comorbidities followed by objective testing, with interpretation in context."},
{"t":"sl2","q":"A 19-year-old has excessive daytime sleepiness, sudden weakness with laughter and sleep paralysis. Tests and treatment?","a":["Overnight PSG then MSLT; modafinil and cataplexy treatment","Overnight PSG then MSLT; CPAP and antiepileptic drugs","Home sleep apnoea test; modafinil and sodium oxybate","EEG and CT head; antiepileptic drugs and modafinil"],"e":"Narcolepsy is assessed with PSG and MSLT; modafinil and cataplexy treatment are used."},
{"t":"sl2","q":"A 66-year-old shouts and punches during vivid dreams and has hurt his wife. Video-PSG shows REM without atonia. Which step matters most beyond safety?","a":["Specialist follow-up for later neurodegenerative disease","Reassurance that it is benign, with bedroom safety only","CPAP trial for suspected obstructive sleep apnoea","Referral for sleep restriction therapy and CBT-I"],"e":"RBD needs bedroom safety, review of medication and neurological follow-up."},
{"t":"sl2","q":"A woman has low mood, hypersomnia and increased appetite every winter, recovering in spring. What must be assessed before diagnosing seasonal affective disorder?","a":["Severity, other causes and history of mania or hypomania","Light exposure and sleep latency only","Thyroid function and vitamin D only","Severity and light exposure, with no need to ask about mania"],"e":"The lecture lists severity, other causes and bipolar history."},
{"t":"an","q":"A 27-year-old woman has sudden palpitations, chest tightness, unreality and fear of dying peaking within 10 minutes, with normal ECG. She now avoids the underground. Diagnosis and treatment?","a":["Panic disorder with agoraphobia; CBT with an SSRI","Panic disorder with agoraphobia; long-term benzodiazepine","Generalised anxiety disorder; CBT with an SSRI","Social phobia; CBT with propranolol"],"e":"Recurrent panic attacks with avoidance are treated with CBT and an SSRI; combined therapy is more effective."},
{"t":"ps","q":"On first interview a distressed patient refuses to discuss childhood experiences. Best action per the lecture?","a":["Respect the wish at first, build alliance, later ask directly about abuse","Insist now, since a full trauma history is needed on the first visit","Skip the topic permanently, since the patient has refused","Ask a relative for the history instead, then confront the patient"],"e":"Respect avoidance on first encounter, but be direct about sensitive material when asking."},
{"t":"ps","q":"A trainee says depression is only low serotonin and social stressors do not matter. Which response fits the lecture?","a":["The biomedical model is reductionistic; the BPS model considers biological, psychological and social factors together","The BPS model is reductionistic; the biomedical model considers biological, psychological and social factors together","Both models treat mind and body as inseparable, one at the micro level and the other at the macro level","Both models consider multiple causal factors, but only the biomedical one integrates the social level"],"e":"BPS: multiple causal factors, macro and micro levels, mind and body inseparable."},
{"t":"sc","q":"Alex, 21, has withdrawn socially over 8 months. For 6 weeks he has heard two voices commenting on his actions and believes neighbours monitor him. He uses cannabis most weekends and sleeps poorly. What is the most defensible first step?","a":["Take a timeline of symptoms, mood, substances and sleep, and ask about safety and command content","Diagnose schizophrenia now, because voices plus a fixed belief for 6 weeks are sufficient","Attribute everything to cannabis and advise stopping it before any further assessment","Order an MRI and EEG first, since a scan can confirm or exclude schizophrenia"],"e":"Psychosis is a syndrome, not a diagnosis: the cause comes from a longitudinal history, examination and course, with direct risk questions; no scan or blood test confirms schizophrenia."},
{"t":"sc","q":"A 24-year-old has heard voices and held persecutory beliefs for 3 weeks, beginning the day after a binge of amphetamines, and they fade as he abstains. Which statement is most accurate?","a":["A substance-induced psychotic disorder must be considered before schizophrenia, whose DSM duration is not met","Schizophrenia is established, since DSM needs 1 month of active symptoms, and amphetamine is incidental","Schizoaffective disorder is likely, because symptoms resolved quickly with abstinence","A brief psychotic disorder is excluded, because a substance was used"],"e":"Onset after exposure and resolution with abstinence suggest a substance effect; DSM-5-TR also needs continuous signs for at least 6 months."},
{"t":"sc","q":"A 19-year-old has heard voices for 2 months. Over the same period she has had a full major depressive episode and a 2-week period of elevated mood. Psychotic symptoms occurred only during mood episodes. What is the most likely classification?","a":["Mood disorder with psychotic features","Schizoaffective disorder, since voices persisted for 2 months","Schizophrenia, since voices lasted over 1 month","Delusional disorder with mood symptoms"],"e":"If psychosis occurs only during mood episodes it is a mood disorder with psychotic features; schizoaffective disorder needs psychosis beyond mood episodes."},
{"t":"sc","q":"A 22-year-old has withdrawn, shows little facial expression, speaks very little and has no interest in his studies, yet has no hallucinations or delusions. He is also tearful and sleeping 12 hours a day. Before calling the symptoms primary negative symptoms, what should be assessed?","a":["Depression, medication effects, anxiety, substance use and social deprivation","Depression and medication effects only, since social deprivation is not relevant","Family history of schizophrenia, cognitive testing and duration of avolition","Anxiety and substance use only, since medication effects do not mimic negative symptoms"],"e":"The lecture advises excluding secondary causes of negative symptoms such as depression, medication effects and deprivation first."},
{"t":"sc","q":"A first-episode psychosis patient is agreed to need treatment. Which combination does NICE recommend as the lecture states?","a":["Antipsychotic medication together with individual CBT and family intervention","Antipsychotic medication together with individual CBT, with family intervention reserved for relapse","Antipsychotic medication alone for the first year, then CBT and family intervention","Individual CBT and family intervention, with medication offered only if both fail"],"e":"For first-episode psychosis NICE recommends antipsychotic plus individual CBT and family intervention."},
{"t":"sc","q":"A man has had two adequate trials of different antipsychotics, including one non-clozapine second-generation drug, with adherence confirmed and cannabis stopped, but persistent positive symptoms. What does NICE advise?","a":["Offer clozapine with blood monitoring and metabolic, cardiac and gastrointestinal review","Add a third antipsychotic of a different class, with blood monitoring","Switch to a long-acting injectable first-generation drug and review in a year","Offer clozapine only after a third antipsychotic trial of 12 weeks"],"e":"Clozapine is offered after inadequate response to at least two adequate trials, including one non-clozapine second-generation drug."},
{"t":"sc","q":"A 30-year-old on antipsychotic treatment has gained 8 kg in 3 months, has raised fasting glucose and new galactorrhoea. Which monitoring items from the lecture explain the findings?","a":["Weight and waist, HbA1c or glucose, lipids and prolactin","Weight and waist, HbA1c or glucose and lipids, but not prolactin","Weight, ECG and prolactin, since glucose is unaffected","Prolactin and HbA1c only, since weight and waist are behavioural"],"e":"Baseline and follow-up monitoring covers metabolic measures and prolactin-related effects, as well as movement symptoms and ECG when indicated."},
{"t":"sc","q":"Which family-related statement fits the lecture on expressed emotion?","a":["High criticism, hostility or over-involvement is associated with relapse risk, but families do not cause schizophrenia","High criticism, hostility or over-involvement is associated with relapse, and the lecture holds families responsible for onset","Low criticism and warmth are associated with relapse, but families do not cause schizophrenia","High expressed emotion predicts relapse only in depression, not in schizophrenia"],"e":"The lecture links high expressed emotion with relapse risk while stating families do not cause schizophrenia."},
{"t":"sc","q":"A patient tells you his thoughts are being inserted by others and that his own inner speech feels external. Which model best offers a framework for this?","a":["Frith's self-monitoring model: a mismatch in monitoring makes internal events feel external","Hemsley's model: reduced context makes events seem salient, so thoughts feel inserted","Frith's model: a mismatch in monitoring of external events makes them feel internal","Threat-maintenance model: avoidance of voices maintains the belief"],"e":"Self-monitoring failure may feel like voices, thought insertion or control; it is one hypothesis, not a complete theory."},
{"t":"sc","q":"A patient with schizophrenia stops her tablets because of adverse effects and stigma and fears relapse. Which approach fits the lecture's shared decision principles?","a":["Discuss concerns without blame, consider options such as a long-acting injectable, and agree an early-warning plan","Insist on continuing the current dose, but explain adverse effects and offer a leaflet","Discharge her from follow-up until she agrees, but keep the early-warning plan","Discuss concerns without blame, stop medication until relapse and then agree an early-warning plan"],"e":"The lecture advises non-blaming discussion, possible injectable preparation and written early-warning and contact plans."},
{"t":"af","q":"A 34-year-old has 3 weeks of low mood, poor sleep, guilt and poor concentration. Which minimum criteria must be met for a major depressive episode?","a":["At least 5 of 9 symptoms, including low mood or loss of interest, most of the day nearly every day for at least 2 weeks","At least 5 of 9 symptoms, including low mood or loss of interest, most of the day nearly every day for at least 4 weeks","At least 4 of 9 symptoms, including low mood or loss of interest, most days for at least 2 weeks","At least 5 of 9 symptoms, which must include insomnia and guilt, for at least 2 weeks"],"e":"DSM requires 5 of 9 symptoms with one being low mood or anhedonia, present nearly daily for at least 2 weeks with significant impairment."},
{"t":"af","q":"A woman was widowed 6 weeks ago. She cries in waves when reminded of her husband, preserves her self-esteem and sometimes wishes she could join him. Which feature best favours grief over a major depressive episode?","a":["Emotions come in waves linked to reminders, with self-esteem preserved and thoughts of death centred on reunion","Pervasive low mood with loss of pleasure, worthlessness and thoughts of death centred on punishment","Emotions come in waves linked to reminders, but with self-criticism and thoughts of death centred on worthlessness","Symptoms persisting beyond 2 months with marked functional impairment and preserved self-esteem"],"e":"The lecture's table: grief shows waves, preserved self-esteem and reunion thoughts; depression is more pervasive with worthlessness and hopelessness."},
{"t":"af","q":"A 40-year-old man has had depressed mood for 3 years with no symptom-free interval longer than 2 months, low energy and poor self-esteem, and he has never had a manic episode. Diagnosis?","a":["Persistent depressive disorder (dysthymia)","Cyclothymic disorder","Major depressive disorder, single episode","Adjustment disorder with depressed mood"],"e":"DSM-5-TR needs at least 2 years in adults with no symptom-free interval longer than 2 months."},
{"t":"af","q":"A 29-year-old has not slept for 4 nights but feels energised, talks fast, spends heavily and believes he has a special mission. He has been hospitalised. What is the diagnosis and key distinction?","a":["Mania (bipolar I), because there is marked impairment, hospitalisation or psychosis","Hypomania (bipolar II), because he needed hospitalisation only after the fourth night","Mania (bipolar I), because mood is elevated for at least 4 days regardless of impairment","Mixed episode of bipolar II, because sleep was reduced"],"e":"Marked impairment, hospitalisation or psychosis indicates mania rather than hypomania; a single manic episode supports bipolar I."},
{"t":"af","q":"A 26-year-old has had two major depressive episodes and one 5-day period of elevated mood with increased energy that others noticed, without marked impairment or hospitalisation. Which diagnosis?","a":["Bipolar II disorder","Bipolar I disorder","Cyclothymic disorder","Major depressive disorder, recurrent"],"e":"Hypomania (at least 4 days, no marked impairment) plus a major depressive episode with no mania is bipolar II."},
{"t":"af","q":"A depressed 22-year-old becomes agitated, sleepless and energised 10 days after starting an SSRI. What does the lecture advise if mania develops during antidepressant monotherapy?","a":["Consider stopping the antidepressant and offering an antipsychotic, with urgent specialist review","Continue the antidepressant at a lower dose and add a benzodiazepine, with review in 2 weeks","Increase the antidepressant dose and add lithium, with review in a month","Stop the antidepressant and start a benzodiazepine alone, with outpatient review"],"e":"NICE advises considering stopping the antidepressant and offering an antipsychotic if mania develops during monotherapy."},
{"t":"af","q":"A woman starting long-term lithium develops vomiting, diarrhoea, a coarse tremor and unsteadiness after a gastroenteritis. What is the best interpretation?","a":["Possible lithium toxicity needing urgent assessment, since dehydration raises levels","Expected early side effects of lithium needing reassurance, since tremor settles over time","Discontinuation symptoms from a missed dose needing the dose restarted","Relapse of mania needing a higher dose of lithium"],"e":"Dehydration and some medicines raise lithium levels; vomiting, diarrhoea, coarse tremor and unsteadiness suggest toxicity."},
{"t":"af","q":"A 45-year-old has moderate-severe depression. He prefers not to take tablets. Which statement matches the lecture on treatment choice?","a":["Discuss benefits and harms and reach a shared decision between psychological therapy, antidepressant or combination","Antidepressants are mandatory in moderate-severe depression, whatever the patient prefers","Psychological therapy is contraindicated in moderate-severe depression, so the choice rests with the clinician","Discuss benefits and harms, then decide on antidepressant alone, since he declined tablets"],"e":"For more severe depression options include psychological therapy, antidepressant or a combination chosen through shared decision."},
{"t":"af","q":"A patient with depression says: 'My boss criticised one report, so I am useless and will never succeed.' He avoids colleagues and falls behind. Which CBT step comes first in the lecture's sequence?","a":["Notice the thought, then examine the evidence and test a balanced response with a behavioural experiment","Challenge core beliefs first, then notice the thought and test it with a behavioural experiment","Prescribe behavioural activation and avoid discussing the thought until mood lifts","Notice the thought, then challenge the core belief directly without testing the evidence"],"e":"The sequence: notice the thought, examine it, test a response, then consolidate and address core beliefs."},
{"t":"af","q":"A patient stops sertraline abruptly and within days has dizziness, nausea, anxiety and electric-shock sensations. Which statement best fits the lecture?","a":["Discontinuation symptoms that may be mistaken for relapse; plan a gradual taper","Relapse of depression needing a dose increase and an added second drug","Serotonin syndrome from a missed dose needing urgent admission","Mania induced by withdrawal needing an antipsychotic"],"e":"Abrupt stopping can cause dizziness, flu-like symptoms, nausea, anxiety, insomnia and sensory symptoms, so taper gradually."},
{"t":"an","q":"A 31-year-old woman has repeated sudden episodes of palpitations, sweating and fear of dying that peak within 10 minutes with no trigger. Between attacks she is well but fears the next one and avoids crowded trains. Which diagnosis?","a":["Panic disorder with agoraphobia","Generalised anxiety disorder","Social phobia","Specific phobia"],"e":"Recurrent unexpected attacks peaking within 10 minutes with anticipatory fear and avoidance indicate panic disorder with agoraphobia."},
{"t":"an","q":"A 25-year-old has had one panic attack after exams with no further attacks, anticipatory anxiety or avoidance. Which statement is accurate?","a":["A panic attack alone is not a psychiatric disorder; about 15% of people have infrequent attacks without a syndrome","A single attack establishes panic disorder, since it was unexpected and intense","Panic attacks occur only in panic disorder and never in healthy people","A panic attack after exams is a psychiatric disorder if it lasts more than 10 minutes"],"e":"Panic attacks may occur infrequently without a clinical syndrome and occur in many other disorders."},
{"t":"an","q":"A 28-year-old fears giving presentations because others will see him trembling and judge him; he recognises the fear is excessive and avoids all talks. Which disorder?","a":["Social phobia (social anxiety disorder)","Agoraphobia, since he avoids situations where escape is hard","Specific phobia of public speaking, since the fear is circumscribed","Generalised anxiety disorder with performance worries"],"e":"Marked fear of social or performance situations where scrutiny is possible, recognised as excessive and avoided, indicates social phobia."},
{"t":"an","q":"A 38-year-old has felt persistent worry about work, health and finances for 8 months, with tension and poor sleep, and no discrete panic attacks. She has also been drinking more coffee. What is the key initial step per the lecture?","a":["Exclude substance and organic causes and treat comorbidity before diagnosing GAD, which is a diagnosis of exclusion","Diagnose GAD at once and start an SSRI, treating caffeine as incidental","Diagnose GAD at once and start a benzodiazepine for two weeks","Exclude substance and organic causes, then diagnose GAD only if panic attacks appear"],"e":"GAD is largely a diagnosis of exclusion; caffeine, alcohol, stimulants and depression are on the differential."},
{"t":"an","q":"A 33-year-old survived a house fire 3 months ago. He has nightmares, avoids the street, feels numb and detached, and jumps at loud noises. Which symptom clusters are described?","a":["Re-experiencing, avoidance and numbing, and autonomic arousal","Obsessions, compulsions and ritual relief, with autonomic arousal","Fear of open spaces, panic and avoidance, with numbing","Free-floating worry, muscle tension and sleep disturbance"],"e":"PTSD follows a life-threatening event with intrusive recollections or flashbacks, avoidance and numbing, and hyperarousal."},
{"t":"an","q":"Which statement about OCD is correct according to the lecture?","a":["Obsessions are intrusive, unwelcome (egodystonic) and unsuccessfully resisted, while compulsions are excessive neutralising acts","Obsessions are intrusive, unwelcome (egodystonic) and easily dismissed, while compulsions are always visible acts","Obsessions are intrusive, unwelcome and unsuccessfully resisted, while compulsions are always pleasurable","Obsessions are excessive worries about real-life problems, while compulsions are visible neutralising acts"],"e":"The lecture defines obsessions as egodystonic intrusive thoughts and compulsions as repetitive neutralising behaviours or mental acts; they are not just excessive worry about real problems."},
{"t":"an","q":"A woman checks the stove 20 times, is distressed by the thought of causing a fire, and spends more than an hour daily on checking. What drives the ritual?","a":["Anxiety from an obsession is temporarily relieved by checking, which reinforces it","A pleasurable reward from the checking itself, which reinforces it","Anxiety from the obsession is relieved by checking, which weakens it over time","A hippocampal panic circuit triggered by the smell of gas"],"e":"The OCD cycle is obsession, anxiety, compulsion, relief."},
{"t":"an","q":"A patient with anxiety disorders is on a stepped-care pathway. Which statement about NICE findings in the lecture is correct?","a":["Psychological therapy is more effective than drugs and should be used first where possible; most drug evidence supports SSRIs","Drug therapy is more effective than psychological therapy and should be used first where possible","Psychological therapy is more effective than drugs, and benzodiazepines are the best-supported drugs","Psychological therapy is more effective than drugs, and one treatment works for all anxiety disorders"],"e":"The lecture says NICE recommends psychological therapy first line, with pharmacological therapy also effective, most evidence for SSRIs."},
{"t":"an","q":"A student with fear of flying learns to approach feared situations gradually in a structured way and observes what happens. Which principle is being used?","a":["Graded exposure in CBT, which counters escape and avoidance that reward anxiety by reducing it briefly","Systematic desensitisation in psychoanalysis, which counters escape by reducing anxiety slowly","Medication titration to blunt arousal during graded approach","Graded exposure in CBT, which counters avoidance by reinforcing it with relaxation alone"],"e":"CBT uses gradual exposure so patients learn from acting differently and observing outcomes."},
{"t":"hv","q":"A 22-year-old sex worker asks whether she should use barrier protection during oral sex with clients. What does the lecture advise and why?","a":["Yes, because HIV can be spread by oral-genital contact when secondary lesions such as herpes or syphilis are present","No, because HIV transmission by oral-genital contact is negligible even when lesions are present","Yes, but only when she has visible genital herpes","Yes, but only with male clients, because HIV passes only in semen"],"e":"The lecture says barrier use is recommended; most people with HIV have secondary lesions such as herpes and syphilis."},
{"t":"hv","q":"In the US, who is more likely to engage in anal intercourse, in absolute numbers, and why?","a":["Heterosexuals, since there are many more heterosexuals than homosexuals","Homosexual men, since anal sex is a defining behaviour for them in absolute numbers","Both groups equally, since the lecture gives the same proportion for each","Bisexual people, since they are the largest group engaging in anal sex"],"e":"The lecture's point: the question must be read exactly, and absolute numbers favour heterosexuals."},
{"t":"hv","q":"A single heterosexual contact with a man who is not in any risk group versus one with a man in a high-risk group. Which risks does the lecture quote?","a":["About 1 in 5 million versus about 1 in 20 to 1 in 2","About 1 in 500 versus 1 in 20 to 1 in 2","About 1 in 5 million versus 1 in 200 to 1 in 20","About 1 in 50 million versus 1 in 20 to 1 in 2"],"e":"The slide quotes 1 in 5 million for a non-risk-group man and 1 in 20 to 1 in 2 for a high-risk man."},
{"t":"hv","q":"A healthcare worker is stuck with a needle used on an HIV-positive patient. What risk of infection does the lecture give for a needle-stick?","a":["About 1 in 250 (range 1 in 100 to 1 in 1,000)","About 1 in 25 (range 1 in 10 to 1 in 100)","About 1 in 2500 (range 1 in 1,000 to 1 in 10,000)","About 1 in 5 million (range 1 in 1 million to 1 in 10 million)"],"e":"Needle-stick with HIV-positive blood is 1 in 100 to 1 in 1,000; transfusion seroconversion is about 2 in 3."},
{"t":"hv","q":"Which factor increases a man's risk of acquiring HIV in heterosexual intercourse according to the lecture?","a":["Being uncircumcised (about 8 times higher) or contact during menses","Being circumcised (about 8 times lower) or contact during menses","Having a female partner with a high CD4 count or contact during ovulation","Being uncircumcised (about 2 times higher) or contact only during pregnancy"],"e":"The lecture states uncircumcised men are 8 times more likely to acquire HIV; risk is greater during menses."},
{"t":"hv","q":"An HIV-positive mother gives birth and breastfeeds. Which statements are correct per the lecture?","a":["All infants test positive at birth, about 20% remain positive at 1 year, and breastfeeding increases transmission (about 50%)","About 20% test positive at birth, all are positive at 1 year, and breastfeeding increases transmission (about 50%)","All infants test positive at birth, about 20% remain positive at 1 year, and breastfeeding has no effect","All infants test positive at birth, about 50% remain positive at 1 year, and breastfeeding reduces transmission"],"e":"The slide: 100% test positive at birth because of maternal antibodies, about 20% remain positive after a year, breastfeeding raises rate."},
{"t":"hv","q":"A prevention programme wants to cut mother-to-child transmission as far as possible. Which regimen gives the lowest rate in the lecture?","a":["AZT plus nevirapine (about 2%)","AZT alone (about 10%)","AZT plus caesarean (about 5%)","Nevirapine alone (about 10%)"],"e":"AZT halves risk to about 10%, with C-section 5%, nevirapine 10% and AZT plus nevirapine about 2%."},
{"t":"hv","q":"Late HIV diagnosis is defined in the lecture as what?","a":["CD4 count below 350 cells/mm3 within 3 months of diagnosis","CD4 count below 200 cells/mm3 within 3 months of diagnosis","CD4 count below 350 cells/mm3 within 12 months of diagnosis","CD4 count below 500 cells/mm3 within 3 months of diagnosis"],"e":"Late diagnosis is CD4 <350 within 3 months, and those people have been undiagnosed for at least 3 years."},
{"t":"hv","q":"In 2017 UNAIDS data, which group accounted for the largest share of new HIV infections?","a":["The rest of the population (52%)","Gay men and other MSM (18%)","Clients of sex workers (18%)","People who inject drugs (8%)"],"e":"The pie chart: 52% rest of population, 18% MSM, 18% clients and partners, 8% PWID, 3% sex workers, 1% transgender women."},
{"t":"hv","q":"Why has AIDS fallen from first to fifth leading cause of death at ages 25-44 in the US, according to the lecture?","a":["Better treatments reduce death, not the number of cases","There are fewer cases of AIDS because of a successful vaccine","A cure has been found for most patients in the United States","There are fewer infections because of a fall in the number of tests"],"e":"The lecture states cases have not fallen; people simply do not die as soon."},
{"t":"sx","q":"A 58-year-old man on a beta blocker and amitriptyline cannot achieve an erection. What should be reviewed first?","a":["His medication, since beta blockers and tricyclics cause erectile dysfunction","His marital history first, since beta blockers and tricyclics rarely cause erectile dysfunction","A neurological work-up first, including spinal MRI","Testosterone injections as a trial before any review"],"e":"The lecture says to check medication before diagnosing a sexual dysfunction."},
{"t":"sx","q":"A 35-year-old woman on sertraline can become aroused and lubricate but cannot reach orgasm. Which effect is described?","a":["SSRI inhibition of orgasm","Trazodone priapism","Neuroleptic erectile dysfunction","Dopamine agonist enhancement of libido"],"e":"SSRIs may inhibit orgasm in men and women while arousal is preserved."},
{"t":"sx","q":"A 63-year-old smoker with diabetes has lost erections. What should be checked before considering neurological causes?","a":["Secondary causes such as alcohol, smoking, diabetes and marital conflict","Genital anatomy and a testosterone level only","Secondary causes such as alcohol, smoking and diabetes, but not marital conflict","A spinal MRI, then secondary causes"],"e":"The lecture advises checking secondary causes first; smokers are 50% more likely to have erectile disorder."},
{"t":"sx","q":"To decide whether a man's erectile problem is physiological or psychological, which test is suggested?","a":["Postage stamp test or monitoring REM-sleep erections","Penile biopsy or monitoring of REM-sleep erections","Postage stamp test or serum prolactin","Postage stamp test or nerve conduction studies of the pudendal nerve"],"e":"If he has nocturnal erections the cause is likely psychological."},
{"t":"sx","q":"A man can obtain an erection and have intercourse, and he orgasms, but the ejaculate flows into the bladder. Which disorder?","a":["Retrograde ejaculation","Retarded ejaculation","Premature ejaculation","Erectile disorder"],"e":"In retarded ejaculation there is no release; in retrograde the ejaculate goes backwards into the bladder."},
{"t":"sx","q":"A 28-year-old man ejaculates before or immediately on penetration. His first sexual experiences were hurried, in a car. What explanation does the lecture give, and which treatments?","a":["Conditioned response learned in contexts demanding quick orgasm; start-stop, squeeze technique or SSRIs","Conditioned response learned in contexts demanding quick orgasm; start-stop, squeeze technique, but SSRIs are contraindicated","Anatomical defect of the frenulum needing surgery or SSRIs","Hormonal failure treated with testosterone or the squeeze technique"],"e":"Sexual responses are conditioned, and the lecture lists start-stop, squeeze and SSRIs."},
{"t":"sx","q":"A woman has persistent involuntary spasm of vaginal muscles preventing penile insertion, and has not been abused. Which disorder and treatment?","a":["Vaginismus; progressive relaxation and Hegar dilators","Vaginismus; start-stop technique and Hegar dilators","Dyspareunia; progressive relaxation and Hegar dilators","Sexual aversion; progressive relaxation and antidepressants"],"e":"Vaginismus prevents insertion; treatment is relaxation techniques and Hegar dilators."},
{"t":"sx","q":"A 68-year-old man has survived a massive MI and asks when he can resume sex. What is the answer favoured by the lecture?","a":["Whenever he feels comfortable or when a stress test says it is fine, such as climbing a flight of stairs without breathlessness","Whenever he feels comfortable, or when a stress test is fine, but not before six weeks have passed since the infarct","Exactly six weeks after the infarct, whatever the stress test shows, followed by gradual resumption","After three months of abstinence, once he can climb a flight of stairs without breathlessness"],"e":"Giving a fixed time frame backfires because patients follow it literally."},
{"t":"sx","q":"The same couple asks which position puts least strain on his heart. What does the lecture say?","a":["Man lying on his back with the woman on top; whoever has had the heart attack takes the bottom position","Man sitting with the woman on his lap, which is the least strenuous position for him","Man lying on his back with the woman on top; the patient takes the top position","Man on top supported by his arms, with the woman lying flat"],"e":"The lecture says man flat on his back and woman on top is best, and the person who had the heart attack gets to be at the bottom."},
{"t":"ps","q":"A student says the term 'biopsychosocial' simply means adding therapy to medication. How do biomedical and biopsychosocial models differ in the lecture's table?","a":["Biomedical: reductionistic with a single causal factor and mind-body dualism; BPS: multiple causes, macro and micro level, mind and body inseparable","Biomedical: multiple causes with mind-body dualism at the micro level; BPS: reductionistic with a single causal factor","Biomedical: reductionistic with a single causal factor and mind-body dualism; BPS: multiple causes, macro level only, with mind and body kept apart","Both models include macro and micro levels and multiple causes, but only the biomedical one treats mind and body as inseparable"],"e":"The lecture compares them across reductionism, causal factors, dualism and emphasis on health."},
{"t":"ps","q":"A 19-year-old's history lists a parent with depression, poor coping skills, bullying at school and a late-diagnosed thyroid condition. Which grouping into the biopsychosocial model is correct?","a":["Parent's depression and thyroid biological, coping skills psychological, bullying social","Parent's depression social, coping skills psychological, bullying social, thyroid biological","Parent's depression biological, thyroid psychological, coping skills social, bullying social","Parent's depression and thyroid biological, coping skills social, bullying psychological"],"e":"Genetic vulnerability and physical health are biological, coping skills psychological, peers and family circumstances social."},
{"t":"ps","q":"In a clinical interview, an anxious patient is offered a chair, introduced to the doctor and asked to tell their story. Which interview step is this?","a":["Therapeutic alliance","History","Mental status exam","Formulation"],"e":"Step A: introduce yourself, comfortable environment, invite narrative, follow the patient's lead."},
{"t":"ps","q":"Which of the following belongs in the history of present illness rather than past psychiatric history?","a":["Why the patient came now, support system, vegetative and psychotic symptoms, functioning when well and secondary gain","Number of previous admissions and ECT history, why the patient came now, and support system","Self-harm and suicide attempts previously, functioning when well, and secondary gain","Previous medication trials and responses, vegetative and psychotic symptoms, and the support system"],"e":"HPI covers the current episode; past psychiatric history covers admissions, providers, self-harm, medication trials and ECT."},
{"t":"ps","q":"A patient's relatives have depression and a cousin attempted suicide. Which section of the history records this and what should also be asked?","a":["Family history; types of treatment, responses and ECT in relatives","Family history; types of treatment in relatives, but ECT is asked only in the past psychiatric history","Past psychiatric history; admissions and ECT of the patient","Social history; religious beliefs and relationships of relatives"],"e":"Family history includes psychiatric illness, suicide attempts, violence and treatments including ECT."},
{"t":"ps","q":"A doctor wants to know the patient's birthplace, early caregivers, education, employment, marital status, religion, forensic history and weapon ownership. Which part of the history?","a":["Extended social history","History of present illness","Past psychiatric history","Mental status exam"],"e":"These items are listed under extended social history, including abuse and weapons ownership."},
{"t":"ps","q":"A patient is asked about alcohol, drugs, tobacco, caffeine, over-the-counter and herbal medicines, blackouts and rehabs. Which history is this?","a":["History of substance use","Past medical history","Family history","Developmental history"],"e":"The substance history screens intake, intoxication, blackouts, withdrawal, problematic drinking and rehabs."},
{"t":"ps","q":"Two classification systems are used for diagnosis. Which pairing is correct as written in the lecture?","a":["DSM-5 by the American Psychiatric Association and ICD-10 by the World Health Organization","DSM-5 by the American Psychiatric Association and ICD-10 by the World Health Organization, both hierarchical","DSM-10 by the American Psychiatric Association and ICD-5 by the World Health Organization","DSM-5 by the World Health Organization and ICD-10 by the American Psychiatric Association"],"e":"The slides name DSM-5 (APA) and ICD-10 (WHO)."},
{"t":"sl1","q":"A junior doctor finishes a night shift at 08:00, feels exhausted but wakes after 4 hours of daytime sleep. Which explanation best uses the two-process model?","a":["Homeostatic sleep pressure is high, but circadian wake promotion in the daytime opposes sleep continuity","Sleep pressure is low after the night shift, so daytime sleep is short because of circadian wake promotion","Homeostatic sleep pressure is low, and the circadian rhythm opposes sleep because melatonin is high in light","Sleep pressure is high and circadian drive is absent in the morning, so sleep is short"],"e":"Process S builds with wakefulness; Process C varies with biological time, so tiredness and ability to sleep can come apart."},
{"t":"sl1","q":"A patient takes strong coffee in the evening and cannot sleep despite exhaustion. Which pair matches the teaching table?","a":["Caffeine blocks adenosine receptors, and adenosine contributes to homeostatic sleep pressure","Caffeine raises melatonin, and melatonin signals biological night","Caffeine blocks melatonin, and adenosine signals biological night","Caffeine raises adenosine, and adenosine is a hormone from the pineal gland"],"e":"Melatonin signals biological night, adenosine builds sleep pressure and caffeine blocks adenosine receptors."},
{"t":"sl1","q":"Which structure acts as the master circadian pacemaker and how does light affect melatonin?","a":["Suprachiasmatic nucleus; light suppresses and darkness increases pineal melatonin","Pineal gland; light suppresses and darkness increases melatonin","Suprachiasmatic nucleus; light increases and darkness suppresses pineal melatonin","Suprachiasmatic nucleus; light suppresses melatonin in the thalamus"],"e":"Retinal signals entrain the SCN, which regulates pineal melatonin secretion."},
{"t":"sl1","q":"A polysomnogram of the first third of the night shows high-amplitude slow waves, and the patient is hard to rouse. Which feature and clinical link?","a":["N3; high arousal threshold, sleep inertia and NREM parasomnias","N2; spindles and K-complexes, with a high arousal threshold and sleep inertia","N3; low arousal threshold, with sleep inertia and REM parasomnias","REM; high arousal threshold, with sleep inertia and NREM parasomnias"],"e":"N3 is concentrated early in the night, with high arousal threshold, sleep inertia and NREM parasomnias."},
{"t":"sl1","q":"In which stage is there mixed-frequency low-amplitude EEG, rapid eye movements and marked loss of muscle tone?","a":["REM sleep","N1 sleep","N2 sleep","N3 sleep"],"e":"REM: activated EEG with atonia, variable breathing and heart rate, and vivid dreams."},
{"t":"sl1","q":"An intern works 24 hours without sleep. Which statement matches the evidence cited in the lecture?","a":["About 17 hours awake impairs performance like a blood alcohol level of 0.05%, and extended shifts were linked to more serious medical errors","About 24 hours awake impairs performance like a blood alcohol level of 0.05%, and extended shifts were linked to more serious errors","About 17 hours awake impairs performance like a blood alcohol level of 0.10%, and extended shifts were linked to fewer errors","About 17 hours awake impairs performance like a blood alcohol level of 0.05%, but insight into impairment remains accurate"],"e":"The lecture cites Dawson & Reid (17 h = 0.05% BAC), Landrigan et al. (35.9% more serious errors) and notes poor insight."},
{"t":"sl2","q":"A woman reports lying awake worrying although she has enough time in bed, with daytime fatigue. She has had it 3 nights a week for 5 months. Which diagnosis and first-line treatment?","a":["Chronic insomnia disorder; CBT-I","Narcolepsy; modafinil","Obstructive sleep apnoea; CPAP","Delayed circadian phase; melatonin"],"e":"Chronic insomnia needs at least 3 nights weekly for at least 3 months despite adequate opportunity; CBT-I is first-line."},
{"t":"sl2","q":"Her insomnia began with an exam, but now she spends more time in bed and fears the night. Which model explains persistence?","a":["3-P model: predisposing, precipitating and perpetuating factors","Two-process model: circadian and homeostatic factors alone","Fight-or-flight cycle: arousal maintains sleeplessness","Yerkes-Dodson relation: performance falls at high arousal"],"e":"The 3-P model: trait vulnerability, trigger (illness, bereavement, exam) and perpetuating behaviours such as long time in bed and fear of not sleeping."},
{"t":"sl2","q":"Which CBT-I component temporarily limits time in bed to strengthen sleep drive?","a":["Sleep restriction therapy","Stimulus control","Cognitive therapy","Relaxation and education"],"e":"Stimulus control re-associates bed with sleep; sleep restriction consolidates sleep; sleep hygiene alone is not CBT-I."},
{"t":"sl2","q":"A 52-year-old obese man has a STOP-BANG score of 6. What does this mean and what follows?","a":["High risk of OSA; objective sleep testing is appropriate","Diagnosis confirmed; start CPAP without testing","Low risk; reassure","Intermediate risk; no further action"],"e":"Scores of 5-8 are high risk; STOP-BANG is a screen, not a diagnostic test."},
{"t":"sl2","q":"A polysomnogram shows 22 apnoeas and hypopnoeas per hour with absent airflow but ongoing chest effort. Which classification?","a":["Moderate obstructive sleep apnoea","Mild central sleep apnoea","Severe obstructive sleep apnoea","Normal"],"e":"AHI 15-29.9 is moderate; effort during the event indicates obstruction; central events lack effort."},
{"t":"sl2","q":"A 37-year-old New Yorker with winter-pattern SAD asks how to get sustained bright daytime light. Which option do the slides lead towards?","a":["A prescribed UV-filtered 10,000-lux light box for 30-45 minutes daily, often in the morning","A prescribed UV-filtered 2,500-lux light box for 5-10 minutes daily, in the evening","Staying outdoors on sunny days only, in the afternoon","Keeping ordinary indoor lights on all day, which gives equal benefit"],"e":"The lecture's typical winter-SAD approach is a 10,000-lux light box, with review of response and mood activation risk."},
{"t":"cm","q":"A patient has E3 V3 M5 after a head injury, then 6 hours later E2 V2 M4. What does the change signify and what is the response?","a":["Deterioration needing urgent repeat imaging and neurosurgical review for expanding lesion or raised ICP","Normal fluctuation in a head-injured patient needing observation and a repeat GCS in an hour","Improvement as sedation wears off, needing no repeat imaging and a ward review in the morning","A localising sign for hypoglycaemia, needing glucose and repeat observations in an hour"],"e":"A fall in GCS (11 to 8) suggests raised ICP or an expanding haematoma."},
{"t":"cm","q":"A patient has spontaneous eye opening with eye movements but no response to commands for 2 months after a hypoxic injury and has intact sleep-wake cycles. A relative asks whether he is brain dead. Which statement is accurate?","a":["No: brainstem function is intact; this is vegetative state, not brain death","Yes: absence of awareness with preserved sleep-wake cycles means brain death","No: awareness is preserved, so this is locked-in syndrome","No: brainstem function is lost; this is coma, not brain death"],"e":"Brain death requires absent brainstem reflexes and apnoea; the vegetative state has preserved brainstem function and sleep-wake cycles."},
{"t":"dz","q":"A 74-year-old wakes with room spinning, nausea, left facial numbness, hoarse voice and gait ataxia but normal hearing. Which structure is the likely culprit and why does this go against BPPV?","a":["Lateral medulla (PICA territory); multiple brainstem signs show a central cause","Posterior canal; positional vertigo, with a multiple brainstem sign pattern not expected","Vestibular nerve; isolated vertigo with hoarseness not expected, so it is peripheral","Cerebellar tonsil; positional vertigo with ataxia, hence a peripheral cause"],"e":"Brainstem signs with vertigo indicate a central vestibular lesion, in contrast to BPPV's isolated positional vertigo."},
{"t":"dz","q":"A 24-year-old has syncope while standing in a hot room: pallor, nausea, tunnel vision, recovery within 20 seconds on lying flat, normal ECG and examination. What is the best plan?","a":["Reassure, explain trigger avoidance and counter-pressure manoeuvres","Start an antiepileptic and arrange an EEG","Implant a loop recorder immediately, since syncope is unexplained","Order MRI brain and tilt-table testing"],"e":"Typical reflex syncope with normal ECG and exam needs reassurance and education."},
{"t":"se","q":"A patient has pain and temperature loss in the left hand and arm, normal vibration, and a left Horner pupil, with later spastic legs. Which sequence of anatomy explains this?","a":["A cervical syrinx first cuts crossing spinothalamic fibres, then expands to the sympathetic and corticospinal tracts","A dorsal column infarct, then spinothalamic and corticospinal involvement, explains the pattern","A cervical syrinx first cuts the dorsal columns, then expands to the sympathetic and corticospinal tracts","A thalamic stroke, then parietal cortex involvement, explains the pattern"],"e":"Syringomyelia produces suspended dissociated loss then involves lateral horn and long tracts."},
{"t":"se","q":"A patient has numbness of the left leg to light touch and vibration, and pain and temperature loss in the right leg only below T12, with left leg weakness. Which lesion?","a":["Left hemicord lesion at about T10-T11","Right hemicord lesion","Bilateral posterior column lesion","Cauda equina lesion"],"e":"Ipsilateral dorsal column and motor loss with contralateral pain and temperature loss indicates Brown-Sequard on the side of weakness."},
{"t":"ep","q":"A 22-year-old collapses at a night club after drinking and sleep deprivation, has a generalised convulsion lasting 90 seconds, tongue bite on the side and 20 minutes of confusion. Which feature is most specific for a seizure over syncope?","a":["Lateral tongue biting with prolonged postictal confusion","Falling to the ground with loss of consciousness","Brief jerks after loss of consciousness","Loss of consciousness with prolonged recovery of 10 minutes"],"e":"Longer episodes, tongue biting and postictal confusion favour seizures; convulsive syncope can jerk briefly."},
{"t":"ep","q":"A 35-year-old has epilepsy and is 8 weeks pregnant on valproate. Which statement is most accurate based on the EURAP table in the lecture?","a":["Valproate carried the highest malformation rate (about 10%), versus 2.6% unexposed","Valproate carried the lowest malformation rate (about 2.6%), versus 10% unexposed","All antiepileptics carried equal malformation rates at about 10%","Levetiracetam carried the highest malformation rate (about 10%)"],"e":"The table shows valproate 10%, carbamazepine 5%, phenobarbital 6%, lamotrigine 3%, levetiracetam 3%."},
{"t":"dl","q":"A 76-year-old man admitted with pneumonia becomes agitated at night, hallucinating, with fluctuating attention. His wife says he was mentally normal last week. Which assessment points are most diagnostic?","a":["Acute onset with fluctuating course and inattention plus altered consciousness or disorganised thinking (CAM)","Memory loss for 3 years with fluctuating attention, plus chronic delusions and disorganised thinking","Progressive aphasia over months with inattention, altered consciousness and disorganised thinking","Fixed delusions for months with disorganised thinking, plus altered consciousness (CAM)"],"e":"CAM requires features 1 and 2 plus 3 or 4."},
{"t":"dl","q":"A hospitalised elderly woman is drowsy, quiet and eats little, with no agitation. Her nurse says she is just depressed. Which statement is the most helpful?","a":["Hypoactive delirium is common and easily missed; screen with 4AT and look for causes such as narcotics or sedatives","Quiet patients do not have delirium; depression explains an acute change in a drowsy patient","Delirium always includes agitation, so look for another cause and screen with 4AT","Hypoactive delirium is rare but easily missed; screen with 4AT and look for causes such as narcotics"],"e":"Hypoactive delirium follows narcotics and sedatives and is often missed."},
{"t":"at","q":"A 30-year-old has gait ataxia with prominent downbeat nystagmus. MRI shows tonsillar herniation through the foramen magnum. Which statement fits the lecture's table?","a":["Downbeat nystagmus points to a foramen magnum or posterior fossa lesion","Downbeat nystagmus indicates a peripheral vestibular lesion","Downbeat nystagmus indicates cerebellar stroke only","Downbeat nystagmus indicates alcohol"],"e":"The associated sign table links downbeat nystagmus with foramen magnum lesion or posterior fossa mass."},
{"t":"at","q":"A 25-year-old has ataxia, dysarthria and a Kayser-Fleischer ring with abnormal liver tests. Which statement is correct per the list of recessive cerebellar ataxias?","a":["Wilson disease is among the autosomal recessive causes","Wilson disease is an autosomal recessive cause, but it does not produce ataxia","Wilson disease is autosomal dominant with ataxia","Wilson disease is X-linked with ataxia"],"e":"The lecture lists Friedreich ataxia, ataxia-telangiectasia, Wilson disease, vitamin E deficiency, CoQ10 deficiency and AOA1/2 as recessive."},
{"t":"fm","q":"A couple married 4 years argue daily and satisfaction is low. The husband says a baby will repair things, and the wife asks what usually happens. What do the lecture's data predict, and when does satisfaction normally recover?","a":["Satisfaction falls further after the birth and recovers when children leave home","Satisfaction rises after the birth and stays high while children are at home","Satisfaction falls after the birth and recovers once the child starts school","Satisfaction is unchanged by the birth and recovers after the first anniversary"],"e":"Marital satisfaction is high after marriage, drops sharply with children and returns only around the time they leave home; a child to save a marriage is not wise."},
{"t":"fm","q":"A 38-year-old solicitor with excellent insurance, who married at 36 and has no children, has a breast lump. A trainee suggests it only seems common in her group because screening is better. After equalising screening, high-SES women still have more breast cancer. What is the next step in the lecture's reasoning, and what else is more frequent in her SES group?","a":["Postponed childbearing raises risk; anxiety and bipolar disorders are also more frequent","Higher smoking rates raise risk; depression and schizophrenia are also more frequent","Postponed childbearing raises risk; lower life satisfaction is also more frequent","Greater physical labour raises risk; anxiety and bipolar disorders are also more frequent"],"e":"Even after adjusting for detection, later marriage and childbearing explain the excess; high SES also has more anxiety disorders and bipolar disorder despite better overall health."},
{"t":"fm","q":"A clinician records that a low-SES father holds sharply defined views of what men and women should do, rejects other approaches as wrong, and describes problems in short concrete action terms ('we just fix it'). A colleague concludes he has low intelligence. Which evaluation fits the lecture?","a":["Unsupported: language reflects activity, and rigid roles are typical of low SES","Supported: concrete language indicates lower intelligence and poor education","Unsupported: rigid roles are typical of high SES and concrete language reflects wealth","Supported: rigid role expectations are caused by a single-parent household"],"e":"The lecture says action-oriented language reflects concrete activity (plumber vs lawyer) and is neither a money nor an intelligence issue; low SES involves sharper sex-role expectations and more rigidity."},
{"t":"fm","q":"A 16-year-old truants and fights. His parents are mid-separation with serious conflict, and his mother has just discovered an unplanned pregnancy that neither parent feels ready for. Which two lecture-listed conditions raise the likelihood of behavioural problems here?","a":["Serious parental relationship problems, and children arriving when parents cannot meet their needs","Low SES, and serious parental relationship problems","Children arriving when parents cannot meet their needs, and single parenthood","Serious parental relationship problems, and parents of high SES"],"e":"The lecture says behavioural problems become statistically likely if parents have serious relationship problems or children arrive when parents cannot fulfil safety, care, control and stimulation needs."},
{"t":"fm","q":"A 50-year-old executive with an MI is impatient, competitive and always racing deadlines. His cardiologist says caffeine is not the link. Another patient, calm and unhurried, also survived a first MI. Per the lecture, what links the executive's pattern to coronary disease and who is more likely to have a second MI?","a":["Unprocessed hostility builds physiological response; the calm patient (type B) is more likely to have a second MI","Unprocessed hostility builds physiological response; the executive (type A) is more likely to have a second MI","Excess time urgency alone causes it; the calm patient (type B) is more likely to have a second MI","Excess time urgency alone causes it; the executive (type A) is more likely to have a second MI"],"e":"Hostility, not hurry, is the real link, and type A people are more prone to follow medical advice, so type B patients are more likely to have a second MI."},
{"t":"fm","q":"A woman has this year separated from her husband (65), changed line of work (36), had her son leave home (29), taken on a mortgage (31) and had an outstanding personal achievement (28). What is her Holmes-Rahe total and prediction?","a":["189; about a 50% chance of major health breakdown in 2 years","189; low susceptibility because the score is under 300","219; about a 50% chance of major health breakdown in 10 years","219; about an 80% chance of major health breakdown in 2 years"],"e":"65+36+29+31+28=189, in the 150-300 band (about 50% chance in 2 years); positive events such as achievement still count because any change in routine is stressful."},
{"t":"fm","q":"Two colleagues both face the same job relocation. Dana calls it a chance to grow, believes her friends would help, though she has few contacts. Eli sees it as everything about his life changing, and has many relatives but believes none would help. Which statement fits the lecture?","a":["Eli is at greater risk: threat appraisal and low perceived support matter more than the number of contacts","Dana is at greater risk: number of contacts matters more than perceived support","Eli is at lower risk: his many relatives matter more than his appraisal","Dana and Eli are at equal risk, since the event rather than appraisal determines stress"],"e":"The lecture says appraisal of the event matters and that belief about the amount of social support is more important than objective support."},
{"t":"fm","q":"A 62-year-old man whose wife (his only confidant) has just died is compared with a 62-year-old widow with a close sister. Who is predicted to be more vulnerable and what lecture finding explains it?","a":["The widower; men turn to women for support and women are better at giving and using it","The widow; women turn to women, who are poorer at giving support","The widower; men turn to men for support and women are poorer at using it","The widow; both sexes turn to men, who are better providers of support"],"e":"Women seek support from women and men from women; women are better providers, so a man losing his spouse (100 points) loses his main source."},
{"t":"fm","q":"A 29-year-old paramedic scored over 300 on the Holmes-Rahe scale this year (separation, bereavement, job change, a move). Colleagues with similar scores have had breakdowns, yet he has not been ill. He volunteers for the hardest call-outs, says nobody else decides his path, and is restless on quiet shifts. He sees few people but is sure his brother would drop everything for him. Which explanation fits the lecture best?","a":["Hardy personality, with perceived social support as a moderator","Type A pattern, with perceived social support as a moderator","Hardy personality, with the objective number of contacts as a moderator","Type B pattern, with the objective number of contacts as a moderator"],"e":"Thriving under stress marks the hardy type; the belief in support matters more than the number of people around, so his brother counts even though his contacts are few. Type A is linked to hostility and heart disease, not resilience."},
{"t":"fm","q":"An archivist finds psychological records of healthy sophomores assessed 40 years ago and now traces the men. Based on the classic Harvard study in the lecture, which result should be expected?","a":["Those with better early mental health are more likely alive and physically healthier","Those with better early mental health have the same death rate but poorer later health","Those with worse early mental health are more likely alive but have poorer health","Those with better early mental health are more likely alive but not healthier"],"e":"The study showed good early mental health predicted survival and, among survivors, better physical health 40 years later."},
{"t":"sx","q":"A 31-year-old woman has had recurrent pelvic pain during and after intercourse for 8 months. Penetration is possible and there is no vaginal muscle spasm on examination. She discloses a sexual assault at 19. Which diagnosis and association fit the lecture?","a":["Dyspareunia; chronic pelvic pain is more common after rape or sexual abuse","Vaginismus; chronic pelvic pain is more common after rape or sexual abuse","Dyspareunia; chronic pelvic pain is more common in women with no history of abuse","Female arousal disorder; chronic pelvic pain is more common after rape or sexual abuse"],"e":"Recurrent, persistent pain with intercourse is dyspareunia (a pain disorder, more common in women); vaginismus needs involuntary constriction preventing penetration. Chronic pelvic pain is more common in women who have been raped or sexually abused, so ask about abuse sensitively and directly."},
{"t":"s1","q":"A 16-year-old single girl is 12 weeks pregnant. Which consequences should be discussed for her and the baby, according to the lecture?","a":["School dropout for her; prematurity and neonatal death for the child","School dropout for her; macrosomia and higher test scores for the child","Divorce and infertility for her; prematurity and neonatal death for the child","Obstetric complications for her; no excess risk for the child"],"e":"The lecture lists school dropout and high-risk obstetric complications for the mother; neonatal death, prematurity and lower intellectual test scores for the child."},
{"t":"s1","q":"A clinic report ranks infections as follows: HPV tops new diagnoses, HSV-2 tops people currently infected, and chlamydia tops notifications among women. Which mapping is correct?","a":["HPV: incidence; HSV-2: prevalence; chlamydia: most reported","HPV: prevalence; HSV-2: incidence; chlamydia: most reported","HPV: most reported; HSV-2: incidence; chlamydia: prevalence","HPV: incidence; HSV-2: most reported; chlamydia: prevalence"],"e":"Incidence is new cases, prevalence is existing cases, and 'most common' is reports."},
{"t":"s1","q":"A married man can only become aroused when his wife wears a particular leather jacket. She consents and nobody is harmed. Which diagnosis and approach fit?","a":["Fetishism; usually no intervention is needed while it is consensual","Fetishism; compulsory treatment is needed","Transvestite fetishism; usually no intervention is needed while it is consensual","Frotteurism; compulsory treatment is needed"],"e":"Fetishism needs a secondary object; consensual paraphilias between adults without harm are usually left alone."},
{"t":"s1","q":"A man has sexual urges towards children but has never touched a child or viewed child pornography. What does the lecture say?","a":["He still meets the definition of pedophilia, but most people act on their urges, so it is treated as criminal risk","He does not meet the definition until he touches a child, and most people with the urges never act on them","He meets the definition, but most people with the urges never act on them, so risk is low and he needs no follow-up","He meets the definition only if he views child pornography, and most people act on their urges"],"e":"The lecture says the definition is met without any act, and that most act on urges."},
{"t":"s1","q":"A woman jokes that she is 'a bit of a masochist' because she never says no to her boss. Which comment fits the lecture best?","a":["Masochism is sexual: arousal from being abused or dominated, not a lack of assertiveness","Masochism is a lack of assertiveness, which is how she describes herself","Masochism is sexual arousal from inflicting pain, not from being dominated","Masochism is a personality disorder rather than a paraphilia"],"e":"The lecture warns that the term is often misused for unassertive people."},
{"t":"s1","q":"A 14-year-old girl tells you she first had sex at 13 'and it was fine'. Which step is most consistent with the lecture?","a":["Ask sensitively whether it was wanted, since many early experiences are unwanted or forced","Accept that it was consensual, since she says it was fine","Consider it normal, since most first experiences occur within marriage","Discuss contraception only, since most early experiences are consensual"],"e":"A substantial percentage of girls with early first sex had unwanted or forced sex."},
{"t":"s1","q":"Of 1000 pregnant teenagers in the US, the lecture's proportions give which approximate outcome?","a":["500 births, 330 elective abortions, 170 spontaneous abortions","330 births, 500 elective abortions, 170 spontaneous abortions","500 births, 170 elective abortions, 330 spontaneous abortions","700 births, 150 elective abortions, 150 spontaneous abortions"],"e":"50% give birth, 33% abort electively and the remainder spontaneously abort."},
{"t":"s1","q":"A 19-year-old woman was raped by a classmate she had been dating. She now has nightmares, avoids the campus, drinks heavily and has low self-esteem. Which classification and screening list fit the lecture?","a":["Acquaintance (date) rape; screen for PTSD, GAD, substance abuse, mood swings and low self-esteem","Statutory rape; screen for PTSD, GAD, substance abuse, mood swings and low self-esteem","Acquaintance (date) rape; screen only for substance abuse because the perpetrator is known","Stranger rape; screen for PTSD only, since other sequelae are not related"],"e":"Acquaintance rape is committed by someone known; the sequelae include PTSD, GAD, substance abuse, mood swings and low self-esteem."},
{"t":"s1","q":"You see a woman with injuries after a sexual assault and wonder who the perpetrator might be. Which statement matches the lecture's statistics?","a":["Intimate partners and acquaintances are the most commonly reported perpetrators, stranger assault is less common","Strangers are the most commonly reported perpetrators, followed by intimate partners and acquaintances","Family members and strangers are the most commonly reported perpetrators, with partners rare","Strangers and partners are reported equally often, with acquaintances less common"],"e":"Among female victims 51% reported an intimate partner, 41% an acquaintance, 13% a family member and 14% a stranger."},
{"t":"s1","q":"A 45-year-old man with diabetes has erectile problems, performance anxiety, marital conflict and a strict religious upbringing. Which assignment to biopsychosocial domains is correct?","a":["Diabetes: biology; performance anxiety: psychology; marital conflict: interpersonal; upbringing: sociocultural","Diabetes: biology; performance anxiety: psychology; marital conflict: sociocultural; upbringing: interpersonal","Diabetes: psychology; performance anxiety: biology; marital conflict: interpersonal; upbringing: sociocultural","Diabetes: biology; performance anxiety: interpersonal; marital conflict: psychology; upbringing: sociocultural"],"e":"Physical health is biology, performance anxiety is psychology, relationship quality is interpersonal and upbringing is sociocultural."},
{"t":"su","q":"A 26-year-old is brought to the emergency department agitated, grandiose and paranoid, with tachycardia and dilated pupils. He is euphoric and shows repetitive stereotyped movements. Which substance and which receptor-level mechanism fit?","a":["Cocaine or amphetamine; increased dopamine in the nucleus accumbens pathway","Heroin; raised endorphin signalling in the locus coeruleus pathway","LSD; partial agonism at 5-HT2 receptors in the cortex","Cannabis; raised GABA and serotonin signalling with a small NAc effect"],"e":"Dilated pupils with tachycardia complete the stimulant profile."},
{"t":"su","q":"A man develops headache, fatigue, drowsiness and nausea on the first day of a long-haul trip without his usual drinks. He denies drug use. What is the most likely cause?","a":["Caffeine withdrawal, usually settling within 1-4 days","Nicotine withdrawal, usually settling within 1-4 weeks","Opiate withdrawal, usually settling within 7-10 days","Alcohol withdrawal, usually settling within 1-4 days"],"e":"Caffeine withdrawal is variable between people."},
{"t":"su","q":"A 19-year-old at a party is anxious, with slow reactions, red eyes, impaired coordination and a ravenous appetite. What substance and what mechanism?","a":["Cannabis; inhibitory G-protein action with raised GABA and serotonin","Cocaine; blocked dopamine reuptake with tachycardia and dilated pupils","LSD; partial agonism at 5-HT2 receptors with hallucinations and tremor","Heroin; agonism at opiate receptors with drowsiness and pinpoint pupils"],"e":"Conjunctival injection and increased appetite are typical."},
{"t":"su","q":"A student three days after LSD fears people are talking about him, sees colours when he hears music and feels unreal. What is the best response?","a":["Supportive counselling ('talking down'), with benzodiazepines or antipsychotics if needed","High-dose naloxone, with antidepressants if the anxiety persists","Physical restraint in a dark room, with lithium if agitation persists","Reassurance and discharge, with no follow-up unless flashbacks recur"],"e":"These are ideas of reference, synaesthesia and depersonalisation."},
{"t":"su","q":"A 15-year-old is found drowsy, unsteady and with nystagmus, with crusting around his nose and mouth and a smell of solvent. Which statement is correct?","a":["Inhalant intoxication; counselling and psychoeducation are the main treatment","Alcohol intoxication; benzodiazepines are the main treatment","Opiate intoxication; naloxone is the main treatment","Hallucinogen intoxication; 'talking down' is the main treatment"],"e":"Inhalants cause cerebellar signs and no withdrawal."},
{"t":"su","q":"A 45-year-old smoker has had three failed quit attempts. He is depressed and asks about medication. Which option fits the lecture?","a":["Bupropion or varenicline, with nicotine patches and behavioural support","Naltrexone or acamprosate, with nicotine patches and behavioural support","Methadone or buprenorphine, with behavioural support","Benzodiazepines, with behavioural support"],"e":"Success on a single trial is under 10%."},
{"t":"su","q":"A heroin user is in agony on day three of abstinence with yawning, runny nose, muscle aches and dilated pupils. He asks if he will die. What do you say?","a":["It is very unpleasant but not life threatening, and usually lasts 7-10 days","It is life threatening and usually lasts 7-10 days, so admission is needed","It is not life threatening but usually lasts 7-10 weeks","It is life threatening and usually lasts 1-4 days, so admission is needed"],"e":"Patients relapse to avoid the agony."},
{"t":"su","q":"A recovering drinker has completed detox and wants a drug to help him stay abstinent. He has no opioid use. Which options are consistent with the lecture?","a":["Acamprosate, naltrexone or disulfiram","Diazepam, naltrexone or disulfiram","Acamprosate, naloxone or disulfiram","Acamprosate, naltrexone or methadone"],"e":"Post-detox drugs work best with psychosocial support."},
{"t":"su","q":"A GP has 10 minutes with a man who attended with injuries after a fall and whose AUDIT score is high. Which action is most consistent with the lecture?","a":["A brief intervention covering awareness and safe limits, then a fuller assessment","Immediate prescription of disulfiram after a brief reading, then discharge","A breathalyser reading and discharge if the level is below 80","Admission under the Mental Health Act for the addiction alone"],"e":"A positive screen prompts more assessment."},
{"t":"su","q":"A man says that one drink does not matter because he has no cravings. Which formulation fits the lecture's cycle?","a":["A cue or stress raises attention, craving makes use likely, relief reinforces use and consequences restart the cycle","A craving causes a cue, relief makes use unlikely, punishment weakens use and consequences end the cycle","A cue or stress lowers attention, craving makes use unlikely, relief reinforces use and consequences end the cycle","A cue or stress raises attention, craving makes use likely, relief weakens use and consequences end the cycle"],"e":"Treatment can interrupt the cycle at several points."},
{"t":"mv","q":"A 68-year-old man has a 2-year history of right-hand rest tremor, slow movement, reduced arm swing and a soft voice. Which diagnosis and first-line approach fit?","a":["Idiopathic Parkinson's disease; levodopa or a dopamine agonist","Essential tremor; propranolol and alcohol avoidance","Multiple system atrophy; levodopa with high doses","Progressive supranuclear palsy; amantadine"],"e":"Asymmetric rest tremor with bradykinesia is typical of PD."},
{"t":"mv","q":"A 55-year-old with advanced PD has severe motor fluctuations despite oral drugs. Which options does the lecture offer?","a":["Apomorphine injection, levodopa gel infusion or deep brain stimulation","Apomorphine tablets, entacapone gel infusion or thalamotomy","Rotigotine tablets, levodopa gel infusion or cortical stimulation","Apomorphine injection, levodopa tablets or lesioning of the caudate"],"e":"DBS targets the GPi or STN."},
{"t":"mv","q":"A 64-year-old has severe orthostatic hypotension, urinary incontinence, cerebellar gait ataxia and rigidity unresponsive to levodopa. MRI shows a hot cross bun sign. Diagnosis?","a":["Multiple system atrophy","Progressive supranuclear palsy","Corticobasal degeneration","Idiopathic Parkinson's disease"],"e":"Autonomic failure with cerebellar and parkinsonian features is MSA."},
{"t":"mv","q":"A 66-year-old has had backward falls for a year, cannot look down or sideways, has a staring face and axial rigidity. MRI shows midbrain atrophy. Diagnosis?","a":["Progressive supranuclear palsy","Multiple system atrophy","Corticobasal degeneration","Idiopathic Parkinson's disease"],"e":"The hummingbird sign supports PSP."},
{"t":"mv","q":"A 24-year-old has tremor, dystonia, personality change and abnormal liver tests. Slit lamp shows a golden-brown ring at the corneal limbus. What is the next test?","a":["Serum ceruloplasmin and 24-hour urinary copper","Serum ferritin and transferrin saturation","CSF 14-3-3 protein and EEG","Huntingtin CAG repeat analysis"],"e":"These are Kayser-Fleischer rings."},
{"t":"mv","q":"A 45-year-old man has irritability, apathy, clumsiness and jerky, dance-like movements. His father died with a similar illness. What is the likely inheritance and mutation?","a":["Autosomal dominant CAG repeat expansion (huntingtin)","Autosomal recessive CAG repeat expansion (huntingtin)","Autosomal dominant GAA repeat expansion","X-linked CAG repeat expansion"],"e":"Cell loss affects caudate and putamen."},
{"t":"mv","q":"A 6-year-old boy has repeated eye blinking, throat clearing and shoulder shrugging that he can suppress briefly. He is also inattentive and has obsessions. Diagnosis?","a":["Tourette syndrome with ADHD and obsessive-compulsive features","Sydenham's chorea with ADHD","Huntington disease with obsessive-compulsive features","Juvenile dystonia with ADHD"],"e":"Tics are rapid and suppressible."},
