@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0f1a20;--surface:#17252d;--ink:#e6eef2;--muted:#9bb0ba;--line:#2a3d47;
--accent:#5cb8d6;--accent-ink:#06222c;--accent-soft:#1c3743;
--good:#58c58f;--good-soft:#173b2b;--bad:#f0877f;--bad-soft:#44201d;--warn:#e8b555;--warn-soft:#3d2f10;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0f1a20;--surface:#17252d;--ink:#e6eef2;--muted:#9bb0ba;--line:#2a3d47;
--accent:#5cb8d6;--accent-ink:#06222c;--accent-soft:#1c3743;
--good:#58c58f;--good-soft:#173b2b;--bad:#f0877f;--bad-soft:#44201d;--warn:#e8b555;--warn-soft:#3d2f10;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:1.9rem;line-height:1.15;margin:4px 0 6px;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.25rem;margin:0 0 8px;text-wrap:balance;font-weight:600}
p{margin:0 0 10px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
#modebar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.modehint{font-size:.85rem;color:var(--muted);min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px;text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{margin:26px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem;min-width:0}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip.done{border-color:var(--good);background:var(--good-soft)}
.chip.done[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.chip.done[aria-pressed="false"]{opacity:.75}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:6px;font-size:.74rem}
.chip.done small{color:var(--good)}
.prog{margin-top:26px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 16px}
.prog>summary{cursor:pointer;padding:12px 0;font-weight:600}
.prow{display:grid;grid-template-columns:minmax(140px,1.3fr) 2fr;gap:8px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .nm{font-weight:600;min-width:0}
.pbtns{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.dn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:.84rem;min-width:0;color:var(--ink)}
.dn small{font-family:var(--mono);color:var(--muted);margin-left:5px;font-size:.72rem}
.dn[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--ink);font-weight:600}

.dn.whole{border-style:dashed}
.dn.whole[aria-pressed="true"]{border-style:solid}
.progtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 12px;border-top:1px solid var(--line)}
@media(max-width:560px){.prow{grid-template-columns:1fr}}
.custom{display:inline-flex;gap:6px;align-items:center}
.custom input{width:84px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.level{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.level:hover{border-color:var(--accent)}
.level.allknown{border-color:var(--good);background:var(--good-soft)}
.pips{display:flex;gap:4px}.pip{width:22px;height:6px;border-radius:3px;background:var(--line)}.pip.on{background:var(--accent)}
.level b{font-size:1.08rem}
.level .meta{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.dot{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:.68rem;font-family:var(--mono);padding:0;color:var(--muted)}
.dot.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}
.dot.ok{background:var(--good-soft);border-color:var(--good)}.dot.no{background:var(--bad-soft);border-color:var(--bad)}
.tag{display:inline-block;font-family:var(--mono);font-size:.72rem;background:var(--accent-soft);padding:2px 8px;border-radius:5px;margin-bottom:10px}
.q{font-size:1.18rem;line-height:1.4;font-weight:500;margin:0 0 16px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;min-width:0}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.elim{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mk{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem}
.mk[aria-pressed="true"].k{background:var(--good-soft);border-color:var(--good)}
.mk[aria-pressed="true"].p{background:var(--warn-soft);border-color:var(--warn)}
.tip{margin-top:12px;background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.92rem;overflow-wrap:anywhere}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:.95rem}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.score{font-size:3rem;font-weight:600;line-height:1;margin:6px 0}
.lec{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
.lec .bar{margin:0}
.lec .bar i.g{background:var(--good)}
.miss{border-top:1px solid var(--line);padding:14px 0}
.miss .a{font-size:.92rem}
.simple{margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.simple p{margin:0 0 8px}
.note{background:var(--good-soft);border-radius:8px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin-top:14px}
footer{margin-top:30px;font-size:.82rem;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.55rem}.lec{grid-template-columns:1fr auto}.lec .bar{grid-column:1/3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

{"t":"ep","q":"Which pair of drugs does the epilepsy lecture list for generalized-onset epilepsy?","a":["Sodium valproate or levetiracetam","Carbamazepine or phenytoin","Sodium valproate or carbamazepine","Lamotrigine or lacosamide"],"e":"Generalized-onset epilepsy is treated with sodium valproate or levetiracetam. Lamotrigine/levetiracetam are listed for focal onset."},

{"t":"ep","q":"Childhood absence epilepsy typically begins at what age?","a":["Between 4 and 8 years","Between 1 and 4 years","Between 8 and 12 years","Between 12 and 16 years"],"e":"Childhood absence epilepsy begins between ages four and eight with absence seizures and 3 Hz-type spike-wave discharges."},

{"t":"at","q":"Which cerebellar lesion typically gives prominent truncal and gait ataxia?","a":["A vermal lesion","A cerebellar hemisphere lesion","A dentate nucleus lesion","A superior cerebellar peduncle lesion"],"e":"Vermal lesions give truncal and gait ataxia; hemispheric lesions give ipsilateral limb ataxia."},
{"t":"dm","q":"Which drug class is used for mild to moderate Alzheimer's disease?","a":["Acetylcholinesterase inhibitors such as donepezil","Cholinergic agonists such as bethanechol","Anticholinergics such as oxybutynin","Dopamine antagonists such as haloperidol"],"e":"Donepezil, rivastigmine and galantamine raise acetylcholine levels."},
{"t":"an","q":"How did Beck define fear and anxiety?","a":["Fear is the appraisal of danger; anxiety is the unpleasant feeling it evokes","Fear is the appraisal of danger; anxiety is the behavioural avoidance it evokes","Anxiety is the appraisal of danger; fear is the feeling it evokes","Fear is the feeling state of dread; anxiety is the appraisal of present danger"],"e":"Fear is a cognitive appraisal of danger; anxiety is the unpleasant feeling state evoked by it."},

{"t":"an","q":"A panic attack reaches its peak within how long?","a":["10 minutes","5 minutes","30 minutes","60 minutes"],"e":"A panic attack is a discrete episode of intense fear in which symptoms develop abruptly and peak within 10 minutes."},
{"t":"dl","q":"How does delirium typically begin compared with dementia?","a":["Over hours to days, versus insidiously in dementia","Over days to weeks, versus insidiously in dementia","Over hours to days, versus stepwise in all dementias","Over weeks to months, versus abruptly in dementia"],"e":"Delirium has acute onset (hours to days); dementia evolves over weeks, months or years."},
{"t":"dl","q":"The CAM diagnoses delirium with criteria 1 and 2 plus which?","a":["Either criterion 3 or 4","Both criterion 3 and criterion 4","Criterion 3 only","Criterion 4 only"],"e":"CAM requires acute onset/fluctuation and inattention, plus disorganised thinking or altered level of consciousness."},

{"t":"sl1","q":"Which structure is the master circadian pacemaker?","a":["The suprachiasmatic nucleus","The paraventricular nucleus","The ventrolateral preoptic nucleus","The pineal gland"],"e":"The SCN aligns internal rhythms to the external day and regulates pineal melatonin."},

{"t":"sc","q":"What does NICE recommend for first-episode psychosis?","a":["Antipsychotic plus individual CBT and family intervention","Antipsychotic plus family intervention, with CBT reserved for relapse","Antipsychotic plus individual CBT, with family intervention reserved for relapse","Antipsychotic plus group CBT and supported employment"],"e":"NICE recommends medication together with CBT and family intervention."},

{"t":"ps","q":"The lecture states that a mental illness is diagnosable from specific symptoms and usually treated how?","a":["Pharmacologically and/or with therapy","Only pharmacologically","Only with psychotherapy","Pharmacologically, with therapy reserved for relapse"],"e":"A mental illness is diagnosable based on specific symptoms and usually can be treated pharmacologically and/or with therapy."},
{"t":"ps","q":"Which three sets of factors does the biopsychosocial model combine?","a":["Biological, psychological and social","Biological, psychological and spiritual","Biological, cultural and social","Genetic, psychological and social"],"e":"The BPS model assumes the coordinated influence of biological, psychological and social factors."},
{"t":"ps","q":"Which statement describes the biomedical model rather than the biopsychosocial model?","a":["It is reductionistic and considers a single causal factor","It is reductionistic and considers multiple causal factors","It is holistic and considers a single causal factor","It treats mind and body as inseparable and emphasises both health and illness"],"e":"Biomedical: reductionistic, single causal factor, mind-body dualism, emphasises illness over health."},
{"t":"ps","q":"In the biopsychosocial model, 'genetic vulnerability' and 'temperament' fall under which group?","a":["Biological factors","Psychological factors","Social factors","Environmental factors"],"e":"On the slide, genetic vulnerability, drug effects and physical health sit with biological factors; temperament was also placed in the biological group."},
{"t":"ps","q":"In the biopsychosocial model slide, 'self-esteem', 'trauma' and 'coping skills' are examples of which group?","a":["Psychological factors","Biological factors","Social factors","Environmental factors"],"e":"Self-esteem, trauma and coping skills are listed as psychological factors."},
{"t":"ps","q":"In the biopsychosocial model slide, 'family circumstances', 'peers' and 'school' belong to which group?","a":["Social factors","Psychological factors","Biological factors","Environmental factors"],"e":"Family, peers, school and family relationships are social factors."},

{"t":"ps","q":"What should questions in the psychiatric history ideally be?","a":["Open ended, inviting the patient to tell a narrative","Closed and direct, inviting short answers to save time","Open ended, but directed only at symptoms and diagnosis","Open ended, but directed first at relatives to confirm the story"],"e":"All questions should be open ended and invite the patient to tell a narrative or story."},
{"t":"ps","q":"What is the final step of the clinical interview approach in the lecture?","a":["Formulation using ICD-10 vs DSM-5 and a biopsychosocial approach","Mental status exam using ICD-10 vs DSM-5 and a biopsychosocial approach","Formulation using ICD-10 vs DSM-5 and a purely biomedical approach","History taking using ICD-10 vs DSM-5 and a biopsychosocial approach"],"e":"Step D is the formulation: ICD-10 vs DSM-5 and the biopsychosocial approach."},
{"t":"ps","q":"How should a doctor ask about sensitive material such as abuse or domestic violence?","a":["Directly and openly","Indirectly, with gentle hints","Only after the patient raises it","Through a relative first"],"e":"The lecture says to be direct: hesitating or being indirect makes the patient less likely to volunteer information."},
{"t":"ps","q":"Which of these is a main category of psychological disorders in the lecture?","a":["Dissociative disorders","Neurodegenerative disorders","Endocrine disorders","Neuromuscular disorders"],"e":"Listed categories: anxiety, mood, personality, psychotic, dissociative, eating, sleep and substance-related disorders."},
{"t":"ps","q":"In the lecture's prevalence list, which country had one of the highest lifetime rates of psychological disorder?","a":["United States (about 1 in 4, 26%)","Mexico (about 1 in 8, 12%)","Spain (about 1 in 11, 9.2%)","Japan (about 1 in 11, 8.8%)"],"e":"The United States is quoted at 1 in 4 (26%), one of the highest in the world; Nigeria and China were among the lowest."},
{"t":"cm","q":"What are the three components of the Glasgow Coma Scale?","a":["Eye opening, verbal response, motor response","Eye opening, verbal response, pupillary response","Eye opening, orientation, motor response","Verbal response, motor response, brainstem reflexes"],"e":"The GCS scores eye opening (1-4), verbal response (1-5) and motor response (1-6)."},
{"t":"cm","q":"What is the lowest possible GCS total score?","a":["3","1","2","4"],"e":"Each component has a minimum of 1, so the lowest total is 3 and the highest 15."},
{"t":"cm","q":"A GCS of 8 or less is conventionally taken to indicate what?","a":["Coma / severe impairment","Moderate impairment, usually without airway risk","Mild head injury with full recovery expected","Vegetative state"],"e":"A GCS of 8 or below indicates severe impairment of consciousness (coma) and often prompts airway protection."},
{"t":"cm","q":"Which term describes a patient who is awake and aware but can only move the eyes and blink because of a ventral pontine lesion?","a":["Locked-in syndrome","Minimally conscious state","Akinetic mutism","Persistent vegetative state"],"e":"Locked-in patients are conscious but quadriplegic and unable to speak, communicating with vertical eye movements and blinking."},
{"t":"cm","q":"What best distinguishes a persistent vegetative state from coma?","a":["Sleep-wake cycles return but there is no awareness","Awareness returns but sleep-wake cycles do not","Brainstem reflexes are lost but awareness is preserved","Eye opening is absent but awareness is preserved"],"e":"In PVS the eyes open and sleep-wake cycles appear, but there is no awareness of self or environment."},
{"t":"cm","q":"Which respiratory pattern is classically seen with bilateral hemispheric or diencephalic dysfunction?","a":["Cheyne-Stokes respiration","Central neurogenic hyperventilation","Apneustic breathing","Ataxic (Biot) breathing"],"e":"Cheyne-Stokes is a waxing and waning pattern with apnoeic pauses, linked to bilateral hemispheric/diencephalic lesions."},
{"t":"cm","q":"Which posture involves flexion of the arms with extended legs?","a":["Decorticate posturing","Decerebrate posturing","Opisthotonos with arm flexion","Extension of the arms with flexion of the legs"],"e":"Decorticate = arms flexed, legs extended; decerebrate = arms and legs extended with pronation."},

{"t":"cm","q":"What does a unilateral fixed dilated pupil in a comatose patient suggest first?","a":["Compression of the oculomotor nerve (uncal herniation)","Sympathetic chain interruption (Horner syndrome)","Pontine tegmental haemorrhage","Opioid effect on the Edinger-Westphal nucleus"],"e":"A blown pupil suggests third nerve compression from transtentorial (uncal) herniation."},
{"t":"cm","q":"Pinpoint pupils in a comatose patient suggest which cause(s)?","a":["Opioids or a pontine lesion","Opioids or a midbrain lesion","Anticholinergics or a pontine lesion","Opioids or a medullary lesion"],"e":"Pinpoint pupils occur with opioids and pontine haemorrhage (sympathetic pathway disruption)."},
{"t":"cm","q":"Which reflex is tested by turning the head side to side and watching the eyes (doll's eyes)?","a":["Oculocephalic reflex","Oculovestibular reflex","Vestibulospinal reflex","Optokinetic reflex"],"e":"The oculocephalic reflex tests brainstem integrity; it must not be tested if a cervical spine injury is suspected."},
{"t":"cm","q":"Which reflex is tested by instilling cold water into the ear canal?","a":["Oculovestibular (caloric) reflex","Oculocephalic reflex","Optokinetic reflex","Vestibulospinal reflex"],"e":"Caloric testing assesses the oculovestibular pathway and brainstem function in coma."},
{"t":"cm","q":"What is the first priority in the management of a comatose patient?","a":["Airway, breathing and circulation","Blood glucose and thiamine","Pupil and GCS assessment","Neck stabilisation and CT"],"e":"ABC comes first, then glucose, then looking for the cause."},
{"t":"cm","q":"Which bedside test should be done immediately in all patients with reduced consciousness?","a":["Capillary blood glucose","Serum sodium","Urine toxicology screen","Serum ammonia"],"e":"Hypoglycaemia is an immediately reversible cause and must be checked at once."},
{"t":"dz","q":"Which structure is damaged in a typical peripheral vestibular cause of vertigo?","a":["Inner ear labyrinth or vestibular nerve","Vestibular nuclei in the brainstem","The cerebellar flocculonodular lobe","The temporoparietal vestibular cortex"],"e":"Peripheral vertigo arises from the labyrinth or the vestibular nerve."},
{"t":"dz","q":"What is the term for the sensation of the world spinning?","a":["Vertigo","Presyncope","Disequilibrium","Oscillopsia"],"e":"Vertigo is an illusion of rotation or movement of the self or environment."},

{"t":"dz","q":"Which manoeuvre is used to diagnose BPPV?","a":["Dix-Hallpike","Epley manoeuvre","Head impulse test","Fukuda stepping test"],"e":"Dix-Hallpike provokes vertigo and nystagmus in BPPV; the Epley manoeuvre treats it."},

{"t":"dz","q":"Which lifestyle advice is usually given in Meniere disease?","a":["Low-salt diet","High-salt diet with fluid loading","Strict fluid restriction","Vigorous head-turning exercises daily"],"e":"Low salt intake (and diuretics) are used to reduce endolymphatic pressure."},
{"t":"dz","q":"Vestibular neuritis typically causes acute vertigo with what hearing finding?","a":["Normal hearing","Unilateral sensorineural hearing loss","Fluctuating low-frequency hearing loss","Tinnitus with mild hearing loss"],"e":"Vestibular neuritis spares hearing; labyrinthitis also involves hearing loss."},
{"t":"dz","q":"Which feature favours a central rather than peripheral cause of vertigo?","a":["Vertical or direction-changing nystagmus","Unidirectional horizontal nystagmus with torsion","Nystagmus that lessens with visual fixation","Nystagmus appearing after a latency and fatiguing"],"e":"Central nystagmus can be vertical, direction-changing and is not suppressed by visual fixation."},
{"t":"dz","q":"What is syncope?","a":["Transient loss of consciousness due to cerebral hypoperfusion","Transient loss of consciousness from abnormal cortical discharge","Brief loss of postural tone with preserved consciousness","Gradual loss of awareness from metabolic encephalopathy"],"e":"Syncope is transient LOC from global cerebral hypoperfusion with rapid recovery."},

{"t":"dz","q":"What blood pressure drop defines orthostatic hypotension within 3 minutes of standing?","a":["At least 20 mmHg systolic or 10 mmHg diastolic","At least 30 mmHg systolic or 20 mmHg diastolic","At least 10 mmHg systolic or 5 mmHg diastolic","At least 40 mmHg systolic or 20 mmHg diastolic"],"e":"Orthostatic hypotension: fall of >=20 systolic or >=10 diastolic within 3 min of standing."},
{"t":"dz","q":"Which investigation is mandatory in every patient with syncope?","a":["ECG","Echocardiogram","EEG","Carotid Doppler"],"e":"An ECG is the first-line investigation to detect arrhythmia or conduction disease."},
{"t":"se","q":"Which sensory modalities travel in the dorsal columns?","a":["Vibration, proprioception and fine touch","Vibration, proprioception and temperature","Pain, proprioception and fine touch","Vibration, crude touch and pressure"],"e":"The dorsal column-medial lemniscus pathway carries vibration, proprioception and discriminative touch."},
{"t":"se","q":"Which sensory modalities travel in the spinothalamic tract?","a":["Pain and temperature","Pain, temperature and vibration","Pain, temperature and fine touch","Pain, crude touch and proprioception"],"e":"The spinothalamic tract carries pain and temperature (and crude touch)."},

{"t":"se","q":"What is allodynia?","a":["Pain from a stimulus that is not normally painful","An increased response to a normally painful stimulus","Pain that persists after a stimulus ends","Spontaneous burning pain without a stimulus"],"e":"Allodynia is pain evoked by a normally non-painful stimulus such as light touch."},

{"t":"se","q":"Which syndrome causes ipsilateral weakness and loss of position sense with contralateral loss of pain and temperature?","a":["Brown-Sequard syndrome","Central cord syndrome","Anterior cord syndrome","Posterior cord syndrome"],"e":"Hemisection of the cord produces the Brown-Sequard pattern."},

{"t":"cm","q":"What happens in the oculovestibular reflex of a patient with intact brainstem when cold water is instilled in the right ear?","a":["Slow eye deviation to the right with fast phase to the left","Fast eye deviation to the right with slow phase to the left","Slow eye deviation to the right with fast phase to the right","Bilateral upward deviation"],"e":"Cold water causes the slow phase toward the irrigated ear and the fast phase away (COWS) in awake patients; in coma only the tonic deviation toward the cold ear occurs."},
{"t":"cm","q":"Before testing the doll's eyes reflex what must be excluded?","a":["Cervical spine injury","Raised intracranial pressure","Hypothermia","Glaucoma"],"e":"Never turn the head if a cervical spine injury is possible."},
{"t":"cm","q":"Ataxic (Biot) breathing is most associated with which level?","a":["Medulla","Pons","Midbrain","Thalamus"],"e":"Cheyne-Stokes: bilateral hemispheres/diencephalon; hyperventilation: midbrain; apneustic: pons; ataxic: medulla."},
{"t":"cm","q":"A diabetic man is found unconscious, with sweating and tachycardia. What should be given immediately?","a":["IV glucose (dextrose)","IV thiamine alone","IV insulin","IV naloxone"],"e":"Hypoglycaemia is the fastest reversible cause; give glucose with thiamine when appropriate."},
{"t":"cm","q":"A patient with opioid overdose has pinpoint pupils and RR 6/min. What is the specific treatment?","a":["Naloxone","Flumazenil","Physostigmine","Atropine"],"e":"Naloxone reverses opioids; flumazenil reverses benzodiazepines."},
{"t":"cm","q":"A comatose patient is thought to have a benzodiazepine overdose. Which antidote is used?","a":["Flumazenil","Naloxone","Physostigmine","N-acetylcysteine"],"e":"Flumazenil is the benzodiazepine antagonist (cautiously, due to seizure risk)."},
{"t":"cm","q":"A patient is unconscious with fever, neck stiffness and petechial rash. What should be started immediately?","a":["IV antibiotics","Lumbar puncture first, then antibiotics","CT head first, then antibiotics","IV steroids only"],"e":"Suspected bacterial meningitis requires immediate empirical antibiotics; do not delay for LP or CT."},
{"t":"dz","q":"A 55-year-old woman has 30-second spinning on turning over in bed, with torsional upbeating nystagmus after Dix-Hallpike toward the right that fatigues. What is the diagnosis?","a":["Right posterior canal BPPV","Left posterior canal BPPV","Right horizontal canal BPPV","Right anterior canal BPPV"],"e":"Short positional vertigo with latent, fatiguing torsional nystagmus is classic BPPV."},
{"t":"dz","q":"A 40-year-old has 3 days of continuous vertigo, vomiting and normal hearing after a viral illness. Head impulse is abnormal. Diagnosis?","a":["Vestibular neuritis","Labyrinthitis","Vestibular migraine","Cerebellar infarction"],"e":"Acute continuous vertigo without hearing loss and with abnormal head impulse suggests vestibular neuritis."},
{"t":"dz","q":"A patient has acute vertigo with hearing loss after a viral illness. What is the likely diagnosis?","a":["Labyrinthitis","Vestibular neuritis","Meniere disease","Perilymph fistula"],"e":"Labyrinthitis involves both the vestibular and cochlear parts."},
{"t":"dz","q":"A 50-year-old has episodes of vertigo lasting hours with tinnitus, fluctuating low-frequency hearing loss and aural fullness. Diagnosis?","a":["Meniere disease","Vestibular migraine","Labyrinthitis","Acoustic neuroma"],"e":"This is the classic Meniere pattern; low-salt diet and diuretics are used."},
{"t":"dz","q":"Which feature distinguishes peripheral from central nystagmus?","a":["Peripheral nystagmus is suppressed by visual fixation","Central nystagmus is suppressed by visual fixation","Peripheral nystagmus is vertical or direction-changing","Peripheral nystagmus does not fatigue and persists"],"e":"Peripheral: horizontal-torsional, unidirectional, suppressed by fixation, fatigable; central: vertical or direction changing, not suppressed."},
{"t":"dz","q":"Downbeat nystagmus suggests a lesion at which site?","a":["Foramen magnum / posterior fossa","Medial longitudinal fasciculus (internuclear ophthalmoplegia)","Vestibular nerve","Paramedian pontine reticular formation"],"e":"Downbeat nystagmus indicates foramen magnum or cerebellar lesions such as Chiari malformation."},
{"t":"dz","q":"A hypertensive smoker has sudden vertigo, vomiting, inability to walk and a headache. Which diagnosis must be excluded urgently?","a":["Cerebellar haemorrhage or infarction","Vestibular neuritis","Vestibular migraine","Labyrinthitis"],"e":"Acute vertigo with severe imbalance and vascular risk factors suggests cerebellar stroke."},
{"t":"dz","q":"A 70-year-old on antihypertensives feels dizzy and nearly faints on standing, BP drops from 150/90 to 115/70 after 2 minutes. Diagnosis?","a":["Orthostatic hypotension","Postural orthostatic tachycardia syndrome","Vasovagal syncope","Cardiac syncope"],"e":"A fall >=20 systolic or >=10 diastolic confirms orthostatic hypotension; review medicines."},
{"t":"dz","q":"A young man faints at the sight of blood, preceded by nausea, sweating and pallor. Diagnosis?","a":["Vasovagal syncope","Situational syncope","Carotid sinus syncope","Orthostatic hypotension"],"e":"Vasovagal syncope has a prodrome and clear trigger."},
{"t":"dz","q":"An athlete collapses suddenly during exercise without warning. Which syncope type is worrying?","a":["Cardiac syncope","Exertional vasovagal syncope","Orthostatic syncope","Situational syncope"],"e":"Exertional syncope without prodrome suggests structural heart disease or arrhythmia."},
{"t":"dz","q":"Which feature favours seizure over syncope?","a":["Tongue biting, prolonged postictal confusion","Brief arm jerks lasting seconds","Provocation by prolonged standing","A prodrome of nausea and tunnel vision"],"e":"Seizures have longer LOC, postictal confusion and lateral tongue biting; syncope recovers within seconds."},
{"t":"dz","q":"What does the Epley manoeuvre treat?","a":["Canalithiasis of the posterior semicircular canal","Cupulolithiasis of the horizontal canal","Endolymphatic hydrops","Inflammation of the vestibular nerve"],"e":"Otoconia displaced in the posterior canal are repositioned."},
{"t":"dz","q":"Which drug class is used for short-term control of acute vertigo but delays compensation if prolonged?","a":["Vestibular suppressants (e.g. prochlorperazine)","Betahistine","Thiazide diuretics","Intratympanic gentamicin"],"e":"Vestibular suppressants should be used briefly in acute vertigo only."},
{"t":"dz","q":"Carotid sinus syncope typically occurs in what setting?","a":["Neck turning, tight collar or shaving in an older man","Rapid standing in an older woman","Straining at micturition in a young man","Prolonged standing in a warm crowd in a teenager"],"e":"Carotid sinus hypersensitivity causes syncope after pressure on the neck."},
{"t":"se","q":"A patient has loss of vibration and position sense in the right leg and loss of pain and temperature in the left leg from the umbilicus down. Which lesion?","a":["Right hemisection of the cord (Brown-Sequard)","Left hemisection of the cord with ipsilateral dorsal column loss","Right anterior cord syndrome with bilateral spinothalamic loss","Right posterior cord syndrome with contralateral position loss"],"e":"Dorsal columns are ipsilateral, spinothalamic contralateral, so the lesion is on the side of dorsal column loss."},
{"t":"se","q":"A patient has loss of pain and temperature in a cape distribution over both shoulders with preserved vibration. Diagnosis?","a":["Syringomyelia","Subacute combined degeneration","Tabes dorsalis","Anterior spinal artery syndrome"],"e":"A central cavity damages crossing spinothalamic fibres, giving suspended dissociated sensory loss."},
{"t":"se","q":"A patient has sensory ataxia, loss of vibration and positive Romberg after years of untreated syphilis. Diagnosis?","a":["Tabes dorsalis","Subacute combined degeneration","Syringomyelia","Friedreich ataxia"],"e":"Tabes dorsalis damages the dorsal columns and roots."},
{"t":"se","q":"A strict vegan has paraesthesiae, loss of vibration, positive Romberg and extensor plantars. Which condition?","a":["Subacute combined degeneration (B12 deficiency)","Tabes dorsalis with Argyll Robertson pupils","Friedreich ataxia with scoliosis and cardiomyopathy","Syringomyelia with dissociated sensory loss"],"e":"B12 deficiency damages dorsal columns and corticospinal tracts."},
{"t":"se","q":"A patient has ipsilateral facial pain/temperature loss and contralateral body pain/temperature loss with dysphagia and Horner syndrome. Diagnosis?","a":["Lateral medullary (Wallenberg) syndrome","Medial medullary (Dejerine) syndrome","Lateral pontine syndrome (AICA)","Weber syndrome (midbrain)"],"e":"Wallenberg: crossed sensory loss, Horner syndrome, ataxia, dysphagia."},
{"t":"se","q":"A man has loss of all sensory modalities on the left side of the body, later developing burning pain. Which lesion?","a":["Right thalamus","Left thalamus","Left cervical cord hemisection","Right cauda equina"],"e":"Thalamic lesions cause contralateral hemisensory loss, and later central (thalamic) pain."},
{"t":"se","q":"A woman develops burning pain, swelling and colour changes in her hand six weeks after wrist fracture. Pain is out of proportion. Diagnosis?","a":["Complex regional pain syndrome","Erythromelalgia","Fibromyalgia","Raynaud disease"],"e":"CRPS follows minor trauma; allodynia, oedema, and skin colour/temperature changes."},
{"t":"se","q":"A 38-year-old woman has widespread pain for 6 months, tender points, poor sleep and fatigue with normal blood tests. Diagnosis?","a":["Fibromyalgia","Polymyalgia rheumatica","Chronic fatigue syndrome","Myofascial pain syndrome"],"e":"Widespread chronic pain with fatigue and sleep disturbance and normal investigations suggests fibromyalgia."},
{"t":"se","q":"Which sensory modality tests the dorsal columns at the bedside?","a":["Vibration with 128 Hz tuning fork","Pinprick with a neurotip","A cold tuning fork on the skin","Hot and cold tubes"],"e":"Vibration and joint position test the dorsal columns; pinprick and temperature test the spinothalamic tract."},
{"t":"se","q":"A glove-and-stocking sensory loss most likely indicates what?","a":["Polyneuropathy","Syringomyelia","Bilateral parietal lesion","Cauda equina syndrome"],"e":"Distal symmetric loss indicates polyneuropathy; a sensory level indicates a cord lesion."},
{"t":"se","q":"Which lesion produces loss of two-point discrimination and graphaesthesia with intact primary modalities?","a":["Parietal cortex","Dorsal column lesion","Thalamic lesion","Peripheral nerve lesion"],"e":"Cortical sensory loss affects discriminative modalities."},
{"t":"ni","q":"A child stares for 10 seconds repeatedly; EEG during hyperventilation shows 3 Hz generalised spike-wave. Which diagnosis?","a":["Childhood absence epilepsy","Juvenile absence epilepsy","Juvenile myoclonic epilepsy","Focal impaired awareness seizures"],"e":"Absence seizures with 3 Hz spike-wave are provoked by hyperventilation."},
{"t":"ni","q":"A patient has NCS with markedly prolonged distal latency and conduction velocity of 12 m/s. Which neuropathy?","a":["Demyelinating","Axonal","Neuromuscular junction","Anterior horn cell"],"e":"Velocity markedly slowed and latencies prolonged indicate demyelination."},
{"t":"ni","q":"A patient with fatigable weakness has a 15% decrement on repetitive stimulation and positive AChR antibodies. Diagnosis?","a":["Myasthenia gravis","Lambert-Eaton syndrome","Polymyositis","Botulism"],"e":"Decrement >10% with AChR antibodies confirms MG."},
{"t":"ni","q":"EMG shows small, short, polyphasic motor units with early recruitment and CK is raised. Which diagnosis?","a":["Myopathy","Neurogenic anterior horn cell disease","Neuromuscular junction disease","Peripheral neuropathy"],"e":"Myopathic EMG plus raised CK points to muscle disease."},
{"t":"ni","q":"CSF: neutrophils 1000/mm3, protein 2.0 g/L, glucose 1.0 mmol/L (blood 5). Diagnosis?","a":["Bacterial meningitis","Viral meningitis","Tuberculous meningitis","Fungal meningitis"],"e":"Bacterial meningitis gives high neutrophils, high protein and low glucose."},
{"t":"ni","q":"CSF: 2 cells, protein 3 g/L in a patient with ascending weakness and areflexia. Diagnosis?","a":["Guillain-Barre syndrome","Transverse myelitis","Multiple sclerosis","Viral encephalitis"],"e":"Albuminocytological dissociation is the hallmark of GBS."},
{"t":"ni","q":"A patient has a thunderclap headache with a normal CT 14 hours later. Which CSF finding supports SAH?","a":["Xanthochromia","Red cells that clear in later tubes","Oligoclonal bands","Neutrophil pleocytosis"],"e":"LP at least 12 hours after onset shows xanthochromia."},
{"t":"ni","q":"Which scenario makes lumbar puncture unsafe before imaging?","a":["Papilloedema and focal signs","Neck stiffness with fever","Photophobia with headache","Mild neck pain"],"e":"Raised ICP signs or focal deficits require imaging first."},
{"t":"ni","q":"A patient has a pre-treatment visual evoked potential P100 latency of 140 ms (normal 100). Which condition is likely?","a":["Optic neuritis or MS","Retinal detachment","Macular degeneration","Glaucoma"],"e":"P100 delay indicates demyelination of the anterior visual pathway."},
{"t":"ni","q":"Which investigation differentiates AD from DLB or FTD by regional hypometabolism?","a":["FDG-PET","Amyloid PET","DaTscan","MRI volumetry"],"e":"AD: temporal-parietal; FTD: frontal-temporal; DLB: occipital hypometabolism."},
{"t":"ni","q":"Which evoked potential assesses brainstem function and helps detect vestibular schwannomas?","a":["Brainstem auditory evoked potentials","Somatosensory evoked potentials","Visual evoked potentials","Electronystagmography"],"e":"BAEP assesses brainstem pathways and vestibular schwannomas."},
{"t":"wk","q":"A 60-year-old man has proximal weakness, rising from a chair is difficult, CK is raised and EMG shows positive sharp waves. What is the next test to diagnose?","a":["Muscle biopsy","Nerve conduction studies","Lumbar puncture","Repetitive nerve stimulation"],"e":"Biopsy confirms the type of inflammatory myopathy."},
{"t":"wk","q":"A man with myositis has no response to steroids, slowly progressive finger flexor and quadriceps weakness. Which is the likely diagnosis?","a":["Inclusion body myositis","Polymyositis","Dermatomyositis","Necrotizing autoimmune myositis"],"e":"IBM does not respond well to immunosuppression and affects finger flexors and quadriceps."},
{"t":"wk","q":"A 25-year-old woman has ptosis worsening in the evening, diplopia and dysphagia. Which first test?","a":["AChR antibody","Anti-MuSK antibody","Anti-VGCC antibody","Anti-GQ1b antibody"],"e":"AChR antibodies are first-line; then RNS/SFEMG."},
{"t":"wk","q":"A man with MG is given gentamicin for sepsis and develops respiratory weakness. Why?","a":["Aminoglycosides impair neuromuscular transmission","Gentamicin is a cholinesterase inhibitor","Gentamicin causes muscle necrosis","Sepsis alone depletes acetylcholine"],"e":"Aminoglycosides can precipitate myasthenic crisis."},
{"t":"wk","q":"A boy with calf hypertrophy, Gowers' sign and very high CK. Which diagnosis?","a":["Duchenne muscular dystrophy","Spinal muscular atrophy","Myotonic dystrophy","Limb-girdle dystrophy"],"e":"Duchenne: X-linked dystrophin deficiency."},
{"t":"wk","q":"A patient has asymmetric weakness of right foot dorsiflexion and loss of sensation on the dorsum of the foot after crossing legs. Which site?","a":["Common peroneal nerve at the fibular head","L5 radiculopathy","Sciatic nerve at the buttock","Tibial nerve at the ankle"],"e":"Foot drop with dorsum sensory loss localises to the peroneal nerve; an L5 root lesion also affects inversion."},
{"t":"wk","q":"A patient has back pain radiating to the leg, weak big toe extension and an absent reflex? Which lesion?","a":["Radiculopathy","Lumbosacral plexopathy","Peroneal neuropathy","Cauda equina syndrome"],"e":"Radiculopathy causes pain, weakness in the myotome and sensory loss in the dermatome."},
{"t":"wk","q":"A patient has weakness of hip flexion and hip adduction with an absent knee jerk after diabetes. Which lesion?","a":["Lumbosacral plexopathy (diabetic amyotrophy)","Femoral neuropathy","Obturator neuropathy","L5 radiculopathy"],"e":"Multiple roots L1-L3 together suggests the plexus."},
{"t":"wk","q":"A man has right facial droop and left arm and leg weakness. Which lesion?","a":["Right pons","Left pons","Right midbrain","Right internal capsule"],"e":"Crossed signs: ipsilateral facial weakness with contralateral arm and leg weakness indicates a lesion in the base of the pons."},
{"t":"wk","q":"A patient has painful asymmetrical weakness in successive nerves. Which label?","a":["Mononeuritis multiplex","Polyneuropathy","Lumbosacral plexopathy","Multifocal motor neuropathy"],"e":"Painful stepwise involvement of individual nerves suggests vasculitic mononeuritis multiplex."},
{"t":"ep","q":"A 19-year-old has morning jerks of the arms, a generalised convulsion after sleep deprivation, normal MRI and EEG showing polyspike-wave. Which drug (not in pregnancy)?","a":["Sodium valproate","Carbamazepine","Phenytoin","Vigabatrin"],"e":"JME responds to valproate; carbamazepine may worsen myoclonic and absence seizures."},
{"t":"ep","q":"A 45-year-old has a rising epigastric sensation, smell of burning rubber, lip smacking and amnesia. Which localisation?","a":["Mesial temporal lobe","Lateral temporal lobe","Orbitofrontal lobe","Insula"],"e":"Typical mesial temporal lobe features; hippocampal sclerosis is the commonest cause."},
{"t":"ep","q":"A man with 3 minutes of lip-smacking and confusion lasting 2 minutes, with unaware state. Which seizure type per ILAE 2017?","a":["Focal impaired awareness seizure","Focal aware seizure","Generalised absence seizure","Focal to bilateral tonic-clonic seizure"],"e":"Focal onset with impaired awareness."},
{"t":"ep","q":"A patient with 10 minutes of continuous convulsion still seizing after lorazepam 4 mg twice. Next step?","a":["IV levetiracetam, valproate or phenytoin","A third dose of lorazepam","Oral carbamazepine loading","Rectal paraldehyde"],"e":"Second-line AED loading while preparing for anaesthesia if refractory."},
{"t":"ep","q":"Which proportion of newly diagnosed adult epilepsy is of unknown cause?","a":["About 62%","About 42%","About 82%","About 22%"],"e":"Unknown 62%, stroke 9%, trauma 9%, alcohol 6%, neurodegeneration 4%."},
{"t":"ep","q":"Metabolic cutoffs: seizures from hypoglycaemia occur at glucose below what?","a":["2.0 mmol/L (36 mg/dl)","3.0 mmol/L (54 mg/dl)","1.0 mmol/L (18 mg/dl)","4.0 mmol/L (72 mg/dl)"],"e":"Acute symptomatic seizures occur at glucose <36 mg/dl or >450 mg/dl with ketoacidosis."},
{"t":"ep","q":"A man faints at the barber, shows two jerks, recovers in 10 seconds. Diagnosis?","a":["Convulsive syncope","Generalised tonic-clonic seizure","Focal impaired awareness seizure","Psychogenic non-epileptic seizure"],"e":"Brief LOC with jerks from hypoxia is syncope."},
{"t":"ep","q":"A woman has limb thrashing out of phase, eyes forcefully shut and a long episode without tongue biting. Diagnosis?","a":["Psychogenic non-epileptic seizure","Frontal lobe seizure with hypermotor activity","Generalised tonic-clonic seizure","Convulsive syncope"],"e":"Fluttering eyelids, forceful eye closure, pelvic thrusting, out-of-phase movements."},
{"t":"ep","q":"Which factor predicts improved epilepsy prognosis?","a":["Idiopathic generalised epilepsy and normal neurology","Idiopathic generalised epilepsy with many early seizures","Structural lesion with abnormal neurology","Poor response to the first AED with normal neurology"],"e":"Better outcomes: idiopathic generalised, normal neurology, few early seizures, response to first AED."},
{"t":"ep","q":"What defines SUDEP?","a":["Sudden unexpected death in epilepsy not due to trauma, drowning or status","Sudden unexpected death in epilepsy after status epilepticus, not due to trauma or drowning","Sudden unexpected death in epilepsy due to drowning in a bath, not due to status epilepticus","Sudden unexpected death in epilepsy due to head trauma in a seizure, not due to drowning"],"e":"SUDEP excludes trauma, drowning, status or other known causes."},
{"t":"dl","q":"An 80-year-old woman admitted with a UTI is drowsy by day and agitated at night, with fluctuating attention. What diagnosis?","a":["Delirium","Dementia with behavioural symptoms","Late-life depression with psychotic features","Late-onset schizophrenia"],"e":"Acute onset, fluctuating consciousness and inattention suggest delirium."},
{"t":"dl","q":"Which feature distinguishes delirium from dementia?","a":["Disturbed consciousness with fluctuating course","Gradual onset with preserved attention","Clear consciousness until late in the course","Progressive memory loss over years"],"e":"Delirium: acute, fluctuating, impaired consciousness; dementia: progressive, clear until late stages."},
{"t":"dl","q":"4AT: alertness abnormal (4), AMT4 two errors (1), months backward not tested (2), acute change yes (4). Result?","a":["11, possible delirium","7, possible delirium","11, cognitive impairment only","9, delirium unlikely"],"e":"4AT >=4 suggests delirium."},

{"t":"dl","q":"Which drug should be reviewed first in an elderly confused patient on multiple medicines?","a":["Anticholinergic drugs such as oxybutynin","Paracetamol","Calcium carbonate","Lactulose"],"e":"Anticholinergics cause confusion."},
{"t":"dl","q":"Which measure helps prevent delirium in hospital?","a":["Reorientation, glasses, hearing aids and sleep promotion","Benzodiazepines at night to aid sleep, with reorientation","Sedatives to ensure sleep, with glasses and hearing aids","Bed rest with limited mobilisation, plus sleep promotion"],"e":"Multicomponent non-pharmacological prevention can prevent delirium in at least a third."},
{"t":"dl","q":"A patient with Lewy body dementia becomes delirious and agitated. Which drug?","a":["Lorazepam","Haloperidol 0.5 mg","Olanzapine 2.5 mg","Risperidone 0.5 mg"],"e":"DLB patients are very sensitive to antipsychotics."},
{"t":"dl","q":"Which test is not part of the initial delirium work-up?","a":["Muscle biopsy","Blood glucose","Urine dipstick","ECG"],"e":"Initial tests: glucose, FBC, U&E, LFT, calcium, CRP, TSH, B12, urine, CXR, ECG, ABG."},
{"t":"dm","q":"A man aged 70 with insidious memory loss, anomia and disorientation over 2 years; MMSE 22. Which diagnosis?","a":["Alzheimer disease","Vascular dementia","Lewy body dementia","Frontotemporal dementia"],"e":"Gradual amnesia with language problems suggests AD, mild stage."},
{"t":"dm","q":"A 63-year-old accountant becomes disinhibited, eats compulsively, loses empathy; memory is normal. MRI shows frontal atrophy. Diagnosis?","a":["Behavioural variant FTD","Alzheimer disease","Dementia with Lewy bodies","Vascular dementia"],"e":"Early behavioural change with preserved memory suggests bvFTD."},
{"t":"dm","q":"A 72-year-old has fluctuating confusion, vivid visual hallucinations of children and mild parkinsonism. Diagnosis?","a":["Dementia with Lewy bodies","Alzheimer disease with psychosis","Vascular dementia","Delirium due to infection"],"e":"Core features of DLB."},
{"t":"dm","q":"A 58-year-old has rapid dementia over 4 months, myoclonus and periodic sharp waves. Which CSF marker?","a":["14-3-3 protein / positive RT-QuIC","Oligoclonal IgG bands","Low amyloid beta 1-42 with raised tau","Xanthochromia"],"e":"CJD diagnosis supported by 14-3-3 protein and RT-QuIC."},
{"t":"dm","q":"A patient aged 47 with a family history, onset at 45 and early-onset AD. Which genes?","a":["APP, PS1 or PS2","ApoE4 homozygosity","HTT and PrP","MAPT and GRN"],"e":"Early-onset familial AD: APP, PSEN1, PSEN2."},
{"t":"dm","q":"A patient has MMSE 24 but was a High Court judge, another has 24 as a labourer. Which concept?","a":["Cognitive reserve","Mild cognitive impairment","Pseudodementia","Normal ageing"],"e":"Cognitive reserve explains differing functional impairment for equal pathology."},
{"t":"dm","q":"Which dementia mimics should be excluded?","a":["Depression, MCI, metabolic causes, structural lesions","Depression, normal ageing, Lewy body dementia and vascular dementia","Delirium, schizophrenia, Alzheimer disease and FTD","Only Alzheimer disease and vascular dementia"],"e":"Mimics: depression, normal ageing, MCI, metabolic causes, SOL."},
{"t":"dm","q":"What is the dementia screen blood panel?","a":["FBC, U&E, LFT, TFT, glucose, B12, folate, calcium, CRP","FBC, U&E, LFT, glucose, CK, troponin and autoantibodies","FBC, U&E, LFT, TFT, glucose, ammonia, lactate and cortisol","FBC, U&E, LFT, TFT, glucose, B12, folate, calcium and ANA"],"e":"Plus urinalysis, neurological exam, MMSE/ACE-III, and MRI or CT."},
{"t":"dm","q":"Which biomarker is a promising blood test for AD?","a":["Plasma phosphorylated tau 217","Plasma neurofilament light","Serum 14-3-3","Plasma TDP-43"],"e":"Plasma p-tau217 accurately identifies biological AD."},
{"t":"dm","q":"Which CSF markers does NICE list for AD investigation?","a":["Total tau, phospho-tau and amyloid beta 1-42/1-40","14-3-3 protein and RT-QuIC","Oligoclonal bands and IgG index","Neurofilament light and alpha-synuclein seeding"],"e":"NICE suggests FDG-PET/SPECT or CSF biomarkers in further investigation."},
{"t":"dm","q":"Which vascular dementia is due to occlusion of small vessels supplying white matter?","a":["Binswanger disease","Multi-infarct dementia","Strategic single-infarct dementia","Cerebral amyloid angiopathy"],"e":"Binswanger: subcortical arteriosclerotic encephalopathy."},

{"t":"at","q":"A patient has intention tremor, nystagmus and scanning speech. Which lesion?","a":["Cerebellum","Basal ganglia","Dorsal columns","Frontal lobe"],"e":"Cerebellar signs."},
{"t":"at","q":"A 20-year-old has ataxia, absent reflexes, extensor plantars, scoliosis, pes cavus and cardiomyopathy. Diagnosis?","a":["Friedreich ataxia","Spinocerebellar ataxia type 3","Ataxia telangiectasia","Ataxia with oculomotor apraxia type 1"],"e":"Friedreich: GAA expansion, ECG changes, diabetes, optic atrophy."},
{"t":"at","q":"A 55-year-old smoker develops subacute pancerebellar syndrome and anti-Hu antibodies. Which cancer?","a":["Small cell lung cancer","Non-small cell lung cancer","Thymoma","Hodgkin lymphoma"],"e":"Anti-Hu, anti-CV2, anti-VGCC all associate with small cell lung cancer."},

{"t":"at","q":"A patient walks with a stiff right leg circumducting and the right arm flexed. Which lesion?","a":["Left cerebral hemisphere / UMN","Right cerebral hemisphere / UMN","Left cerebellar hemisphere","Right basal ganglia"],"e":"Hemiparetic gait."},
{"t":"ps","q":"A doctor is about to interview an agitated patient. Which preparation does the lecture stress?","a":["Pre-plan staff safety","Begin with a brief physical examination","Start with sensitive substance-use questions","Wait for a collateral history before entering"],"e":"Staff safety should be pre-planned before entering the room."},

{"t":"se","q":"A 58-year-old has sudden vertigo, hoarseness, dysphagia and Horner syndrome on the right, with loss of pain and temperature on the right face and left body. Lesion?","a":["Right lateral medulla","Left lateral medulla","Right lateral pons","Right thalamus"],"e":"Crossed sensory loss (ipsilateral face, contralateral body) with Horner and bulbar signs is lateral medullary syndrome."},
{"t":"se","q":"Six weeks after a wrist fracture a woman has burning hand pain out of proportion, swelling, shiny cool skin and pain on light touch. X-ray shows patchy osteopenia. Best statement?","a":["Complex regional pain syndrome; treat with early mobilisation and analgesia","Complex regional pain syndrome; treat with prolonged immobilisation","Fibromyalgia; confirm by counting tender points","Carpal tunnel syndrome; offer decompression"],"e":"CRPS follows trauma with allodynia, oedema and autonomic change; early mobilisation is favoured."},
{"t":"se","q":"A 41-year-old woman has 2 years of widespread aching, morning stiffness, fatigue, poor sleep and multiple tender points. CK, ESR, blood count and neurological examination are normal. Best interpretation?","a":["Fibromyalgia, a clinical diagnosis with normal tests","Polymyositis, needing muscle biopsy","Polymyalgia rheumatica, expected to have raised ESR","CRPS type 1, regional with trophic change"],"e":"Widespread pain, fatigue and unrefreshing sleep with normal investigations is fibromyalgia."},
{"t":"se","q":"Five months after a stroke a 70-year-old has left-sided numbness with constant burning pain made worse by light touch. Lesion and term?","a":["Right thalamus; central pain with allodynia","Right thalamus; phantom limb pain","Left thalamus; central pain with allodynia","Right parietal cortex; neglect with hyperalgesia"],"e":"Thalamic lesions cause contralateral loss and later central pain with allodynia."},
{"t":"se","q":"A man cannot identify a coin in his right hand with eyes closed or name a number traced on his palm, although pinprick, vibration and position are normal. Lesion?","a":["Left parietal cortex","Right parietal cortex","Left dorsal column","Right medial lemniscus"],"e":"Astereognosis and agraphaesthesia with intact primary modalities indicate contralateral parietal cortex."},
{"t":"ni","q":"A 6-year-old stares for 10 seconds many times daily with eyelid fluttering. EEG during hyperventilation shows bilateral synchronous 3 Hz spike-and-wave. Diagnosis and activating procedure?","a":["Childhood absence epilepsy; hyperventilation","Childhood absence epilepsy; photic stimulation","Juvenile myoclonic epilepsy; hyperventilation","Mesial temporal epilepsy; sleep deprivation"],"e":"3 Hz spike-wave with staring spells is childhood absence epilepsy, provoked by hyperventilation."},
{"t":"ni","q":"A 24-year-old has ascending weakness with absent ankle jerks. NCS show prolonged distal latencies, slowed velocities and absent F-waves. CSF has 2 cells/mm3 and protein 2.4 g/L. Interpretation?","a":["Demyelinating polyneuropathy with albuminocytological dissociation (GBS)","Axonal polyneuropathy with albuminocytological dissociation (GBS)","Demyelinating polyneuropathy with oligoclonal bands (MS)","Neuromuscular junction disorder with decrement (MG)"],"e":"Slowed velocities and high protein with few cells are typical of Guillain-Barre syndrome."},
{"t":"ni","q":"A 31-year-old has fatigable ptosis and diplopia. CK and NCS are normal, repetitive stimulation shows a 6% decrement and AChR antibodies are negative. Most sensitive next test?","a":["Single-fibre EMG looking for increased jitter","Needle EMG looking for small polyphasic units","Muscle biopsy looking for perifascicular atrophy","Visual evoked potentials looking for P100 delay"],"e":"SFEMG is the most sensitive test of neuromuscular transmission when RNS is borderline."},
{"t":"ni","q":"A 52-year-old has proximal weakness, CK 4000 U/L, small short polyphasic units with positive sharp waves on EMG, and biopsy showing endomysial lymphocytes invading non-necrotic fibres. Diagnosis?","a":["Polymyositis","Dermatomyositis","Inclusion body myositis","Necrotizing autoimmune myositis"],"e":"Endomysial T cells invading healthy fibres define polymyositis; dermatomyositis shows perifascicular atrophy."},
{"t":"ni","q":"A 4-year-old boy has calf hypertrophy, Gowers sign and CK 25000 U/L. Biopsy shows fibre size variation, fat and connective tissue replacement and absent dystrophin staining. Diagnosis and inheritance?","a":["Duchenne muscular dystrophy; X-linked recessive","Duchenne muscular dystrophy; autosomal recessive","Limb-girdle dystrophy; autosomal recessive","Becker muscular dystrophy; X-linked recessive"],"e":"Absent dystrophin with this phenotype is Duchenne dystrophy, X-linked recessive."},
{"t":"ni","q":"A febrile patient with neck stiffness has CSF with high opening pressure, 1200 neutrophils/mm3, protein 3 g/L and glucose 1.1 mmol/L (serum 5.4). Conclusion and action?","a":["Bacterial meningitis; antibiotics immediately","Viral meningitis; supportive care only","Tuberculous meningitis; await culture before treating","Fungal meningitis; start amphotericin only after CT"],"e":"Neutrophils, high protein and low CSF:serum glucose indicate bacterial meningitis requiring immediate antibiotics."},
{"t":"ni","q":"A thunderclap headache began 14 hours ago and CT is normal. LP shows red cells in all tubes and a yellow supernatant. Interpretation and next step?","a":["Xanthochromia suggesting SAH; vascular imaging","Traumatic tap; discharge with advice","Xanthochromia suggesting MS; MRI brain","Oligoclonal bands suggesting SAH; vascular imaging"],"e":"Persistent red cells with xanthochromia after 12 hours supports subarachnoid haemorrhage; look for aneurysm."},
{"t":"ni","q":"A 29-year-old with optic neuritis has periventricular lesions on MRI. What CSF finding is expected?","a":["Mild lymphocytosis with CSF-restricted oligoclonal IgG","Marked neutrophilia with raised protein and low CSF glucose","Normal cell count with very high protein and a normal IgG index","Raised red cells with xanthochromia and a normal IgG index"],"e":"Intrathecal oligoclonal bands support multiple sclerosis."},
{"t":"ni","q":"A confused febrile patient has papilloedema and right hemiparesis. Which approach to lumbar puncture is correct?","a":["Give antibiotics and image first; LP only if safe","Do the LP at once then image","Do the LP only after EEG","Withhold antibiotics until CSF is obtained"],"e":"Raised ICP signs or focal deficits require imaging first; antibiotics must not be delayed."},
{"t":"ni","q":"A 67-year-old with progressive memory loss has bilateral temporoparietal hypometabolism on FDG-PET and a positive Pittsburgh compound scan. Best interpretation?","a":["Alzheimer disease","Dementia with Lewy bodies","Frontotemporal dementia","Vascular dementia"],"e":"AD shows temporoparietal hypometabolism and amyloid positivity; DLB occipital, FTD frontotemporal hypometabolism."},
{"t":"wk","q":"A 62-year-old woman has trouble climbing stairs and combing her hair for 3 months, with a violaceous eyelid rash and scaly patches over her knuckles. CK is raised. Which additional step is most important?","a":["Screen for underlying malignancy","Check AChR antibodies","Perform nerve conduction studies for GBS","Check anti-GAD antibodies"],"e":"Heliotrope rash and Gottron papules with proximal weakness is dermatomyositis, which in adults may accompany cancer."},
{"t":"wk","q":"A 70-year-old has slowly progressive finger flexion and quadriceps weakness with falls. CK is mildly raised; biopsy shows endomysial inflammation and rimmed vacuoles. Prednisolone has not helped. Diagnosis?","a":["Inclusion body myositis","Polymyositis","Dermatomyositis","Necrotizing autoimmune myositis"],"e":"Finger flexor and quadriceps weakness with rimmed vacuoles and steroid resistance is IBM."},
{"t":"wk","q":"A 55-year-old on a statin has severe proximal weakness with CK 12000 U/L persisting 3 months after stopping the drug. Biopsy shows necrotic fibres with little inflammation. Which entity?","a":["Necrotizing autoimmune myositis","Polymyositis with CD8 invasion of non-necrotic fibres","Inclusion body myositis with rimmed vacuoles","Duchenne dystrophy with absent dystrophin staining"],"e":"Statin-triggered necrotizing myositis can persist after withdrawal and needs immunosuppression."},
{"t":"wk","q":"A 24-year-old woman has ptosis and diplopia worse in the evening and difficulty chewing. AChR antibodies are positive and chest CT shows an anterior mediastinal mass. Management?","a":["Anticholinesterase, immunosuppression and thymectomy","Anticholinesterase and immunosuppression; thymectomy contraindicated","Plasma exchange only, then observation","Steroids alone with biopsy of the mass"],"e":"A thymoma in MG is an indication for thymectomy alongside symptomatic and immunosuppressive treatment."},
{"t":"wk","q":"A man with myasthenia gravis given gentamicin for pneumonia develops dysphagia and shallow breathing within a day. Mechanism and action?","a":["Aminoglycoside impairs neuromuscular transmission; stop it and support ventilation","Aminoglycoside causes myotoxicity with raised CK; stop it and give steroids","Cholinergic crisis from excess pyridostigmine; give atropine and withhold anticholinesterases","Bacterial toxin spread to the neuromuscular junction; give antitoxin and ventilate"],"e":"Aminoglycosides, quinine and beta-blockers can precipitate myasthenic weakness."},
{"t":"wk","q":"A 6-year-old has frequent falls, a waddling gait, large calves and uses his hands to climb up his legs. Which pairing is right?","a":["Proximal hip girdle weakness; waddling gait in a dystrophy","Distal weakness; steppage gait in a neuropathy","Corticospinal damage; spastic gait in cerebral palsy","Cerebellar damage; ataxic gait in a tumour"],"e":"Proximal weakness produces waddling and Gowers sign; Duchenne dystrophy shows calf pseudohypertrophy."},
{"t":"wk","q":"A diabetic man has abrupt severe right thigh pain then weakness of hip flexion and knee extension, thigh wasting and an absent knee jerk. Spine MRI is normal. Diagnosis?","a":["Diabetic amyotrophy (lumbosacral plexopathy)","L4 radiculopathy from disc herniation","Femoral mononeuropathy from entrapment","Lumbar cord compression"],"e":"Painful asymmetrical proximal leg weakness in diabetes localises to the lumbosacral plexus."},
{"t":"wk","q":"A 66-year-old has arm wasting and fasciculations, brisk leg reflexes with extensor plantars and no sensory loss. EMG shows widespread denervation. Diagnosis?","a":["Amyotrophic lateral sclerosis","Cervical spondylotic myelopathy","Multifocal motor neuropathy","Inclusion body myositis"],"e":"Combined UMN and LMN signs without sensory loss define ALS."},
{"t":"wk","q":"After sitting cross-legged a man has foot drop and sensory loss over the dorsum of the foot, but foot inversion and hip abduction are normal. Lesion?","a":["Common peroneal neuropathy at the fibular head","L5 radiculopathy with weak inversion and hip abduction","Sciatic neuropathy at the buttock with weak knee flexion","Lumbosacral plexopathy with weak hip flexion and painful foot"],"e":"Preserved inversion and hip abduction separate a peroneal neuropathy from L5 radiculopathy."},
{"t":"wk","q":"A 59-year-old hypertensive has sudden right hemiplegia with left facial weakness and left lateral rectus palsy. Lesion?","a":["Left pontine base","Right pontine base","Left internal capsule","Right cerebral cortex"],"e":"Ipsilateral cranial nerve palsies with contralateral hemiparesis localise to the pons on the side of the palsies."},
{"t":"ep","q":"A 17-year-old has arm jerks on waking, a convulsion after a late night and a normal MRI. EEG shows generalised polyspike-wave. Which treatment choice and caution?","a":["Valproate or levetiracetam; valproate is the most teratogenic in women","Carbamazepine or phenytoin; both worsen myoclonus and absence","Lamotrigine only; it may aggravate myoclonus in some patients","Levetiracetam or valproate; levetiracetam is the most teratogenic in women"],"e":"JME responds to valproate or levetiracetam; valproate carried about 10% major malformations in the EURAP table."},
{"t":"ep","q":"A 40-year-old has stereotyped episodes of rising epigastric sensation, burning smell, lip smacking and 2 minutes of amnesia. MRI shows left hippocampal sclerosis. Seizure type and drug choice?","a":["Focal impaired awareness; lamotrigine or levetiracetam","Focal aware; lamotrigine or levetiracetam, with no amnesia","Focal impaired awareness; valproate or ethosuximide","Generalised absence; ethosuximide or valproate"],"e":"Mesial temporal focal impaired awareness seizures are treated with lamotrigine or levetiracetam."},
{"t":"ep","q":"A man has a first seizure on day 4 after an ischaemic stroke. Which statement is best?","a":["Acute symptomatic seizure; epilepsy not yet diagnosed","Unprovoked seizure; epilepsy diagnosed immediately","Acute symptomatic seizure; lifelong antiepileptic needed","Provoked by a trigger; excluded as a seizure"],"e":"Seizures within about a week of a documented brain insult are acute symptomatic and unlikely to recur."},
{"t":"ep","q":"A woman has thrashing out-of-phase limb movements, forceful eye closure, crying afterwards and rapid return to normal. Ictal EEG is unchanged and prolactin normal. Best diagnosis?","a":["Psychogenic non-epileptic seizures","Generalised tonic-clonic seizure","Frontal lobe epilepsy with hypermotor seizure","Convulsive syncope"],"e":"Out-of-phase movements, forceful eye closure, rapid reorientation and normal ictal EEG favour non-epileptic attacks."},
{"t":"ep","q":"A man has seized for 12 minutes despite lorazepam 4 mg IV twice. Next step?","a":["IV levetiracetam, valproate or phenytoin and call anaesthesia","A third benzodiazepine dose and observe for 30 minutes","Oral lamotrigine and observe","Immediate anaesthesia without second-line drug"],"e":"After two benzodiazepine doses give a second-line AED and prepare for anaesthesia if refractory."},
{"t":"ep","q":"A 30-year-old continues to have seizures after adequate trials of valproate and lamotrigine, both tolerated. What is the next consideration?","a":["Drug-resistant epilepsy; surgical evaluation","Drug-resistant epilepsy; stop treatment","Pseudo-resistance; repeat the same drugs","Provoked seizures; lumbar puncture"],"e":"Failure of two appropriate tolerated AEDs defines drug resistance; surgical evaluation is indicated."},
{"t":"ep","q":"A 78-year-old has 4 hours of amnesia with repeated questioning after emotional stress, preserved identity and otherwise normal examination. Diagnosis?","a":["Transient global amnesia","Focal impaired awareness seizure","Posterior circulation TIA","Psychogenic fugue"],"e":"Isolated anterograde amnesia lasting hours with no other deficit is transient global amnesia."},
{"t":"ep","q":"Which case best fits a focal seizure rather than TIA or migraine?","a":["Tingling spreading up the arm over seconds, then jerking and postictal sleepiness","Sudden left arm weakness lasting 20 minutes with no positive symptoms","Zigzag visual line enlarging over 20 minutes followed by headache","Sudden isolated amnesia lasting several hours"],"e":"Progressive positive symptoms over seconds with a postictal state indicate a focal seizure."},
{"t":"dl","q":"An 83-year-old with mild Alzheimer disease is admitted with a UTI. At night she is agitated and sees children in the room, in the morning she is drowsy but cooperative. Which feature most supports delirium?","a":["Acute onset with fluctuating attention and consciousness","Impaired short-term memory that worsens in the evening","Disorientation to place that is present throughout the day","Visual hallucinations of children seen only at night"],"e":"Acute onset and fluctuating inattention with altered consciousness are the hallmarks of delirium."},
{"t":"dl","q":"Same patient: 4AT shows alertness drowsy (4), AMT4 two errors (2), months backwards untestable (2), acute change present (4). Interpretation and first step?","a":["Score 12: possible delirium; find and treat precipitants","Score 12: dementia with behavioural symptoms; start donepezil","Score 4: unlikely delirium; observe and repeat in a week","Score 12: possible delirium; routine CT head before anything else"],"e":"A 4AT score of 4 or more suggests possible delirium; investigate infection, drugs, dehydration and retention."},
{"t":"dl","q":"An elderly man with Parkinson disease becomes delirious after a chest infection. If sedation is unavoidable which drug does the lecture advise?","a":["Lorazepam 0.5-1 mg","Haloperidol 0.5 mg","Olanzapine 5 mg","Chlorpromazine 25 mg"],"e":"Antipsychotics worsen parkinsonism; lorazepam is advised in PD and Lewy body dementia."},
{"t":"dl","q":"A malnourished drunk man is confused with nystagmus and ataxia, and glucose is low. How should he be treated?","a":["IV thiamine given alongside or before glucose","IV glucose first and thiamine only if symptoms persist","IV haloperidol and then glucose","Oral thiamine after CT head"],"e":"Thiamine prevents or treats Wernicke encephalopathy and should not be delayed."},
{"t":"dl","q":"Which drug list in a 79-year-old with new confusion is most likely contributory?","a":["Oxybutynin, amitriptyline and diphenhydramine","Amoxicillin, paracetamol and ramipril","Levothyroxine, atorvastatin and aspirin","Metformin, bisoprolol and omeprazole"],"e":"The lecture's table lists anticholinergic drugs including bladder stabilisers, tricyclics and antihistamines."},
{"t":"dl","q":"Which scenario justifies urgent CT head in a delirious patient?","a":["Fall with head injury and new focal signs","Fever and cough with hypoxia on admission","Dehydration and hyponatraemia with a normal examination","Postoperative day 2 with pain and urinary retention"],"e":"CT is indicated for focal signs, low GCS, head injury, suspected encephalitis or raised ICP, not routinely."},
{"t":"dl","q":"An 88-year-old pulls out her catheter and shouts at night. Which first measures does the lecture favour?","a":["Orientation cues, glasses and hearing aids, sleep promotion, avoid restraint","Physical restraint with low-dose sedation and a night nurse nearby","Transfer to a quieter bay at night with regular benzodiazepines","Reality orientation with regular benzodiazepines and bedrails"],"e":"Multicomponent supportive care comes first; avoid restraint, catheters and moves."},
{"t":"dl","q":"Why does a mild infection precipitate severe delirium in an old demented brain?","a":["Primed microglia overreact to cytokines when cholinergic inhibition is reduced","Dopaminergic neurons are lost, so peripheral cytokines cross an intact barrier","Astrocytes fail to clear amyloid during infection, allowing neurotoxicity","Myelin is lost in old age, so cytokines cause conduction block"],"e":"The neuroinflammatory hypothesis involves IL-6 and IL-8, primed microglia and reduced cholinergic inhibition."},
{"t":"dm","q":"A 74-year-old retired teacher has 2 years of getting lost and repeating questions, MMSE 22/30. Examination, B12, TSH and calcium are normal; MRI shows medial temporal atrophy. Likely diagnosis and drug?","a":["Alzheimer disease; donepezil","Vascular dementia; aspirin","Dementia with Lewy bodies; haloperidol","Frontotemporal dementia; memantine"],"e":"Progressive amnesia with temporal atrophy and normal mimics suggests AD, treated with cholinesterase inhibitors."},
{"t":"dm","q":"A 71-year-old has well-formed visual hallucinations of small animals, marked fluctuation in alertness, mild rigidity and acts out dreams. A GP neuroleptic caused severe rigidity. Diagnosis and approach?","a":["Dementia with Lewy bodies; cholinesterase inhibitor, avoid typical antipsychotics","Alzheimer disease; stop the neuroleptic and start memantine","Vascular dementia; antiplatelet therapy, statin and a typical antipsychotic","Parkinson disease dementia; levodopa titration and quetiapine only"],"e":"Hallucinations, fluctuation, parkinsonism, REM behaviour disorder and neuroleptic sensitivity indicate DLB."},
{"t":"dm","q":"A 59-year-old salesman has become rude, eats sweets and has lost interest in his family over 18 months. Memory and visuospatial tests are normal, executive function poor. MRI shows bilateral frontal and anterior temporal atrophy. Diagnosis?","a":["Behavioural variant frontotemporal dementia","Alzheimer disease, frontal variant, with early amnesia","Vascular dementia, subcortical, with stepwise decline","Normal pressure hydrocephalus with gait apraxia and incontinence"],"e":"Early personality change with preserved memory and frontotemporal atrophy is bvFTD."},
{"t":"dm","q":"A 68-year-old hypertensive diabetic has stepwise decline, a small stepping gait, urgency and emotional lability. Hachinski score is 9; MRI shows diffuse white matter change. Diagnosis?","a":["Vascular dementia (subcortical small vessel disease)","Alzheimer disease with vascular risk factors","Dementia with Lewy bodies","Normal pressure hydrocephalus"],"e":"HIS of 7 or more favours vascular dementia; stepping gait and pseudobulbar signs fit Binswanger disease."},
{"t":"dm","q":"A 61-year-old develops rapidly progressive dementia over 3 months with myoclonus and ataxia. EEG shows periodic sharp waves and MRI DWI shows cortical ribboning. Supportive CSF finding?","a":["14-3-3 protein or positive RT-QuIC","Oligoclonal bands","Xanthochromia","Low glucose with neutrophils"],"e":"CJD is supported by periodic sharp waves, DWI change and CSF 14-3-3 or RT-QuIC."},
{"t":"dm","q":"Two 70-year-old patients score 24/30 on MMSE with similar plaque load; one is a former labourer and the other a judge who functioned normally until recently. Which concept explains this?","a":["Cognitive reserve","Pseudodementia","Mild cognitive impairment","Delirium"],"e":"Education and occupational complexity allow tolerance of more pathology before symptoms."},
{"t":"dm","q":"A highly educated lawyer scores 27/30 on MMSE but her family report decline. Best next step?","a":["ACE-III with informant history","Reassure and discharge, since MMSE is above the cut-off","Start memantine on the strength of family concern","Repeat the MMSE in a year and review then"],"e":"MMSE is insensitive in high-education patients; ACE-III below 82/100 suggests dementia."},
{"t":"dm","q":"A 66-year-old has had Parkinson disease for 5 years and now has cognitive decline and hallucinations. Classification and expectation?","a":["Parkinson disease dementia; occurs in 60-75% over time","Dementia with Lewy bodies; occurs in 5% over time","Parkinson disease dementia; occurs in 5% over time","Alzheimer disease; unrelated to Parkinson disease"],"e":"Parkinsonism at least 12 months before dementia is PDD; most PD patients eventually develop dementia."},
{"t":"dm","q":"A 39-year-old with untreated HIV and CD4 count 90 has poor concentration and slowed thinking; MRI shows cortical and subcortical atrophy. Which statement is correct?","a":["HIV-associated dementia; HAART reduces its incidence","HIV-associated dementia; donepezil is curative","CJD; CSF 14-3-3 would be expected","Vascular dementia; antiplatelets are indicated"],"e":"HIV dementia occurs with low CD4 counts and atrophy, and HAART reduces its incidence."},
{"t":"dm","q":"Which feature should make a clinician doubt Alzheimer disease as the cause of dementia?","a":["Sudden onset with focal signs and early gait disturbance","Insidious amnesia with anomia and disorientation in time","Disorientation to time and place with late visuospatial difficulty","Gradual onset with prominent amnesia and preserved gait"],"e":"Unlikely AD: sudden onset, focal signs, seizures, early gait dysfunction, parkinsonism, early hallucinations."},
{"t":"at","q":"A 22-year-old has ataxia since age 14, dysarthria, absent ankle jerks, extensor plantars, scoliosis, pes cavus and hypertrophic cardiomyopathy. Gene defect and inheritance?","a":["GAA expansion; autosomal recessive (Friedreich ataxia)","CAG expansion; autosomal dominant (SCA3)","GAA expansion; autosomal dominant (SCA1)","CAG expansion; autosomal recessive (ataxia-telangiectasia)"],"e":"Friedreich ataxia: recessive GAA expansion with areflexia, extensor plantars, cardiomyopathy and diabetes."},
{"t":"at","q":"A 5-year-old develops unsteadiness and slurred speech 2 weeks after chickenpox. He is afebrile and alert, MRI is normal. Which statement is correct?","a":["Post-infectious cerebellitis; recovery usually complete within weeks","Post-infectious cerebellitis; permanent deficit is usual","Medulloblastoma; needs urgent resection","Friedreich ataxia; needs genetic confirmation"],"e":"Para-infectious cerebellar inflammation affects children and usually resolves fully; exclude drugs and posterior fossa mass."},
{"t":"at","q":"A 58-year-old woman has subacute ataxia, dysarthria and nystagmus over 6 weeks, an ovarian mass and anti-Yo antibodies. Diagnosis and implication?","a":["Paraneoplastic cerebellar degeneration; search for gynaecological or breast cancer","Paraneoplastic cerebellar degeneration; search for small cell lung cancer","Alcoholic cerebellar degeneration; stop alcohol","Post-infectious cerebellitis; give steroids and observe"],"e":"Anti-Yo relates to breast and gynaecological tumours; neurology can precede cancer diagnosis."},
{"t":"at","q":"A 45-year-old with long-standing alcohol misuse has a wide-based gait with heel-shin ataxia and normal arms; MRI shows vermian atrophy. Best statement?","a":["Alcoholic cerebellar degeneration; abstinence and nutrition give limited improvement","Alcoholic cerebellar degeneration; full recovery expected with thiamine","Friedreich ataxia; GAA testing needed","Spinocerebellar ataxia 6; CAG testing needed"],"e":"Vermian atrophy with truncal and gait ataxia evolves over weeks to months; recovery is limited."},
{"t":"at","q":"A man develops ataxia, areflexia and ophthalmoplegia 10 days after gastroenteritis. Which antibody and why is the ataxia not cerebellar?","a":["Anti-GQ1b; proprioceptive loss in Miller Fisher syndrome","Anti-GQ1b; vermian degeneration in Miller Fisher syndrome","Anti-Yo; sensory neuronopathy in paraneoplastic disease","Anti-AChR; fatigable weakness in myasthenia"],"e":"Miller Fisher variant of GBS: IgG anti-GQ1b in over 90%; ataxia reflects proprioceptive loss."},
{"t":"at","q":"A 67-year-old hypertensive has sudden vertigo, vomiting, headache and inability to walk. CT shows a right cerebellar infarct compressing the fourth ventricle, and he is drowsy. Priority?","a":["Neurosurgical review for decompression","Epley manoeuvre","Early physiotherapy and discharge","Vestibular suppressants at home"],"e":"Cerebellar stroke with depressed arousal indicates brainstem compression or hydrocephalus and may need decompression."},
{"t":"at","q":"A 64-year-old has foot tingling, positive Romberg and a stamping gait worse in the dark. Vibration and ankle jerks are absent, strength normal. Which ataxia and causes?","a":["Sensory ataxia; diabetes, B12 deficiency, tabes or paraproteinaemia","Cerebellar ataxia; alcohol, hypothyroidism or coeliac disease","Sensory ataxia; alcohol, hypothyroidism or coeliac disease","Frontal gait; hydrocephalus or tumour"],"e":"Loss of proprioception produces a stamping, wide-based gait worse with eyes closed or in the dark."},
{"t":"at","q":"A 68-year-old has a small-stepped gait with feet stuck to the floor, urinary urgency and mild cognitive decline. Arm swing and tone are preserved. Gait and likely cause?","a":["Frontal (magnetic) gait; normal pressure hydrocephalus","Parkinsonian gait; idiopathic Parkinson disease","Frontal (magnetic) gait; cerebellar degeneration","Waddling gait; inflammatory myopathy"],"e":"Gait initiation failure with preserved arm swing, incontinence and cognitive change suggests hydrocephalus."},
{"t":"sl1","q":"A volunteer is deprived of sleep for 36 hours then allowed to sleep. Expected recovery night pattern?","a":["More N3 early and more REM later, without full repayment","More N3 early and complete repayment of lost hours","Less N3 and more N1 throughout","More REM early and less N3 later"],"e":"Sleep rebound is stage specific and incomplete."},
{"t":"sl1","q":"A polysomnogram shows low-amplitude mixed-frequency activity with sleep spindles and K-complexes. Which stage?","a":["N2","N1","N3","REM"],"e":"N2 contains spindles and K-complexes; N1 is the theta transition; N3 has high-amplitude slow waves."},
