function draw(level){
 var pool=known(level,SEL),N=Math.min(COUNT,pool.length),by={};
 pool.forEach(function(q){(by[q.t]=by[q.t]||[]).push(q)});
 var ids=Object.keys(by),quota={},used=0,rem=[];
 ids.forEach(function(id){var x=N*by[id].length/pool.length;quota[id]=Math.floor(x);used+=quota[id];rem.push({id:id,r:x-quota[id]+Math.random()*1e-6})});
 rem.sort(function(a,b){return b.r-a.r});
 for(var i=0;used<N&&i<rem.length*3;i++){var id=rem[i%rem.length].id;if(quota[id]<by[id].length){quota[id]++;used++}}
 var out=[];
 ids.forEach(function(id){
  var w=by[id].map(function(q){var m=mark(level,q),wt=m==='p'?3:m==='k'?0.25:1;return{q:q,k:Math.pow(Math.random(),1/wt)}});
  w.sort(function(a,b){return b.k-a.k});
  w.slice(0,quota[id]).forEach(function(x){out.push(x.q)})});
 return shuffle(out).map(function(q){return{k:qkey(level,q),t:q.t,q:q.q,e:q.e,pick:null,ok:false,tips:0,elim:[],clue:null,checked:false,simple:null,
  opts:shuffle(q.a.map(function(text,i){return{text:text,ok:i===0}}))}})}

function start(level){var qs=draw(level);if(!qs.length)return;S={level:level,qs:qs,i:0,done:false,res:null};warnUnanswered=false;confirmQuit=0;show('quiz');renderQuiz(true)}

var STOP='the a an and or of in on to for with by is are was were that this which from as at it its be not no'.split(' ');
function maskClue(q){var correct=q.opts.filter(function(o){return o.ok})[0].text.toLowerCase();
 var words=correct.split(/[^a-z0-9]+/).filter(function(w){return w&&STOP.indexOf(w)<0&&(w.length>=4||/\d/.test(w))});
 return q.e.replace(/[A-Za-z0-9][A-Za-z0-9\-]*/g,function(tok){var l=tok.toLowerCase();return words.indexOf(l)>-1?new Array(tok.length+1).join('█'):tok})}

function renderQuiz(full){
 var q=S.qs[S.i],L=LEVELS.filter(function(x){return x.id===S.level})[0];
 var answered=S.qs.filter(function(x){return x.pick!==null}).length,h='';
 h+='<div class="eyebrow">'+L.name+' · Question '+(S.i+1)+' of '+S.qs.length+'</div><div class="bar"><i style="width:'+(100*(S.i+1)/S.qs.length)+'%"></i></div><div class="dots">';
 S.qs.forEach(function(x,i){var c='dot'+(x.pick!==null?' ans':'')+(i===S.i?' cur':'')+(x.checked?(x.ok?' ok':' no'):'');h+='<button class="'+c+'" data-go="'+i+'" aria-label="Go to question '+(i+1)+'">'+(i+1)+'</button>'});
 h+='</div><div class="card"><span class="tag">'+esc(tname(q.t))+'</span><p class="q">'+esc(q.q)+'</p><div class="opts" role="radiogroup" aria-label="Answer options">';
 q.opts.forEach(function(o,i){var c='opt';if(q.pick===i)c+=' sel';if(q.elim.indexOf(i)>-1)c+=' elim';
  if(q.checked){c='opt';if(o.ok)c+=' right';else if(q.pick===i)c+=' wrong'}
  h+='<button class="'+c+'" role="radio" aria-checked="'+(q.pick===i)+'" data-opt="'+i+'"'+(q.checked||q.elim.indexOf(i)>-1?' disabled':'')+'><span class="k">'+LET[i]+'</span><span class="t">'+esc(o.text)+'</span></button>'});
 h+='</div>';
 var m=MARKS[q.k]||'';
 h+='<div class="marks"><button class="mk k" data-mark="k" aria-pressed="'+(m==='k')+'">I know this</button><button class="mk p" data-mark="p" aria-pressed="'+(m==='p')+'">Need practice</button></div>';
 if(q.checked){h+='<div class="fb '+(q.ok?'ok':'no')+'"><b>'+(q.ok?'Correct.':'Not quite.')+'</b> '+(q.ok?'':'The answer is '+LET[q.opts.map(function(o){return o.ok}).indexOf(true)]+'. ')+esc(q.e)+'</div>';
  if(!q.ok)h+=simpleBlock(q,'q')}
 else if(mode==='test'||mode==='learn'){
  if(q.tips>=1)h+='<div class="tip"><b>Tip 1.</b> '+esc(q.clue)+'</div>';
  if(q.tips>=2)h+='<div class="tip"><b>Tip 2.</b> Two wrong options are crossed out.</div>'}
 h+='<div class="row" style="margin-top:14px">';
 if(!q.checked){h+='<button class="btn" data-tip="1"'+(q.tips>=2?' disabled':'')+'>Tip ('+q.tips+'/2)</button>';
  if(mode==='learn')h+='<button class="btn primary" data-check="1"'+(q.pick===null?' disabled':'')+'>Check answer</button>'}
 h+='</div></div>';
 if(warnUnanswered){var first=S.qs.map(function(x){return x.pick}).indexOf(null);
  h+='<div class="warnbox"><b>'+(S.qs.length-answered)+' question'+(S.qs.length-answered===1?'':'s')+' unanswered.</b> Unanswered questions count as wrong.<div class="row" style="margin-top:10px"><button class="btn" data-first="'+first+'">Go to first unanswered</button><button class="btn primary" data-finish="force">Finish anyway</button></div></div>'}
 h+='<div class="nav"><button class="btn" data-prev="1"'+(S.i===0?' disabled':'')+'>Previous</button><div class="row">';
 h+='<button class="btn" data-quit="1">'+(confirmQuit?'Click again to quit':'Quit')+'</button>';
 if(S.i<S.qs.length-1)h+='<button class="btn primary" data-next="1">Next</button>';
 h+='<button class="btn'+(S.i===S.qs.length-1?' primary':'')+'" data-finish="1">Finish</button></div></div>';
 $('quiz').innerHTML=h;
 if(full)window.scrollTo(0,0)}

function simpleBlock(q,ctx){
 var h='<div class="simple-wrap" data-sk="'+q.k+'">';
 if(q.simple&&q.simple.text){h+='<div class="simple">'+q.simple.text.split(/\n\s*\n/).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>'}
 else if(q.simple&&q.simple.err){h+='<div class="simple">'+esc(q.simple.err)+' <button class="btn link" data-explain="'+q.k+'">Try again</button></div>'}
 else if(q.simple&&q.simple.busy){h+='<div class="simple">Writing a simple explanation…</div>'}
 else h+='<div style="margin-top:8px"><button class="btn" data-explain="'+q.k+'">Explain this simply</button></div>';
 return h+'</div>'}

function pickOpt(i){var q=S.qs[S.i];if(q.checked)return;q.pick=i;q.ok=q.opts[i].ok;renderQuiz(false)}
function tip(){var q=S.qs[S.i];if(q.checked||q.tips>=2)return;q.tips++;
 if(q.tips===1)q.clue=maskClue(q);
 else{var wrong=[];q.opts.forEach(function(o,i){if(!o.ok&&q.elim.indexOf(i)<0)wrong.push(i)});shuffle(wrong).slice(0,2).forEach(function(i){q.elim.push(i);if(q.pick===i){q.pick=null;q.ok=false}})}
 renderQuiz(false)}
function setMark(v){var q=S.qs[S.i];if(MARKS[q.k]===v)delete MARKS[q.k];else MARKS[q.k]=v;delete STREAKS[q.k];lsSet('marks',MARKS);lsSet('streaks',STREAKS);renderQuiz(false)}

function finish(force){
 var un=S.qs.filter(function(x){return x.pick===null}).length;
 if(un&&!force){warnUnanswered=true;renderQuiz(false);return}
 warnUnanswered=false;
 var score=0,by={},notes={auto:[],reset:[]};
 S.qs.forEach(function(q){q.ok=q.pick!==null&&q.opts[q.pick].ok;if(q.ok)score++;by[q.t]=by[q.t]||{n:0,ok:0};by[q.t].n++;if(q.ok)by[q.t].ok++;
  if(q.pick!==null&&!q.checked){
   if(q.ok){STREAKS[q.k]=(STREAKS[q.k]||0)+1;if(STREAKS[q.k]>=AUTO_AT){MARKS[q.k]='k';STREAKS[q.k]=0;notes.auto.push(q)}}
   else{STREAKS[q.k]=0;if(MARKS[q.k]==='k'){delete MARKS[q.k];notes.reset.push(q)}}}});
 lsSet('marks',MARKS);lsSet('streaks',STREAKS);
 var revealed=S.qs.some(function(q){return q.checked}),all=SEL.length===TOPICS.length;
 if(all&&!revealed){var b=lsGet('best2-'+S.level,null);if(!b||score/S.qs.length>b.score/b.total)lsSet('best2-'+S.level,{score:score,total:S.qs.length})}
 S.done=true;S.res={score:score,by:by,notes:notes};showAll=false;show('results');renderResults()}

function verdict(p){return p>=90?'Excellent. This level is in good shape.':p>=75?'Solid. Review the missed questions below.':p>=50?'Getting there. Mark the weak ones for practice.':'Plenty to revisit. Learn mode can help.'}
function renderResults(){
 var r=S.res,n=S.qs.length,pc=Math.round(100*r.score/n),h='';
 h+='<div class="eyebrow">Results</div><div class="score">'+r.score+' / '+n+'</div><p><b>'+pc+'%</b> · '+verdict(pc)+'</p>';
 if(r.notes.auto.length)h+='<div class="note">'+r.notes.auto.length+' question'+(r.notes.auto.length>1?'s':'')+' marked "I know this" after '+AUTO_AT+' correct answers in a row.</div>';
 if(r.notes.reset.length)h+='<div class="note">'+r.notes.reset.length+' known question'+(r.notes.reset.length>1?'s':'')+' reset after a wrong answer.</div>';
 h+='<div class="sec eyebrow">By lecture</div>';
 Object.keys(r.by).forEach(function(id){var b=r.by[id];h+='<div class="lec"><span>'+esc(tname(id))+'</span><div class="bar"><i class="g" style="width:'+(100*b.ok/b.n)+'%"></i></div><span class="muted">'+b.ok+'/'+b.n+'</span></div>'});
 var list=S.qs.filter(function(q){return showAll||!q.ok});
 h+='<div class="sec row" style="justify-content:space-between"><span class="eyebrow">'+(showAll?'All questions':'Missed questions')+' ('+list.length+')</span><span class="row"><button class="btn link" id="toggleAll">'+(showAll?'Show missed only':'Show all')+'</button>'+(S.qs.some(function(q){return !q.ok&&!(q.simple&&q.simple.text)})?'<button class="btn" data-explainall="1">Explain all missed</button>':'')+'</span></div>';
 if(!list.length)h+='<p class="muted">No missed questions. Nice work.</p>';
 list.forEach(function(q){var yours=q.pick===null?'No answer':q.opts[q.pick].text,right=q.opts.filter(function(o){return o.ok})[0].text,m=MARKS[q.k]||'';
  h+='<div class="miss"><span class="tag">'+esc(tname(q.t))+'</span><p class="q" style="font-size:1.02rem">'+esc(q.q)+'</p>';
  if(!q.ok)h+='<p class="a"><b style="color:var(--bad)">Your answer:</b> '+esc(yours)+'</p>';
  h+='<p class="a"><b style="color:var(--good)">Correct:</b> '+esc(right)+'</p><p class="a muted">'+esc(q.e)+'</p>';
  h+='<div class="marks" data-mk="'+q.k+'"><button class="mk k" data-rmark="k" aria-pressed="'+(m==='k')+'">I know this</button><button class="mk p" data-rmark="p" aria-pressed="'+(m==='p')+'">Need practice</button></div>';
  if(!q.ok)h+=simpleBlock(q,'r');h+='</div>'});
 h+='<div class="nav"><button class="btn primary" data-again="1">Try this level again</button><button class="btn" data-change="1">Change level or lectures</button></div>';
 $('results').innerHTML=h}

var sampleP=null;
function getSample(){if(!sampleP)sampleP=(window.claude&&window.claude.use?window.claude.use('sample'):Promise.resolve(null)).then(function(s){return s||null},function(){return null});return sampleP}
function findQ(k){for(var i=0;i<S.qs.length;i++)if(S.qs[i].k===k)return S.qs[i]}
function refresh(){if(!$('results').hidden)renderResults();else if(!$('quiz').hidden)renderQuiz(false)}
function explain(k){var q=findQ(k);if(!q)return Promise.resolve();
 q.simple={busy:true};refresh();
 var yours=q.pick===null?'(no answer)':q.opts[q.pick].text,right=q.opts.filter(function(o){return o.ok})[0].text;
 var prompt='You are a patient tutor for a medical student revising Brain and Behaviour (MED 301).\nLecture: '+tname(q.t)+'\nQuestion: '+q.q+'\nOptions: '+q.opts.map(function(o,i){return LET[i]+') '+o.text}).join(' | ')+'\nStudent chose: '+yours+'\nCorrect answer: '+right+'\nReference note from the slides: '+q.e+
 '\n\nExplain in very simple English, in this order: (1) the mechanism or cause-and-effect story, or an everyday comparison; (2) why the chosen option is tempting but does not fit; (3) one question to ask yourself next time. Plain text only, no markdown, about 150 words, faithful to the reference note.';
 return getSample().then(function(sample){
  if(!sample){q.simple={err:'AI explanations are not available here.'};refresh();return}
  return sample(prompt,{cache:false,modelTier:'default',onText:function(r){q.simple={text:r.text};refresh()}}).then(function(r){q.simple={text:r.text};refresh()})
 }).catch(function(e){var c=e&&e.code;q.simple={err:c==='not_granted'?'Permission was not granted for explanations.':c==='rate_limited'?'Too many requests. Wait a moment.':'Could not write the explanation.'};refresh()})}
function explainAll(){var qs=S.qs.filter(function(q){return !q.ok&&!(q.simple&&q.simple.text)}),p=Promise.resolve();qs.forEach(function(q){p=p.then(function(){return explain(q.k)})})}

document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(d.mode)return setMode(d.mode);
 if(d.count){COUNT=+d.count;lsSet('count',COUNT);return renderStart()}
 if(d.topic){var i=SEL.indexOf(d.topic);if(i>-1)SEL.splice(i,1);else SEL.push(d.topic);lsSet('topics',SEL);return renderStart()}
 if(b.id==='selAll'){SEL=TOPICS.map(function(t){return t.id});lsSet('topics',SEL);return renderStart()}
 if(d.dt){var ls=tLevels(d.dt),on=!tDone(d.dt);ls.forEach(function(l){if(on)DONE[d.dt+':'+l]=true;else delete DONE[d.dt+':'+l]});saveDone();return renderStart()}
 if(d.dtl){var k2=d.dtl+':'+d.dlv;if(DONE[k2])delete DONE[k2];else DONE[k2]=true;saveDone();return renderStart()}
 if(b.id==='incDone'){INCDONE=!INCDONE;saveDone();return renderStart()}
 if(b.id==='clearDone'){DONE={};saveDone();return renderStart()}
 if(d.level)return start(d.level);
 if(!S)return;
 if(d.go!==undefined){S.i=+d.go;return renderQuiz(true)}
 if(d.opt!==undefined)return pickOpt(+d.opt);
 if(d.tip)return tip();
 if(d.check){var q=S.qs[S.i];if(q.pick!==null){q.checked=true;q.ok=q.opts[q.pick].ok;renderQuiz(false)}return}
 if(d.mark)return setMark(d.mark);
 if(d.prev){S.i=Math.max(0,S.i-1);return renderQuiz(true)}
 if(d.next){S.i=Math.min(S.qs.length-1,S.i+1);return renderQuiz(true)}
 if(d.first!==undefined){warnUnanswered=false;S.i=+d.first;return renderQuiz(true)}
 if(d.finish)return finish(d.finish==='force');
 if(d.quit){if(confirmQuit){confirmQuit=0;S=null;renderStart();return show('start')}confirmQuit=1;renderQuiz(false);setTimeout(function(){if(confirmQuit){confirmQuit=0;if(S&&!S.done&&!$('quiz').hidden)renderQuiz(false)}},3000);return}
 if(d.explain)return explain(d.explain);
 if(d.explainall)return explainAll();
 if(b.id==='toggleAll'){showAll=!showAll;return renderResults()}
 if(d.rmark){var k=b.parentNode.dataset.mk;if(MARKS[k]===d.rmark)delete MARKS[k];else MARKS[k]=d.rmark;delete STREAKS[k];lsSet('marks',MARKS);lsSet('streaks',STREAKS);var sib=b.parentNode.querySelectorAll('.mk');for(var j=0;j<sib.length;j++)sib[j].setAttribute('aria-pressed',MARKS[k]===sib[j].dataset.rmark);return}
 if(d.again)return start(S.level);
 if(d.change){S=null;renderStart();return show('start')}
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='prog')PROGOPEN=e.target.open},true);
document.addEventListener('input',function(e){if(e.target.id==='cust'){var v=parseInt(e.target.value,10);if(v>=1){COUNT=Math.min(v,MAXQ);lsSet('count',COUNT);var cs=document.querySelectorAll('[data-count]');for(var i=0;i<cs.length;i++)cs[i].setAttribute('aria-pressed',+cs[i].dataset.count===COUNT)}}});

$('foot').textContent='Questions were written from your lecture slides and not individually re-verified. Marks, done lists and best scores are saved in this browser only.';
setMode(mode);renderStart();show('start');
})();
</script>
